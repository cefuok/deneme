e been + V3","The window will have been broken"]]],["h","Mantığı nasıl kuruyoruz?"],["p","Her satırda iki ek birleşiyor: zaman eki ve “-ıl” eki. Örneğin “kırılır”: “ar-er” eki geniş zaman olduğunu ve fiilin v1 haliyle yazılması gerektiğini söyler; “-ıl” takısı ise be v3 koymamız gerektiğini söyler. O zaman “be”nin v1 halini yazıyoruz → am/is/are + V3."],["p","“Kırılmıştı”: “mıştı” eki perfect olduğunu ve have/has v3 gerektiğini söyler; “-ıl” takısı be v3 der. O zaman “be”nin v3 halini yazıyoruz → have/has <b>been</b> V3."],["p","“Kırılıyor”: “yor” eki be + ing gerektirir; “-ıl” be v3 der → am/is/are <b>being</b> V3."],["r","Bu konuyu okuyarak anlamak biraz zor olabilir; videoya girip çevirileri nasıl yapmışım, nelere dikkat etmişim, sesli olarak dinlerseniz daha iyi oturacaktır."]]},{"id":"passive-edat","s":"s5","title":"Edatların Passive Halleri","tag":"Passive","sum":"to be V3, by being V3 — eklerin edilgen hali.","blocks":[["p","Ana fiilin passive çekimlerinden çıkıp, size bu zamana kadar öğrettiğim “to – mak için”, “by – arak/erek”, “while – ken” vb. eklerin passive hallerini göreceğiz. En çok göreceğiniz passive edat “to – mak için / ma – me” anlamıyla kullandığımız ektir."],["h","Neden “to + fiil” kullanıyorduk?"],["e","I drive a car to go to job.","İşe gitmek için araba sürerim.","Why? – Neden sürüyorum? → To go to job. “Go – gitme” eylemini yapan kişi hâlâ benim, yani aktif canlı bir özne. Bu yüzden to + fiil olarak ilerlemek zorundayız."],["h","Özne cansız olunca"],["e","The car is driven.","Araba sürülür.","Yanlış: The car drives — araba aktif olarak “drive” eylemini yapamaz. Eylemi yapamayan öznelere be v3 koyarız."],["e","The car is driven to be gone to job.","İşe gidilmek için araba sürülür.","“Why – niçin sürülür?” diye sorduğumuzda: özne cansız, passive eki “-ıl/-il” ile gelir, “to – mak için” → be v3."],["r","Mantık: <b>“-ılmak için” ekini to be v3 olarak kodlayabiliriz.</b>"],["h","“-arak / -erek” → by being V3"],["p","“-arak/-erek” ekini by olarak veriyoruz ve kendisinden sonra ing takısı koyarak fiili isimleştiriyoruz. By ekinden sonra gelen “-ul/-ül” eki ise be v3 olur."],["e","By being beaten.","Dövülerek.","Beat → v3 hali beaten. Bu mantıkla her şeyi passive hâle getirebiliriz."]]},{"id":"passive-relative","s":"s5","title":"Passive Relative Clause","tag":"Passive","sum":"“-ılan” eki: which/who + be + V3.","blocks":[["p","Geldik çok sevdiğim bir eke: <b>“-ılan”</b> eki. Türkçede sıkça kullandığımız bir ek ve iki konuya bağlı olarak ortaya çıkıyor:"],["l",["“an-en” konusu → which / who / that (relative clause)","“-ıl” konusu → be-v3 (passive)"]],["r","Bu iki yapı birleşince <b>“-ılan”</b> eki ortaya çıkıyor: which is v3 · which was v3 · who was v3 · who is v3"],["p","Bu yapıyı kurabilmemiz için bir isme ihtiyacımız vardı ve bu ismin detayına an-en (which/who) yapısıyla iniyorduk. Eğer bu isimleri passive olarak betimlemek istersek, ekstra olarak be v3 (yani -ıl/-il) ekini koymamız gerekir."],["e","The window which was broken","Kırılan cam","Cam → the window, kırılan (an → which), -ıl → was, kır → broken."],["e","The home which was seen","Görülen ev","Ev → home, en → which, -ıl → was, gör → seen."],["e","The child who is loved by his family","Ailesi tarafından sevilen çocuk","Çocuk → the kid, sevilen → en → who → -ıl → is → sev → loved, tarafından → by, ailesi → his family."],["p","Bu şekilde bir sürü örnek yapılabilir. Ödev kısmında videoda daha detaylı anlatıyor ve çeviriyor olacağım."]]},{"id":"kapanis","s":"s5","title":"Kapanış","tag":"Son","sum":"Kitabın kapanış sözleri.","blocks":[["p","Sonuç olarak, size göstermiş olduğum ekler ve yapıların, en zor cümleleri kurup çevirebilmeniz için yeterli olduğunu görebilirsiniz. Tabii ki, yazılı olarak bu konuları anlatmak, detaylı bir şekilde sözlü olarak anlatmaktan daha zordur; fakat ödev videolarını izleyerek, konunun mantığını ve inceliklerini anlamış olmanızı umuyorum."],["p","Eğer İngilizceye veya başka Avrupa dillerine bu şekilde bakmayı öğrendiyseniz ve bakış açınızı değiştirdiyseniz, geleneksel eğitimde gördüğünüzden çok daha etkili bir öğrenme yöntemi kazanmış olursunuz."],["p","Daha detaylı konu anlatımı ve yazılı olarak aktaramadığım birçok “ek mantığı” konusuna erişmek için konu anlatımı paketlerimden yararlanabilirsiniz."],["p","Eğer bu kitabı faydalı bulduysanız ve başkalarına önermek isterseniz, bana Instagram hesabımdan yorum bırakabilirsiniz. Hepinize kitabımı okuduğunuz ve zaman ayırdığınız için teşekkür eder, eğitim hayatınızda başarılar dilerim."],["r","Unutmayın: <b>Doğru kaynak ve doğru yöntem, öğrenmenin en hızlı yoludur.</b>"]]}];

an zarfları","cards":[{"f":"every","b":"her (day / week / month / year)","n":""},{"f":"sometimes","b":"bazen","n":""},{"f":"never","b":"asla, hiç","n":""},{"f":"always","b":"her zaman, daima","n":""},{"f":"often","b":"sık sık","n":""},{"f":"usually","b":"genellikle","n":""},{"f":"rarely","b":"nadiren","n":""},{"f":"do / does","b":"yardımcı fiil","n":"DO → I, you, we, they · DOES → he, she, it"}]}],"present-cont":[{"name":"Şimdiki zaman","cards":[{"f":"now","b":"şimdi","n":""},{"f":"right now","b":"tam şimdi","n":""},{"f":"at the moment","b":"şu anda","n":""},{"f":"am/is/are + fiil-ing","b":"şimdiki zaman yapısı","n":"I am playing football."}]}],"future":[{"name":"Gelecek zaman","cards":[{"f":"will","b":"plansız, spontan, kanıtı olmayan","n":""},{"f":"be going to","b":"planlı, kanıtı olan","n":""},{"f":"tomorrow","b":"yarın","n":""},{"f":"next week / month / year","b":"gelecek hafta / ay / yıl","n":""},{"f":"in the future","b":"gelecekte","n":""},{"f":"won’t","b":"will not — olumsuz","n":""}]}],"past":[{"name":"Düzensiz fiiller (V1–V2–V3)","cards":[{"f":"go","b":"went · gone","n":"gitmek"},{"f":"come","b":"came · come","n":"gelmek"},{"f":"drink","b":"drank · drunk","n":"içmek"},{"f":"eat","b":"ate · eaten","n":"yemek"},{"f":"see","b":"saw · seen","n":"görmek"},{"f":"take","b":"took · taken","n":"almak"},{"f":"give","b":"gave · given","n":"vermek"},{"f":"make","b":"made · made","n":"yapmak"},{"f":"write","b":"wrote · written","n":"yazmak"},{"f":"read","b":"read · read","n":"okumak"},{"f":"buy","b":"bought · bought","n":"satın almak"},{"f":"bring","b":"brought · brought","n":"getirmek"},{"f":"break","b":"broke · broken","n":"kırmak"},{"f":"speak","b":"spoke · spoken","n":"konuşmak"},{"f":"sleep","b":"slept · slept","n":"uyumak"},{"f":"run","b":"ran · run","n":"koşmak"},{"f":"swim","b":"swam · swum","n":"yüzmek"},{"f":"sing","b":"sang · sung","n":"şarkı söylemek"},{"f":"sit","b":"sat · sat","n":"oturmak"},{"f":"stand","b":"stood · stood","n":"ayakta durmak"},{"f":"know" have never studied English."}]}],"modals":[{"name":"Modals","cards":[{"f":"can","b":"%100 yapabilme · yüksek ihtimal · samimi rica","n":"I can play football. / Can I order?"},{"f":"may","b":"%50 ihtimal · ricalı soru","n":"May I go out?"},{"f":"might","b":"%25 yapabilite","n":"I might swim today."},{"f":"must","b":"zorunluluk · yüksek ihtimalli tahmin · yasak (mustn’t)","n":"I must do my homework."},{"f":"should","b":"tavsiye","n":"You should go to the doctor."}]}],"semi-modals":[{"name":"Semi-modals","cards":[{"f":"be able to","b":"ebilir — can/may/might’ın zamanla çekilen hâli","n":"was/were able to · will be able to"},{"f":"to be able to","b":"ebilmek için","n":"I am coming to be able to see you."},{"f":"be supposed to","b":"malı-meli — should’un çekilen hâli","n":"You were supposed to come."},{"f":"have to / has to / had to","b":"malı-meli — must’ın çekilen hâli","n":"You will have to come."}]}],"modals-perfect":[{"name":"Modals perfect","cards":[{"f":"might / may have V3","b":"mış olabilir","n":"He might have come to home."},{"f":"should have V3","b":"mış olmalıydı (pişmanlık)","n":"You should have studied."},{"f":"must have V3","b":"mış olmalı (yüksek ihtimal)","n":"Ahmet must have come to home."},{"f":"mış","b":"have / has + V3","n":"Perfect’in temel kodu"}]}],"future-perfect":[{"name":"Future perfect","cards":[{"f":"will have + V3","b":"mış olacak","n":"I will have finished my homework."},{"f":"by","b":"e kadar — sonrasına zaman gelir","n":"by tomorrow"},{"f":"until","b":"e kadar — sonrasına zaman veya cümle gelir","n":"until you come"},{"f":"for / since","b":"dır-dir / den beri","n":""}]}],"if-clause":[{"name":"If clause","cards":[{"f":"Type 1","b":"if + özne + v1 , özne + will/can/may/might + fiil","n":"If I go to the library, I can study."},{"f":"Type 2","b":"if + özne + v2 , özne + would/could + fiil","n":"If I studied, I would pass the exam."},{"f":"Type 3","b":"if + özne + had v3 , özne + would/could have v3","n":"If I had seen her, I would have taken a photo."},{"f":"unless","b":"if not — sonrasında olumlu cümle ister","n":"Unless I study, I won’t pass."},{"f":"what if","b":"ya … olsaydı","n":"What if you were a superhero?"},{"f":"if I were you","b":"senin yerinde olsaydım","n":""}]}],"passive":[{"name":"Passive — zaman tablosu","cards":[{"f":"am / is / are + V3","b":"kırılır","n":"The window is broken."},{"f":"was / were + V3","b":"kırıldı","n":"The window was broken."},{"f":"will be + V3","b":"kırılacak","n":"The window will be broken."},{"f":"was/were going to be + V3","b":"kırılacaktı","n":"The window was going to be broken."},{"f":"have / has been + V3","b":"kırılmıştı","n":"The window has been broken."},{"f":"can/may/might be + V3","b":"kırılabilir","n":"The window might be broken."},{"f":"must / should be + V3","b":"kırılmalı","n":"The window must be broken."},{"f":"am/is/are being + V3","b":"kırılıyor","n":"The window is being broken."},{"f":"was/were being + V3","b":"kırılıyordu","n":"The window was being broken."},{"f":"might have been + V3","b":"kırılmış olabilir","n":"The window might have been broken."},{"f":"must have been + V3","b":"kırılmış olmalı","n":"The window must have been broken."},{"f":"will have been + V3","b":"kırılmış olacak","n":"The window will have been broken."},{"f":"-ıl / -il","b":"be + V3","n":"Passive’in temel kodu"}]}],"passive-edat":[{"name":"Passive edatlar","cards":[{"f":"to + fiil","b":"mak için (aktif özne)","n":"I drive a car to go to job."},{"f":"to be + V3","b":"ılmak için (edilgen)","n":"The car is driven to be gone to job."},{"f":"by + fiil-ing","b":"arak / erek","n":"by listening to music"},{"f":"by being + V3","b":"ularak / ülerek","n":"by being beaten"}]}],"passive-relative":[{"name":"“-ılan” kalıbı","cards":[{"f":"which is / was + V3","b":"ılan (cansız)","n":"the window which was broken"},{"f":"who is / was + V3","b":"ılan (insan)","n":"the child who is loved"},{"f":"by","b":"tarafından","n":"loved by his family"},{"f":"-an/-en + -ıl","b":"-ılan","n":"relative clause + passive"}]}],"cumle-yapisi":[{"name":"Nesneler","cards":[{"f":"coffee","b":"kahve","n":""},{"f":"water","b":"su","n":""},{"f":"tea","b":"çay","n":""},{"f":"milk","b":"süt","n":""},{"f":"money","b":"para","n":""},{"f":"bread","b":"ekmek","n":""},{"f":"cheese","b":"peynir","n":""},{"f":"rice","b":"pirinç","n":""},{"f":"a book","b":"kitap","n":""},{"f":"a car","b":"araba","n":""},{"f":"a pencil","b":"kalem","n":""},{"f":"a letter","b":"mektup","n":""},{"f":"a message","b":"mesaj","n":""},{"f":"a cake","b":"pasta","n":""},{"f":"a film","b":"film","n":""},{"f":"music","b":"müzik","n":""},{"f":"football","b":"futbol","n":""},{"f":"the door","b":"kapı","n":""},{"f":"the window","b":"cam","n":""}]}]};

<script>
/* ---------- durum ---------- */
const KEY="ekmantigi.v3";
const defState={read:{},video:{},prog:{},cards:{},last:null,theme:"system"};
let S=load();
function load(){try{const r=localStorage.getItem(KEY);return r?Object.assign({},defState,JSON.parse(r)):Object.assign({},defState);}catch(e){return Object.assign({},defState);}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function applyTheme(){try{if(S.theme==="system")document.documentElement.removeAttribute("data-theme");else document.documentElement.setAttribute("data-theme",S.theme);}catch(e){}}
applyTheme();

const SESSION=10;
const byId=id=>TOPICS.find(t=>t.id===id);
const secTopics=s=>TOPICS.filter(t=>t.s===s);
const bank=id=>BANKS[id]||[];
const decks=id=>DECKS[id]||[];
const prog=id=>S.prog[id]||{pos:0,answered:0,correct:0};
const deckKey=(id,i)=>id+"#"+i;
const deckState=(id,i)=>S.cards[deckKey(id,i)]||{known:[]};
function deckKnown(id,i){return deckState(id,i).known.length;}
function topicCardTotal(id){return decks(id).reduce((a,d)=>a+d.cards.length,0);}
function topicCardKnown(id){return decks(id).reduce((a,d,i)=>a+Math.min(deckKnown(id,i),d.cards.length),0);}
function topicPct(t){
  const n=bank(t.id).length, c=topicCardTotal(t.id);
  let parts=[S.read[t.id]?1:0];
  if(n){parts.push(S.video[t.id]?1:0); parts.push(Math.min(1,prog(t.id).answered/n));}
  if(c)parts.push(topicCardKnown(t.id)/c);
  return Math.round(parts.reduce((a,b)=>a+b,0)/parts.length*100);
}
const topicDone=t=>topicPct(t)>=100;
const topicStarted=t=>topicPct(t)>0;

/* ---------- ikonlar ---------- */
const I={
home:'<path d="M3 10.2 12 3l9 7.2V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
list:'<path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/>',
pen:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
cards:'<rect x="3" y="7" width="13" height="13" rx="2"/><path d="M7.5 4h11A1.5 1.5 0 0 1 20 5.5v11"/>',
chart:'<path d="M3 20h18"/><rect x="5" y="11" width="3.4" height="6" rx="1"/><rect x="10.3" y="7" width="3.4" height="10" rx="1"/><rect x="15.6" y="13" width="3.4" height="4" rx="1"/>',
back:'<path d="M15 19l-7-7 7-7"/>',
search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.2-3.2"/>',
play:'<circle cx="12" cy="12" r="9"/><path d="M10 8.6 16 12l-6 3.4z"/>',
check:'<path d="M4 12.5 9 17.5 20 6.5"/>',
flip:'<path d="M3 12a9 9 0 0 1 15.5-6.2M21 12a9 9 0 0 1-15.5 6.2"/><path d="M18 3v4h-4M6 21v-4h4"/>',
sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
moon:'<path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/>',
auto:'<circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z"/>'
};
const svg=(p,c)=>'<svg class="'+(c||"")+'" viewBox="0 0 24 24" aria-hidden="true">'+p+'</svg>';
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function norm(s){return String(s||"").toLocaleLowerCase("tr").replace(/[’'`]/g,"'").replace(/[.,!?]/g,"").replace(/\s+/g," ").trim();}

/* ---------- blok çizimi ---------- */
function block(b){
  const k=b[0];
  if(k==="p")return "<p>"+b[1]+"</p>";
  if(k==="h")return "<h4>"+b[1]+"</h4>";
  if(k==="r")return '<div class="rule">'+b[1]+"</div>";
  if(k==="l")return "<ul>"+b[1].map(x=>"<li>"+x+"</li>").join("")+"</ul>";
  if(k==="e")return '<div class="ex"><span class="en">'+b[1]+'</span><span class="tr">'+b[2]+"</span>"+(b[3]?'<span class="nt">'+b[3]+"</span>":"")+"</div>";
  if(k==="dl")return '<dl class="kv">'+b[1].map(r=>"<dt>"+r[0]+"</dt><dd>"+r[1]+"</dd>").join("")+"</dl>";
  if(k==="f")return '<div class="formula">'+b[1].map((x,i)=>x===","?"<b>,</b>":"<span"+(i%2?' class="k"':"")+">"+x+"</span>").join("<b>+</b>")+"</div>";
  if(k==="tbl")return '<div class="tablewrap"><table><thead><tr>'+b[1].map(h=>"<th>"+h+"</th>").join("")+"</tr></thead><tbody>"+b[2].map(r=>"<tr>"+r.map((c,i)=>"<td>"+(i===2?"<b>"+c+"</b>":c)+"</td>").join("")+"</tr>").join("")+"</tbody></table></div>";
  return "";
}

/* ---------- çerçeve ---------- */
function topbar(title,sub,back){
  const t=document.getElementById("topbar");
  const ic=S.theme==="dark"?I.moon:(S.theme==="light"?I.sun:I.auto);
  t.innerHTML=(back?'<button class="iconbtn" id="backbtn" aria-label="Geri">'+svg(I.back)+"</button>":"")
    +'<div style="flex:1;min-width:0">'+(sub?'<span class="tb-sub">'+sub+"</span>":"")+'<div class="tb-title">'+title+"</div></div>"
    +'<button class="iconbtn" id="themebtn" aria-label="Tema değiştir">'+svg(ic)+"</button>";
  const b=document.getElementById("backbtn");
  if(b)b.onclick=()=>{if(history.length>1)history.back();else go("topics");};
  document.getElementById("themebtn").onclick=()=>{S.theme=S.theme==="system"?"dark":(S.theme==="dark"?"light":"system");save();applyTheme();render();};
}
function tabbar(active){
  const items=[["home","Ana Sayfa",I.home],["topics","Konular",I.list],["practice","Test",I.pen],["cards","Kartlar",I.cards],["progress","İlerleme",I.chart]];
  document.getElementById("tabbar").innerHTML=items.map(([id,label,ic])=>
    '<a class="tab" href="#'+id+'"'+(active===id?' aria-current="page"':"")+">"+svg(ic)+"<span>"+label+"</span></a>").join("");
}
const VIEWS=["home","topics","practice","cards","progress"];
const route=()=>(location.hash||"#home").slice(1);
function go(h){if(location.hash==="#"+h)render();else location.hash="#"+h;}
window.addEventListener("hashchange",()=>{window.scrollTo(0,0);render();});

/* ---------- genel sayılar ---------- */
function totals(){
  let qa=0,qc=0,qn=0,ck=0,ct=0,done=0,vid=0;
  TOPICS.forEach(t=>{const p=prog(t.id);qa+=p.answered;qc+=p.correct;qn+=bank(t.id).length;
    ck+=topicCardKnown(t.id);ct+=topicCardTotal(t.id);if(topicDone(t))done++;if(S.video[t.id])vid++;});
  const pct=Math.round(TOPICS.reduce((a,t)=>a+topicPct(t),0)/TOPICS.length);
  return {answered:qa,correct:qc,all:qn,known:ck,cards:ct,done,videos:vid,pct};
}
const sectionPct=sid=>{const ts=secTopics(sid);return ts.length?Math.round(ts.reduce((a,t)=>a+topicPct(t),0)/ts.length):0;};
function nextTopic(){
  if(S.last){const t=byId(S.last);if(t&&!topicDone(t))return t;}
  return TOPICS.find(t=>!topicDone(t))||TOPICS[0];
}

/* ---------- ana sayfa ---------- */
function viewHome(){
  const T=totals(),nx=nextTopic(),R=2*Math.PI*28;
  const acc=T.answered?Math.round(T.correct/T.answered*100):0;
  return '<div class="stack">'
  +'<div class="hero"><h1>Ek Mantığı</h1><span class="sub">'+TOPICS.length+' konu · '+T.all+' test sorusu · '+T.cards+' kelime kartı</span></div>'
  +'<div class="card" style="display:flex;flex-direction:column;gap:13px">'
    +'<div class="ring"><svg viewBox="0 0 66 66"><circle class="track" cx="33" cy="33" r="28"/><circle class="val" cx="33" cy="33" r="28" stroke-dasharray="'+R+'" stroke-dashoffset="'+(R*(1-T.pct/100))+'"/></svg>'
    +'<div><div class="ringnum">%'+T.pct+'</div><div class="small muted">genel ilerleme · '+T.done+'/'+TOPICS.length+' konu bitti</div></div></div>'

function viewTopics(){
  const q=QUERY.trim().toLocaleLowerCase("tr");
  const chips='<div class="chiprow">'+["all"].concat(SECTIONS.map(s=>s.id)).map(id=>{
      const name=id==="all"?"Tümü":SECTIONS.find(s=>s.id===id).name;

  let list="",found=0;
  (FILTER==="all"?SECTIONS:SECTIONS.filter(s=>s.id===FILTER)).forEach(s=>{
    const ts=secTopics(s.id).filter(t=>!q||(t.title+" "+t.sum+" "+t.tag).toLocaleLowerCase("tr").includes(q));
    if(!ts.length)return;found+=ts.length;

function row(t){

    +'<div class="tmain"><div class="tname">'+t.title+"</div>"

    +(pct?'<div class="bar" style="margin-top:7px"><i style="width:'+pct+'%"></i></div>':"")+"</div></a>";
}

function toggleVideo(id){S.video[id]=!S.video[id];S.last=id;save();render();}
function toggleRead(id){S.read[id]=!S.read[id];S.last=id;save();render();}

/* ---------- test motoru ---------- */
let Q={key:null,list:[],i:0,answered:false,ok:null,correct:0,pick:null,typed:"",src:null,start:0};
function startSession(id,shuffleMode){
  const b=bank(id);let list,start=0;
  if(id==="mix"){list=MIX;}
  else{
    const p=prog(id);start=p.pos%Math.max(1,b.length);
    list=b.slice(start,start+SESSION);
    if(list.length<SESSION&&b.length>SESSION)list=list.concat(b.slice(0,SESSION-list.length));
    if(shuffleMode)list=list.slice().sort(()=>Math.random()-0.5);
  }
  Q={key:id,list:list,i:0,answered:false,ok:null,correct:0,pick:null,typed:"",src:id,start:start};
}
function quizShell(id){
  if(Q.key!==id)startSession(id);
  const b=bank(id),p=prog(id);
  if(Q.i>=Q.list.length)return quizEnd(id);
  const q=Q.list[Q.i];
  const label=q.t==="mc"?"Çoktan seçmeli":(q.t==="fill"?"Boşluğu doldur":"Çeviri: Türkçe → İngilizce");
  const dots='<div class="qprog">'+Q.list.map((_,i)=>'<i class="'+(i<Q.i?"on":"")+'"></i>').join("")+"</div>";
  const head=id==="mix"?'<span class="qtype">'+label+" · "+(Q.i+1)+"/"+Q.list.length+(q._t?" · "+q._t:"")+"</span>"
    :'<span class="qtype">'+label+" · "+(Q.i+1)+"/"+Q.list.length+" · bankada "+b.length+" soru</span>";
  let body="";
  if(q.t==="mc"){
    body='<div class="qtext">'+q.q+'</div><div class="opts">'+q.o.map((o,i)=>{
      let c="";if(Q.answered){if(i===q.a)c=" right";else if(i===Q.pick)c=" wrong";}
      return '<button class="opt'+c+'"'+(Q.answered?" disabled":"")+' onclick="answerMC('+i+')"><span class="ltr">'+"ABCD"[i]+"</span><span>"+o+"</span></button>";}).join("")+"</div>";
  }else if(q.t==="fill"){
    body='<div class="qtext">'+q.q.replace("___",'<span class="blank">&nbsp;</span>')+"</div>"
      +'<div class="answerbox"><input id="ans" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Cevabını yaz…" '
      +(Q.answered?'disabled value="'+esc(Q.typed)+'"':"")+' onkeydown="if(event.key===\'Enter\')answerFill()">'
      +(Q.answered?"":'<button class="btn" onclick="answerFill()">Kontrol et</button>')+"</div>";
  }else{
    body='<div class="qtext">'+q.q+"</div>"
      +(Q.answered?"":'<div class="answerbox"><input id="ans" type="text" autocomplete="off" placeholder="İngilizcesini yaz…" onkeydown="if(event.key===\'Enter\')revealTr()"><button class="btn" onclick="revealTr()">Cevabı göster</button></div>');
  }
  let fb="";
  if(Q.answered){
    const nextLabel=Q.i+1<Q.list.length?"Sonraki soru":"Oturumu bitir";
    if(q.t==="tr"){
      fb='<div class="fb neutral"><span class="key">'+q.a+"</span>"+(Q.typed?'<span class="why">Senin cevabın: '+esc(Q.typed)+"</span>":"")+(q.w?'<span class="why">'+q.w+"</span>":"")+"</div>"
        +(Q.ok===null?'<div class="selfcheck"><button class="btn soft" onclick="selfGrade(true)">Bildim</button><button class="btn ghost" onclick="selfGrade(false)">Bilemedim</button></div>'
        :'<button class="btn" onclick="nextQ()">'+nextLabel+"</button>");
    }else{
      fb='<div class="fb '+(Q.ok?"good":"bad")+'">'+(Q.ok?"Doğru!":"Doğru cevap: "+(q.t==="mc"?q.o[q.a]:q.a))+(q.w?'<span class="why">'+q.w+"</span>":"")+"</div>"
        +'<button class="btn" onclick="nextQ()">'+nextLabel+"</button>";
    }
  }
  const foot=id==="mix"?"":'<div class="small muted" style="text-align:center">Bu konuda '+p.answered+"/"+b.length+" soru çözüldü</div>";
  return '<div class="qcard">'+dots+head+body+fb+"</div>"+foot;
}
function answerMC(i){const q=Q.list[Q.i];Q.pick=i;Q.answered=true;Q.ok=(i===q.a);if(Q.ok)Q.correct++;render();}
function answerFill(){const el=document.getElementById("ans");const v=el?el.value:"";Q.typed=v;const q=Q.list[Q.i];
  const ok=[q.a].concat(q.alt||[]).map(norm);Q.answered=true;Q.ok=ok.includes(norm(v));if(Q.ok)Q.correct++;render();}
function revealTr(){const el=document.getElementById("ans");Q.typed=el?el.value:"";Q.answered=true;Q.ok=null;render();}
function selfGrade(ok){Q.ok=ok;if(ok)Q.correct++;render();}
function nextQ(){Q.i++;Q.answered=false;Q.ok=null;Q.pick=null;Q.typed="";render();window.scrollTo({top:0,behavior:"smooth"});}
function quizEnd(id){
  const n=Q.list.length,c=Q.correct,pct=n?Math.round(c/n*100):0;
  if(id!=="mix"&&!Q.saved){
    const b=bank(id),p=prog(id);
    S.prog[id]={pos:(Q.start+n)%Math.max(1,b.length),answered:Math.min(b.length,p.answered+n),correct:p.correct+c};
    S.last=id;save();Q.saved=true;
  }
  const p=prog(id),b=bank(id);
  const msg=pct>=80?"Bu set oturdu. Sıradaki 10 soruya geçebilirsin.":(pct>=50?"Fena değil. Konuyu bir kez daha oku, sonra devam et.":"Konuya geri dön, mantığı tekrar oku; sonra bu seti tekrarla.");
  return '<div class="qcard" style="text-align:center;align-items:center">'
    +'<span class="qtype">Oturum bitti</span>'
    +'<div class="ringnum" style="font-size:40px">%'+pct+"</div>"
    +'<div class="small muted">'+n+" soruda "+c+" doğru</div>"
    +(id!=="mix"?'<div class="bar" style="width:100%"><i style="width:'+Math.round(p.answered/Math.max(1,b.length)*100)+'%"></i></div><div class="small muted">Bu konuda '+p.answered+"/"+b.length+" soru çözüldü</div>":"")
    +'<p class="small" style="color:var(--muted)">'+msg+"</p>"
    +(id==="mix"?'<button class="btn" onclick="MIXSEC=MIXSEC;buildMix();Q.key=null;render()">Yeni karışık set</button>'
      :'<button class="btn" onclick="Q.key=null;render()">Sonraki 10 soru</button><button class="btn ghost" onclick="repeatSet()">Aynı seti tekrarla</button><button class="btn ghost" onclick="TAB=\'konu\';render()">Konuya dön</button>')
    +"</div>";
}
function repeatSet(){Q.i=0;Q.correct=0;Q.answered=false;Q.ok=null;Q.pick=null;Q.typed="";Q.saved=true;render();}

/* ---------- karışık test ---------- */
let MIXSEC="all",MIX=null;
function buildMix(){
  let pool=[];
  TOPICS.filter(t=>MIXSEC==="all"||t.s===MIXSEC).forEach(t=>bank(t.id).forEach(q=>pool.push(Object.assign({},q,{_t:t.title}))));
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
  MIX=pool.slice(0,12);Q.key=null;
}
function viewPractice(){
  if(!MIX)buildMix();
  const chips='<div class="chiprow">'+["all"].concat(SECTIONS.map(s=>s.id)).map(id=>{
      const name=id==="all"?"Tüm kitap":SECTIONS.find(s=>s.id===id).name;
      return '<button class="chip'+(MIXSEC===id?" on":"")+'" onclick="MIXSEC=\''+id+'\';buildMix();render()">'+name+"</button>";}).join("")+"</div>";
  const T=totals();
  return '<div class="stack"><div class="hero"><h1>Karışık test</h1><span class="sub">'+T.all+" sorunun içinden 12 rastgele soru.</span></div>"
    +chips+(MIX.length?quizShell("mix"):'<div class="empty">Bu bölümde soru yok.</div>')+"</div>";
}

/* ---------- kelime kartları ---------- */
let CARD={key:null,queue:[],i:0,flip:false,deck:0,topic:null};
function startDeck(id,di,onlyUnknown){
  const d=decks(id)[di];const st=deckState(id,di);
  let idxs=d.cards.map((_,i)=>i);
  if(onlyUnknown!==false)
    { const un=idxs.filter(i=>!st.known.includes(i)); if(un.length)idxs=un; }
  CARD={key:deckKey(id,di),queue:idxs,i:0,flip:false,deck:di,topic:id};
}
function cardShell(id){
  const ds=decks(id);
  if(CARD.topic!==id||CARD.deck>=ds.length)startDeck(id,0);
  const picker=ds.length>1?'<div class="chiprow">'+ds.map((d,i)=>'<button class="chip'+(CARD.deck===i?" on":"")+'" onclick="startDeck(\''+id+'\','+i+');render()">'+d.name+" ("+deckKnown(id,i)+"/"+d.cards.length+")</button>").join("")+"</div>":"";
  const d=ds[CARD.deck],st=deckState(id,CARD.deck);
  if(CARD.i>=CARD.queue.length){
    const k=deckKnown(id,CARD.deck);
    return picker+'<div class="qcard" style="text-align:center;align-items:center"><span class="qtype">Deste bitti</span>'
      +'<div class="ringnum" style="font-size:38px">'+k+"/"+d.cards.length+"</div>"
      +'<div class="small muted">bilinen kart</div>'
      +'<button class="btn" onclick="startDeck(\''+id+'\','+CARD.deck+');render()">Bilmediklerimi tekrarla</button>'
      +'<button class="btn ghost" onclick="startDeck(\''+id+'\','+CARD.deck+',false);render()">Tüm desteyi baştan çevir</button>'
      +'<button class="btn ghost" onclick="resetDeck(\''+id+'\','+CARD.deck+')">Desteyi sıfırla</button></div>';
  }
  const ci=CARD.queue[CARD.i],c=d.cards[ci];
  return picker
    +'<div class="small muted" style="text-align:center">'+d.name+" · kart "+(CARD.i+1)+"/"+CARD.queue.length+" · bilinen "+deckKnown(id,CARD.deck)+"/"+d.cards.length+"</div>"
    +'<button class="flashcard'+(CARD.flip?" flipped":"")+'" onclick="CARD.flip=!CARD.flip;render()">'
      +'<span class="fc-side">'+(CARD.flip?"TÜRKÇE":"ENGLISH")+"</span>"
      +'<span class="fc-main">'+(CARD.flip?c.b:c.f)+"</span>"
      +(CARD.flip&&c.n?'<span class="fc-note">'+c.n+"</span>":"")
      +'<span class="fc-hint">'+svg(I.flip)+(CARD.flip?" kapat":" çevir")+"</span></button>"
    +'<div class="selfcheck"><button class="btn soft" onclick="markCard(true)">Biliyorum</button><button class="btn ghost" onclick="markCard(false)">Tekrar et</button></div>';
}
function markCard(known){
  const key=CARD.key,st=S.cards[key]||{known:[]};const ci=CARD.queue[CARD.i];
  if(known){if(!st.known.includes(ci))st.known.push(ci);}
  else st.known=st.known.filter(x=>x!==ci);
  S.cards[key]=st;S.last=CARD.topic;save();
  CARD.i++;CARD.flip=false;render();window.scrollTo({top:0,behavior:"smooth"});
}
function resetDeck(id,di){S.cards[deckKey(id,di)]={known:[]};save();startDeck(id,di,false);render();}

function viewCards(){
  const T=totals();
  let list="";
  SECTIONS.forEach(s=>{
    const ts=secTopics(s.id).filter(t=>decks(t.id).length);
    if(!ts.length)return;
    list+='<div class="sechead"><h3>'+s.name+"</h3></div>";
    ts.forEach(t=>{decks(t.id).forEach((d,i)=>{
      const k=deckKnown(t.id,i),p=Math.round(k/d.cards.length*100);
      list+='<a class="toprow" href="#t-'+t.id+'" onclick="TAB=\'kart\';startDeck(\''+t.id+'\','+i+')">'
        +'<div class="tnum">'+p+'</div><div class="tmain"><div class="tname">'+d.name+'</div>'
        +'<div class="tmeta"><span>'+t.title+"</span><span>"+k+"/"+d.cards.length+" kart</span></div>"
        +'<div class="bar" style="margin-top:7px"><i style="width:'+p+'%"></i></div></div></a>';
    });});
  });
  return '<div class="stack"><div class="hero"><h1>Kelime kartları</h1><span class="sub">'+T.cards+" kart · "+T.known+" tanesi bilindi. Kart İngilizce açılır, çevirince Türkçesi gelir.</span></div>"
    +'<div class="stack" style="gap:9px">'+list+"</div></div>";
}

function resetAll(){
  if(document.getElementById("confirmReset"))return;
  const el=document.createElement("div");el.id="confirmReset";el.className="card";el.style.marginTop="10px";
  el.innerHTML='<div class="small">Bütün okundu, video, test ve kart kayıtların silinsin mi?</div>'

/* ---------- çizim ---------- */
function render(){
  const h=route(),v=document.getElementById("view");
  if(h.indexOf("t-")===0){
    const t=byId(h.slice(2));
    if(t){S.last=t.id;save();topbar(t.title,t.tag,true);v.innerHTML=viewTopic(t);tabbar("topics");return;}
  }
  const page=VIEWS.indexOf(h)>-1?h:"home";
  if(page==="home"){topbar("Ek Mantığı","englishwithfurkn",false);v.innerHTML=viewHome();}
  else if(page==="topics"){topbar("Konular",TOPICS.length+" başlık",false);v.innerHTML=viewTopics();
    const q=document.getElementById("q");
    if(q)q.oninput=()=>{QUERY=q.value;const s=q.selectionStart;render();const n=document.getElementById("q");if(n){n.focus();try{n.setSelectionRange(s,s);}catch(e){}}};
  }
  else if(page==="practice"){topbar("Karışık test","tüm bankadan",false);v.innerHTML=viewPractice();}
  else if(page==="cards"){topbar("Kelime kartları","desteler",false);v.innerHTML=viewCards();}
  else {topbar("İlerleme","",false);v.innerHTML=viewProgress();}
  tabbar(page);
}
if(!location.hash)location.hash="#home";
render();
</script>
