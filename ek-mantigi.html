<title>Ek Mantığı</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout: telefon kabuğu — sabit üst bar, kayan ekran, alt sekme çubuğu */
:root{
  --bg:#F2F4F6; --app:#FBFCFD; --surface:#FFFFFF; --surface-2:#F4F6F8;
  --ink:#121A20; --muted:#5E6E7B; --line:#E3E8EC;
  --primary:#0E6B63; --primary-soft:#D9EEEB; --primary-ink:#0A4E48;
  --accent:#C9741C; --accent-soft:#FBEBD8;
  --ok:#1C7F52; --ok-soft:#DFF2E7; --bad:#B8362C; --bad-soft:#FAE3E1;
  --font-d:'Sora',system-ui,sans-serif; --font-b:'Manrope',system-ui,sans-serif;
  --r:14px; --shadow:0 1px 2px rgba(18,26,32,.05),0 8px 24px rgba(18,26,32,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#070A0C; --app:#0E1317; --surface:#161D22; --surface-2:#1D262C;
  --ink:#E8EEF2; --muted:#94A6B2; --line:#27333A;
  --primary:#3FC2B2; --primary-soft:#12302E; --primary-ink:#8FE2D7;
  --accent:#E8A75C; --accent-soft:#33240F;
  --ok:#49C98A; --ok-soft:#10301F; --bad:#F0867A; --bad-soft:#331513;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#070A0C; --app:#0E1317; --surface:#161D22; --surface-2:#1D262C;
  --ink:#E8EEF2; --muted:#94A6B2; --line:#27333A;
  --primary:#3FC2B2; --primary-soft:#12302E; --primary-ink:#8FE2D7;
  --accent:#E8A75C; --accent-soft:#33240F;
  --ok:#49C98A; --ok-soft:#10301F; --bad:#F0867A; --bad-soft:#331513;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--surface)}
h1,h2,h3,h4{font-family:var(--font-d);margin:0;text-wrap:balance;line-height:1.25}
p{margin:0}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:6px}

/* ---- kabuk ---- */
#app{max-width:470px;margin:0 auto;min-height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));background:var(--app);position:relative}
@media(min-width:720px){
  #app{box-shadow:0 0 0 1px var(--line),0 24px 70px rgba(10,20,28,.14)}
}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---- üst bar ---- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar-in{display:flex;align-items:center;gap:10px;padding-block:11px;min-height:54px}
.tb-title{font-family:var(--font-d);font-weight:600;font-size:16.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb-sub{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.06em;text-transform:uppercase;display:block;line-height:1.3}
.iconbtn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none;color:var(--muted)}
.iconbtn:hover{background:var(--surface-2);color:var(--ink)}
.iconbtn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* ---- ekran ---- */
.screen{padding-block:16px 0;animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.screen{animation:none}*{transition:none!important}}
.pad-bottom{height:calc(84px + env(safe-area-inset-bottom,0px))}

/* ---- alt sekmeler ---- */
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,470px);z-index:35;
  background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:max(6px,env(safe-area-inset-left,0px));padding-right:max(6px,env(safe-area-inset-right,0px));
  display:flex}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 8px;color:var(--muted);font-size:10.5px;font-weight:600;letter-spacing:.01em}
.tab svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--primary)}
.tab[aria-current="page"] svg{stroke-width:2.2}

/* ---- genel parçalar ---- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stack{display:flex;flex-direction:column;gap:12px}
.eyebrow{font-size:10.5px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--muted)}
.chip.on{background:var(--primary-soft);border-color:transparent;color:var(--primary-ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 16px;border-radius:12px;background:var(--primary);color:#fff;font-weight:700;font-size:14.5px;width:100%}
:root[data-theme="dark"] .btn,:root:not([data-theme="light"]) .btn{color:#06201E}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .btn{color:#fff}}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.soft{background:var(--primary-soft);color:var(--primary-ink)}
.btn:disabled{opacity:.45;cursor:default}

/* ilerleme çubuğu */
.bar{height:6px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:999px;background:var(--primary);transition:width .4s ease}
.bar.acc>i{background:var(--accent)}

/* formül şeridi — kitabın değişmez yapısı */
.formula{display:flex;flex-wrap:wrap;gap:5px;align-items:center;font-family:var(--font-d);font-size:12.5px;font-weight:600}
.formula span{padding:4px 9px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line)}
.formula span.k{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.formula b{color:var(--muted);font-weight:600}

/* konu içeriği */
.prose{display:flex;flex-direction:column;gap:13px;font-size:15px;line-height:1.72}
.prose h4{font-size:15.5px;font-weight:600;margin-top:7px;color:var(--ink);display:flex;align-items:center;gap:8px}
.prose h4::before{content:"";width:3px;height:16px;border-radius:2px;background:var(--primary);flex:none}
.prose ul{margin:0;padding-left:19px;display:flex;flex-direction:column;gap:7px}
.prose li::marker{color:var(--primary)}
.rule{background:var(--accent-soft);border-radius:12px;padding:12px 13px;font-size:14px;line-height:1.6;border-left:3px solid var(--accent)}
.rule b{color:var(--accent)}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px;display:flex;flex-direction:column;gap:4px}
.ex .en{font-weight:700;font-size:14.5px;letter-spacing:-.005em}
.ex .tr{font-size:13.5px;color:var(--muted)}
.ex .nt{font-size:12.5px;color:var(--muted);border-top:1px dashed var(--line);padding-top:7px;margin-top:3px;line-height:1.55}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 10px;font-size:14px}
.kv dt{font-weight:700;color:var(--primary)}
.kv dd{margin:0;color:var(--muted)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:330px}
th,td{text-align:left;padding:9px 11px;border-bottom:1px solid var(--line)}
th{font-family:var(--font-d);font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);background:var(--surface-2)}
tr:last-child td{border-bottom:none}
td b{color:var(--primary)}
</style>
<style>
/* ---- konu kartı listesi ---- */
.toprow{display:flex;gap:11px;align-items:center;width:100%;text-align:left;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.toprow:hover{border-color:var(--primary)}
.tnum{width:32px;height:32px;border-radius:9px;background:var(--surface-2);display:grid;place-items:center;font-family:var(--font-d);font-size:12.5px;font-weight:700;color:var(--muted);flex:none}
.toprow.done .tnum{background:var(--ok-soft);color:var(--ok)}
.toprow.started .tnum{background:var(--accent-soft);color:var(--accent)}
.tmain{flex:1;min-width:0}
.tname{font-family:var(--font-d);font-weight:600;font-size:14.5px;line-height:1.35}
.tmeta{font-size:11.5px;color:var(--muted);margin-top:2px;display:flex;gap:9px;flex-wrap:wrap}
.tick{width:16px;height:16px;flex:none;stroke:var(--ok);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.sechead{display:flex;align-items:baseline;gap:9px;margin:18px 0 9px}
.sechead:first-child{margin-top:4px}
.sechead h3{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.sechead .ct{font-size:11.5px;color:var(--muted);margin-left:auto}

/* ---- arama ---- */
.search{display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px}
.search input{flex:1;min-width:0;border:none;background:none;padding:11px 0;font:inherit;font-size:14.5px;color:var(--ink)}
.search input:focus{outline:none}
.search svg{width:17px;height:17px;stroke:var(--muted);fill:none;stroke-width:2;flex:none}

/* ---- alıştırma ---- */
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px;display:flex;flex-direction:column;gap:13px}
.qtype{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--accent)}
.qtext{font-family:var(--font-d);font-size:16px;font-weight:600;line-height:1.45}
.qtext .blank{color:var(--primary);border-bottom:2px solid var(--primary);padding:0 10px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:flex-start;gap:10px;text-align:left;width:100%;padding:12px;border-radius:11px;border:1.5px solid var(--line);background:var(--surface);font-size:14.5px;line-height:1.45;transition:background .15s,border-color .15s}
.opt:hover:not(:disabled){border-color:var(--primary)}
.opt .ltr{width:21px;height:21px;border-radius:6px;background:var(--surface-2);display:grid;place-items:center;font-size:11.5px;font-weight:700;color:var(--muted);flex:none;margin-top:1px}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .ltr{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .ltr{background:var(--bad);color:#fff}
.opt:disabled{cursor:default}
.answerbox{display:flex;flex-direction:column;gap:9px}
.answerbox input{width:100%;padding:12px;border-radius:11px;border:1.5px solid var(--line);background:var(--surface-2);font:inherit;font-size:15px;color:var(--ink)}
.answerbox input:focus{outline:none;border-color:var(--primary);background:var(--surface)}
.fb{border-radius:11px;padding:11px 12px;font-size:13.5px;line-height:1.6;display:flex;flex-direction:column;gap:6px}
.fb.good{background:var(--ok-soft);color:var(--ok)}
.fb.bad{background:var(--bad-soft);color:var(--bad)}
.fb.neutral{background:var(--surface-2);color:var(--ink)}
.fb .key{font-family:var(--font-d);font-weight:700;color:var(--ink);font-size:14.5px}
.fb .why{color:var(--muted);font-size:13px}
.qprog{display:flex;gap:4px;align-items:center}
.qprog i{flex:1;height:4px;border-radius:999px;background:var(--surface-2)}
.qprog i.on{background:var(--primary)}
.qprog i.miss{background:var(--bad)}
.selfcheck{display:flex;gap:8px}
.selfcheck .btn{padding:10px}

/* video kartı */
.videocard{background:var(--primary-soft);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:11px}
.videocard .vt{font-family:var(--font-d);font-weight:600;font-size:14.5px;color:var(--primary-ink);display:flex;gap:9px;align-items:center}
.videocard .vt svg{width:19px;height:19px;stroke:var(--primary-ink);fill:none;stroke-width:1.9;flex:none}
.videocard p{font-size:13.5px;color:var(--primary-ink);opacity:.85;line-height:1.6}
.vbtn{display:flex;align-items:center;justify-content:center;gap:8px;padding:11px;border-radius:11px;background:var(--surface);font-weight:700;font-size:14px;color:var(--primary-ink);border:1.5px solid transparent}
.vbtn.on{background:transparent;border-color:var(--primary);color:var(--primary-ink)}
.vbtn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}

/* segment */
.seg{display:flex;background:var(--surface-2);border-radius:11px;padding:3px;gap:3px}
.seg button{flex:1;padding:8px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}

/* halka */
.ring{display:flex;align-items:center;gap:14px}
.ring svg{width:66px;height:66px;flex:none;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:7;stroke-linecap:round}
.ring .track{stroke:var(--surface-2)}
.ring .val{stroke:var(--primary);transition:stroke-dashoffset .6s ease}
.ringnum{font-family:var(--font-d);font-size:24px;font-weight:700;line-height:1}

/* istatistik */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat .n{font-family:var(--font-d);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .l{font-size:11.5px;color:var(--muted);margin-top:3px}

.empty{text-align:center;padding:38px 16px;color:var(--muted);font-size:14px}
.hero{display:flex;flex-direction:column;gap:4px}
.hero h1{font-size:25px;font-weight:700;letter-spacing:-.02em}
.hero .sub{font-size:13.5px;color:var(--muted)}
.fine{font-size:11.5px;color:var(--muted);line-height:1.6;text-align:center;padding:14px 0}
</style>

<div id="app">
  <header class="topbar"><div class="topbar-in gut" id="topbar"></div></header>
  <main id="view" class="screen gut"></main>
  <div class="pad-bottom"></div>
  <nav class="tabbar" id="tabbar"></nav>
</div>
<script>
/* Ek Mantığı Kitabı — konu verileri. Metinler kitabın kendi anlatımından alınmıştır. */
const SECTIONS = [
  {id:'s1', name:'Temel Mantık', desc:'Cümle yapısı, özne, fiil ve ekler'},
  {id:'s2', name:'Cümle Uzatma', desc:'Bağlaç, çağrışım, relative ve noun clause'},
  {id:'s3', name:'Zamanlar', desc:'Tenslerin tek kuralı: yardımcı fiiller'},
  {id:'s4', name:'Modals ve If', desc:'Duygusal ekler ve koşul cümleleri'},
  {id:'s5', name:'Passive', desc:'“-ıl / -il” ekinin bütün halleri'}
];

const TOPICS = [
/* ============ S1 ============ */
{
id:'onsoz', s:'s1', title:'Ön Söz', tag:'Giriş',
sum:'Kitabın amacı ve nasıl çalışman gerektiği.',
blocks:[
['p','Bir dil öğrenmek yalnızca kelimeleri ve kuralları ezberlemek değildir; o dilin mantığını kavramaktır. İngilizce, yapısı itibarıyla Türkçeden oldukça farklı bir dildir ve bu farklılık özellikle cümle kurarken eklerin, bağlaçların ve zaman yapılarının doğru kullanımını kritik hale getirir.'],
['p','“Anlıyorum ama konuşamıyorum” sorununun temelinde İngilizcenin yapısal mantığını tam olarak kavrayamamak yatar. Bu kitap size bu mantığı adım adım öğretmeyi hedefliyor. Özne–fiil–ek–isim yapısı gibi İngilizcenin değişmez kurallarını öğrenerek uzun ve karmaşık cümleleri bile rahatlıkla kurabilir ve çevirebilir hâle geleceksiniz.'],
['p','Kitabın en önemli özelliği Türkçe düşünme alışkanlığınızı İngilizceye uyarlamanızı sağlamasıdır. Eklerin nasıl kullanılacağını, bağlaçların cümle içindeki işlevini ve zaman yapılarının mantığını öğrenirken aslında İngilizce düşünmeye başladığınızı fark edeceksiniz.'],
['r','Kitabı okurken her konu anlatımı bittiğinde ödev videolarını <b>MUTLAKA</b> izlemelisiniz; çünkü yazarak bazı şeyler tam ifade edilemeyebilir. Hangi konuyu okuduysanız o konunun başlığını diğer dosyadaki başlıkla eşleştirmelisiniz ki karışıklık olmasın.'],
['p','Şunu da belirtmeliyim: Başta anlatacağım konular en temelden en zora doğru ilerliyor. Bu yüzden sizi asıl geliştirecek konular “isimleştirme — relative clause — passive — noun clause” konularının mantığını anlamanızdır. Bu konuları anlayabilmek için sırasıyla diğer konuları da anlatıyor olacağım; o yüzden konuları atlamadan, sabırlı ve sistemli bir şekilde okumalısınız ki kafanız karışmasın.'],
['p','Yolculuğunuza başlarken sabırlı olmanızı ve her adımda öğrendiklerinizi pratik etmenizi öneririm. Unutmayın, dil öğrenmek bir maratondur; adım adım ilerledikçe başarıya ulaşırsınız. Keyifli öğrenmeler dilerim.']
], ex:[]
},
{
id:'cumle-yapisi', s:'s1', title:'Cümle Yapısı', tag:'Temel',
sum:'İngilizcenin asla değişmeyen kalıbı.',
blocks:[
['f',['Özne','fiil','ek','isim','………','isim']],
['p','Yukarıda yazdığım yapı, İngilizcenin asla değişmeyecek olan yapılarından birisidir. Bu yapıyı öğrendikten sonra, aslında İngilizcenin ne kadar basit bir dil olduğunu göreceksiniz. “Anlıyorum ama konuşamıyorum.” sorununun en büyük sebebi, bu yapıya tam anlamıyla hâkim olamamaktan kaynaklanır.'],
['p','Bu yapının en önemli kısmı “ekler”dir; çünkü aslında biz İngilizcede fiilleri ve özneleri yazabiliyoruz. Bunun sebebi, bu yapının lise ve hazırlık sınıflarında sürekli öğretilmesi ve öğrencilerin bunun dışına çıkamamasıdır.'],
['p','Örneğin, bu kitaba sahip olan herkes zaten “I go”, “I went” veya “I read”, “I am reading” cümlelerini kurabiliyordur. Çünkü bu yapılar dışında, eğitim sistemimizde cümle uzatmaya dair bir mantık anlatılmıyor. Sizi konuşturacak en önemli mantık ise “ekleri” kullanmayı bilmektir.'],
['p','Örneğin “Ben arkadaşlarımla evde oturuyorum.” cümlesini çevirin desem, belki birkaçınız bütün kelimelerin anlamlarını bilmesine rağmen yanlış çevirecektir. Fakat burada “arkadaşı – friend”, “evi – home”, “oturmak eylemini – sit” olarak bilsek de, “ile”, “-m”, “-de/-da” eklerini doğru bağlayamazsak bu cümleyi kuramayız.'],
['r','Bu yapıyı anlatırken <b>mantığını anlamaya odaklanın</b>; çünkü şu an anlatmamış olduğum bazı konuları da kullanıyor olacağım. Ancak onlara takılmadan sadece neyi anlatmak istediğime odaklanın.'],
['p','Hazırsanız, bu yapıda yer alan özne nedir, fiil nedir, en yaygın ekler hangileridir ve isimleştirmeler nedir, bunları tek tek detaylı anlatalım.']
],

['r','Türkçede bu kadar çok olması sizi korkutmasın; İngilizcede sadece <b>iki tane</b> isimleştirme eki vardır: <b>“to”</b> ve <b>“-ing”</b>.'],

['e','You go to the library study.','(Yanlış) “Ders çalışmak kütüphaneye gidersin.”','“Study” fiilini yalın halde yazdığım için iki fiil olmuş olur ve bu gramer hatasıdır.'],

['h','“After” ve “Then” Mantığı'],
['p','Size “after” kelimesinin anlamını sorsam çoğunuz “sonra” diyecektir. “Then” için de aynısını. “Okuldan sonra” derken “sonra”yı after alırsak, “okuldan” kısmındaki “-dan/-den” ekini from olarak vermemiz gerekir. O zaman cümle “After from school” olurdu.'],

['h','“After Coming” Örneği'],
['p','“Geldikten sonra” cümlesini çevirelim. “Gelmek” fiilini “come” olarak yazarsak cümlede iki fiil olur; fiili isimleştirmemiz gerekir. “to” koyarsak “After to come” olur — teknik olarak isimleşti, fakat iki ek yan yana geldiği için yine gramer hatasıdır.'],
['r','O zaman “-ing” de bir isimleştirme ekidir; fakat <b>öne gelen</b> bir ek değildir. “-ing” ekini <b>sona gelen</b> bir ek olarak öğreniriz.'],
['e','After coming.','Geldikten sonra.','Hem iki ek yan yana gelmemiş olur hem de “come” fiili artık isimleşmiş hale gelir. “After come” deseydik çevirisi “gelmekten sonra” olurdu.'],
['h','“I am going” Yapısına Dikkat'],

['p','Öğrenciler genellikle “I going” der; çünkü “am/is/are” kelimelerinin bir anlamı olmadığını düşünürler. Fakat bu yapıda fiil yoktur, sadece özne ve isim vardır. İngilizce kurallı bir dil olduğu için fiil mutlaka olmalıdır, ve o fiil de “to be” fiilidir: <b>I am going.</b>'],
['h','Diğer ekler'],

['p','Bu şekilde ikinci çağrışan cümlenizin başına bir bağlaç ekleyerek sonsuza kadar cümle yapabilir ve bağlaç mantığını da bu şekilde çalışabilirsiniz.']

['p','Bu passive konusu iki şekilde karşımıza çıkacak: 1) Ana fiil (yüklem) kısmındaki tüm tense çekimlerine göre değişimi, 2) Ana fiil dışında gelen, edatlarla bağlanmış eklerle olan birleşimi.'],

['h','Mantığı nasıl kuruyoruz?'],

ex:[

{t:'mc',q:'“Cam kırıldı” nasıl çevrilir?',o:['The window is broken','The window was broken','The window has been broken','The window will be broken'],a:1,w:'“Dı-di” eki v2 ister; be’nin v2 hali was/were → was broken.'},
{t:'mc',q:'“Cam kırılıyor” nasıl çevrilir?',o:['The window is broken','The window is being broken','The window has been broken','The window was broken'],a:1,w:'“Yor” eki be + ing ister → is being + V3.'},
{t:'mc',q:'“Cam kırılmıştı” nasıl çevrilir?',o:['The window was broken','The window has been broken','The window is being broken','The window will be broken'],a:1,w:'“Mıştı” perfect → have/has been + V3.'},

['h','Özne cansız olunca'],

['e','The car is driven to be gone to job.','İşe gidilmek için araba sürülür.','“Why – niçin sürülür?” diye sorduğumuzda: özne cansız, passive eki “-ıl/-il” ile gelir, “to – mak için” → be v3.'],

['e','By being beaten.','Dövülerek.','Beat → v3 hali beaten. Bu mantıkla her şeyi passive hâle getirebiliriz.']
],
ex:[
{t:'mc',q:'“-ılmak için” nasıl kodlanır?',o:['to + fiil','to be + V3','by + ing','be + ing'],a:1,w:'“-ılmak için” ekini to be v3 olarak kodlayabiliriz.'},
{t:'mc',q:'“Dövülerek” nasıl çevrilir?',o:['by beating','by being beaten','to be beaten','being beat'],a:1,w:'“-arak/-erek” → by + ing; “-ül” → be v3 → by being beaten.'},
{t:'mc',q:'“The car drives” neden yanlıştır?',o:['drive düzensiz fiildir','Araba aktif olarak eylemi yapamaz','car çoğul olmalı','“the” fazla'],a:1,w:'Eylemi yapamayan öznelere be v3 koyarız: The car is driven.'},
{t:'tr',q:'İşe gidilmek için araba sürülür.',a:'The car is driven to be gone to job.',w:'“sürülür” → is driven; “gidilmek için” → to be gone.'}
]
},

sum:'“-ılan” eki: which/who + be + V3.',
blocks:[

['l',['“an-en” konusu → which / who / that (relative clause)','“-ıl” konusu → be-v3 (passive)']],
['r','Bu iki yapı birleşince <b>“-ılan”</b> eki ortaya çıkıyor: which is v3 · which was v3 · who was v3 · who is v3'],
['p','Bu yapıyı kurabilmemiz için bir isme ihtiyacımız vardı ve bu ismin detayına an-en (which/who) yapısıyla iniyorduk. Eğer bu isimleri passive olarak betimlemek istersek, ekstra olarak be v3 (yani -ıl/-il) ekini koymamız gerekir.'],
['e','The window which was broken','Kırılan cam','Cam → the window, kırılan (an → which), -ıl → was, kır → broken.'],
['e','The home which was seen','Görülen ev','Ev → home, en → which, -ıl → was, gör → seen.'],
['e','The child who is loved by his family','Ailesi tarafından sevilen çocuk','Çocuk → the kid, sevilen → en → who → -ıl → is → sev → loved, tarafından → by, ailesi → his family.'],
['p','Bu şekilde bir sürü örnek yapılabilir. Ödev kısmında videoda daha detaylı anlatıyor ve çeviriyor olacağım.']
],

{t:'mc',q:'“-ılan” eki hangi iki konunun birleşimidir?',o:['to + ing','an-en (relative) + -ıl (passive)','if + modal','have + V3'],a:1,w:'“an-en” → which/who/that ve “-ıl” → be v3 birleşince “-ılan” oluşur.'},
{t:'tr',q:'Kırılan cam',a:'The window which was broken',w:'cam → the window, “an” → which, “-ıl” → was, kır → broken.'},

{t:'tr',q:'Ailesi tarafından sevilen çocuk',a:'The child who is loved by his family',w:'İnsan → who, “-ıl” → is, sev → loved, tarafından → by.'}

['p','Eğer bu kitabı faydalı bulduysanız ve başkalarına önermek isterseniz, bana Instagram hesabımdan yorum bırakabilirsiniz. Hepinize kitabımı okuduğunuz ve zaman ayırdığınız için teşekkür eder, eğitim hayatınızda başarılar dilerim.'],

</script>
<script>
/* ---------- durum ---------- */
const KEY='ekmantigi.v2';
const defState={read:{},video:{},ex:{},last:null,theme:'system'};
let S=load();
function load(){try{const r=localStorage.getItem(KEY);return r?Object.assign({},defState,JSON.parse(r)):Object.assign({},defState);}catch(e){return Object.assign({},defState);}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function applyTheme(){try{if(S.theme==='system')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',S.theme);}catch(e){}}
applyTheme();

const byId=id=>TOPICS.find(t=>t.id===id);
const secTopics=s=>TOPICS.filter(t=>t.s===s);
const exCount=t=>t.ex.length;
const exState=id=>S.ex[id]||{correct:0,total:0,done:0};
const topicDone=t=>!!S.read[t.id]&&(exCount(t)===0||exState(t.id).done>=exCount(t));
const topicStarted=t=>!!S.read[t.id]||!!S.video[t.id]||exState(t.id).done>0;

/* ---------- ikonlar ---------- */
const I={
home:'<path d="M3 10.2 12 3l9 7.2V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
list:'<path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/>',
pen:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
chart:'<path d="M3 20h18"/><rect x="5" y="11" width="3.4" height="6" rx="1"/><rect x="10.3" y="7" width="3.4" height="10" rx="1"/><rect x="15.6" y="13" width="3.4" height="4" rx="1"/>',
back:'<path d="M15 19l-7-7 7-7"/>',
search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.2-3.2"/>',
play:'<circle cx="12" cy="12" r="9"/><path d="M10 8.6 16 12l-6 3.4z"/>',
check:'<path d="M4 12.5 9 17.5 20 6.5"/>',
sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
moon:'<path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/>',
auto:'<circle cx="12" cy="12" r="9"/><path d="M12 3v18" /><path d="M12 3a9 9 0 0 1 0 18"/>',
flame:'<path d="M12 3s5 4.2 5 8.6A5 5 0 0 1 7 12c0-1.4.5-2.6 1.3-3.6.3 1.3 1.2 2.1 2.2 2.1 0-2.6 1.5-5.6 1.5-7.5z"/>'
};
const svg=(p,c='')=>'<svg class="'+c+'" viewBox="0 0 24 24" aria-hidden="true">'+p+'</svg>';

/* ---------- yönlendirme ---------- */
const VIEWS=['home','topics','practice','progress'];
function route(){const h=(location.hash||'#home').slice(1);return h;}
function go(h){if(location.hash==='#'+h)render();else location.hash='#'+h;}
window.addEventListener('hashchange',()=>{window.scrollTo(0,0);render();});

/* ---------- blok çizimi ---------- */
function block(b){
  const k=b[0];
  if(k==='p')return '<p>'+b[1]+'</p>';
  if(k==='h')return '<h4>'+b[1]+'</h4>';
  if(k==='r')return '<div class="rule">'+b[1]+'</div>';
  if(k==='l')return '<ul>'+b[1].map(x=>'<li>'+x+'</li>').join('')+'</ul>';
  if(k==='e')return '<div class="ex"><span class="en">'+b[1]+'</span><span class="tr">'+b[2]+'</span>'+(b[3]?'<span class="nt">'+b[3]+'</span>':'')+'</div>';
  if(k==='dl')return '<dl class="kv">'+b[1].map(r=>'<dt>'+r[0]+'</dt><dd>'+r[1]+'</dd>').join('')+'</dl>';
  if(k==='f')return '<div class="formula">'+b[1].map((x,i)=>x===','?'<b>,</b>':'<span'+(i%2?' class="k"':'')+'>'+x+'</span>').join('<b>+</b>')+'</div>';
  if(k==='tbl')return '<div class="tablewrap"><table><thead><tr>'+b[1].map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'+b[2].map(r=>'<tr>'+r.map((c,i)=>'<td>'+(i===2?'<b>'+c+'</b>':c)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';
  return '';
}

/* ---------- üst bar ---------- */
function topbar(title,sub,back){
  const t=document.getElementById('topbar');
  const themeIcon=S.theme==='dark'?I.moon:(S.theme==='light'?I.sun:I.auto);
  t.innerHTML=(back?'<button class="iconbtn" id="backbtn" aria-label="Geri">'+svg(I.back)+'</button>':'')
    +'<div style="flex:1;min-width:0">'+(sub?'<span class="tb-sub">'+sub+'</span>':'')+'<div class="tb-title">'+title+'</div></div>'
    +'<button class="iconbtn" id="themebtn" aria-label="Tema değiştir">'+svg(themeIcon)+'</button>';
  const b=document.getElementById('backbtn');
  if(b)b.onclick=()=>{if(history.length>1)history.back();else go('topics');};
  document.getElementById('themebtn').onclick=()=>{
    S.theme=S.theme==='system'?'dark':(S.theme==='dark'?'light':'system');save();applyTheme();render();
  };
}

/* ---------- alt sekmeler ---------- */
function tabbar(active){
  const items=[['home','Ana Sayfa',I.home],['topics','Konular',I.list],['practice','Alıştırma',I.pen],['progress','İlerleme',I.chart]];
  document.getElementById('tabbar').innerHTML=items.map(([id,label,ic])=>
    '<a class="tab" href="#'+id+'"'+(active===id?' aria-current="page"':'')+'>'+svg(ic)+'<span>'+label+'</span></a>').join('');
}

/* ---------- ilerleme hesapları ---------- */
function overall(){
  const total=TOPICS.length;let done=0;TOPICS.forEach(t=>{if(topicDone(t))done++;});
  return {done,total,pct:total?Math.round(done/total*100):0};
}
function exTotals(){
  let c=0,n=0,q=0;TOPICS.forEach(t=>{const e=exState(t.id);c+=e.correct;n+=e.total;q+=exCount(t);});
  return {correct:c,answered:n,all:q};
}
function sectionPct(sid){
  const ts=secTopics(sid);if(!ts.length)return 0;
  let d=0;ts.forEach(t=>{if(topicDone(t))d++;});return Math.round(d/ts.length*100);
}
function nextTopic(){
  if(S.last){const i=TOPICS.findIndex(t=>t.id===S.last);if(i>-1&&!topicDone(TOPICS[i]))return TOPICS[i];}
  return TOPICS.find(t=>!topicDone(t))||TOPICS[0];
}

/* ---------- ekran: ana sayfa ---------- */
function viewHome(){
  const o=overall(),e=exTotals(),nx=nextTopic();
  const acc=e.answered?Math.round(e.correct/e.answered*100):0;
  const R=2*Math.PI*28;
  return '<div class="stack">'
  +'<div class="hero"><h1>Ek Mantığı</h1><span class="sub">Kitabın 36 konusu, her konunun sonunda alıştırmasıyla.</span></div>'
  +'<div class="card" style="display:flex;flex-direction:column;gap:13px">'
    +'<div class="ring"><svg viewBox="0 0 66 66"><circle class="track" cx="33" cy="33" r="28"/><circle class="val" cx="33" cy="33" r="28" stroke-dasharray="'+R+'" stroke-dashoffset="'+(R*(1-o.pct/100))+'"/></svg>'
    +'<div><div class="ringnum">%'+o.pct+'</div><div class="small muted">'+o.done+' / '+o.total+' konu tamamlandı</div></div></div>'
    +'<div class="formula"><span>Özne</span><b>+</b><span class="k">fiil</span><b>+</b><span class="k">ek</span><b>+</b><span>isim</span></div>'
  +'</div>'
  +'<div class="card" style="display:flex;flex-direction:column;gap:11px">'
    +'<span class="eyebrow">Kaldığın yer</span>'
    +'<div><div style="font-family:var(--font-d);font-weight:600;font-size:17px">'+nx.title+'</div><div class="small muted">'+nx.sum+'</div></div>'
    +'<button class="btn" onclick="location.hash=\'#t-'+nx.id+'\'">Konuya git</button>'
  +'</div>'
  +'<div class="stats">'
    +'<div class="stat"><div class="n">'+Object.keys(S.video).filter(k=>S.video[k]).length+'</div><div class="l">izlenen video</div></div>'
    +'<div class="stat"><div class="n">'+e.answered+'</div><div class="l">çözülen alıştırma</div></div>'
    +'<div class="stat"><div class="n">%'+acc+'</div><div class="l">doğru oranı</div></div>'
    +'<div class="stat"><div class="n">'+e.all+'</div><div class="l">toplam alıştırma</div></div>'
  +'</div>'
  +'<div><div class="sechead"><h3>Bölümler</h3></div>'
    +SECTIONS.map(s=>{const p=sectionPct(s.id);return '<a class="toprow" href="#topics" style="margin-bottom:9px" onclick="FILTER=\''+s.id+'\'">'
      +'<div class="tnum">'+p+'</div><div class="tmain"><div class="tname">'+s.name+'</div><div class="tmeta">'+s.desc+'</div>'
      +'<div class="bar" style="margin-top:7px"><i style="width:'+p+'%"></i></div></div></a>';}).join('')
  +'</div>'
  +'<button class="btn soft" onclick="location.hash=\'#practice\'">'+svg(I.pen)+' Karışık alıştırma yap</button>'
  +'<p class="fine">Her konuyu okuduktan sonra o konunun videosunu izle, sonra alıştırmaları çöz.</p>'
  +'</div>';
}

/* ---------- ekran: konular ---------- */
let FILTER='all',QUERY='';
function viewTopics(){
  const q=QUERY.trim().toLocaleLowerCase('tr');
  const chips='<div style="display:flex;gap:7px;overflow-x:auto;padding-bottom:3px;margin:0 -2px;padding-left:2px;padding-right:2px">'
    +['all'].concat(SECTIONS.map(s=>s.id)).map(id=>{
      const name=id==='all'?'Tümü':SECTIONS.find(s=>s.id===id).name;
      return '<button class="chip'+(FILTER===id?' on':'')+'" style="white-space:nowrap" onclick="FILTER=\''+id+'\';render()">'+name+'</button>';}).join('')
    +'</div>';
  let list='';
  const groups=FILTER==='all'?SECTIONS:SECTIONS.filter(s=>s.id===FILTER);
  let found=0;
  groups.forEach(s=>{
    const ts=secTopics(s.id).filter(t=>!q||(t.title+' '+t.sum+' '+t.tag).toLocaleLowerCase('tr').includes(q));
    if(!ts.length)return;found+=ts.length;
    list+='<div class="sechead"><h3>'+s.name+'</h3><span class="ct">'+ts.length+' konu</span></div>';
    list+=ts.map(t=>row(t)).join('');
  });
  if(!found)list='<div class="empty">“'+QUERY+'” için konu bulunamadı.</div>';
  return '<div class="stack">'
    +'<div class="search">'+svg(I.search)+'<input id="q" type="search" placeholder="Konu ara: passive, bağlaç, if…" value="'+QUERY.replace(/"/g,'&quot;')+'"></div>'
    +chips+'<div class="stack" style="gap:9px">'+list+'</div></div>';
}
function row(t){
  const i=TOPICS.indexOf(t)+1,e=exState(t.id),n=exCount(t);
  const cls=topicDone(t)?' done':(topicStarted(t)?' started':'');
  return '<a class="toprow'+cls+'" href="#t-'+t.id+'">'
    +'<div class="tnum">'+(topicDone(t)?'✓':i)+'</div>'
    +'<div class="tmain"><div class="tname">'+t.title+'</div>'
    +'<div class="tmeta"><span>'+t.tag+'</span>'+(n?'<span>'+e.done+'/'+n+' alıştırma</span>':'<span>alıştırmasız</span>')+(S.video[t.id]?'<span>video ✓</span>':'')+'</div></div></a>';
}

/* ---------- ekran: konu ---------- */
let TAB='konu';
function viewTopic(t){
  const n=exCount(t),e=exState(t.id);
  const seg='<div class="seg" role="tablist">'
    +'<button role="tab" aria-selected="'+(TAB==='konu')+'" onclick="TAB=\'konu\';render()">Konu</button>'
    +'<button role="tab" aria-selected="'+(TAB==='alistirma')+'" onclick="TAB=\'alistirma\';render()">Alıştırma'+(n?' ('+n+')':'')+'</button></div>';
  if(TAB==='alistirma')return '<div class="stack">'+seg+(n?quizShell(t.ex,t.id):'<div class="empty">Bu bölümde alıştırma yok — okuyup devam edebilirsin.</div>')+'</div>';
  const idx=TOPICS.indexOf(t),prev=TOPICS[idx-1],next=TOPICS[idx+1];
  return '<div class="stack">'+seg
    +'<div class="prose">'+t.blocks.map(block).join('')+'</div>'
    +'<div class="videocard">'
      +'<div class="vt">'+svg(I.play)+' Ödev videosu</div>'
      +'<p>Bu konuyu okudun. Şimdi “'+t.title+'” başlıklı ödev videosunu izle; yazıyla anlatılamayan detaylar orada. Sonra alıştırmalara geç.</p>'
      +'<button class="vbtn'+(S.video[t.id]?' on':'')+'" onclick="toggleVideo(\''+t.id+'\')">'+svg(I.check)+(S.video[t.id]?' Videoyu izledim':' Videoyu izledim olarak işaretle')+'</button>'
    +'</div>'
    +'<button class="btn'+(S.read[t.id]?' ghost':'')+'" onclick="toggleRead(\''+t.id+'\')">'+(S.read[t.id]?'Okundu olarak işaretlendi ✓':'Okudum')+'</button>'
    +(n?'<button class="btn soft" onclick="TAB=\'alistirma\';render()">'+n+' alıştırmaya geç ('+e.done+' çözüldü)</button>':'')
    +'<div style="display:flex;gap:9px">'
      +(prev?'<a class="btn ghost" style="flex:1;text-decoration:none" href="#t-'+prev.id+'">← Önceki</a>':'')
      +(next?'<a class="btn ghost" style="flex:1;text-decoration:none" href="#t-'+next.id+'">Sonraki →</a>':'')
    +'</div></div>';
}
function toggleVideo(id){S.video[id]=!S.video[id];S.last=id;save();render();}
function toggleRead(id){S.read[id]=!S.read[id];S.last=id;save();render();}

/* ---------- alıştırma motoru ---------- */
let Q={key:null,list:[],i:0,answered:false,ok:null,correct:0,src:null};
function quizShell(list,srcId){
  if(Q.key!==srcId){Q={key:srcId,list:list.slice(),i:0,answered:false,ok:null,correct:0,src:srcId};}
  if(Q.i>=Q.list.length)return quizEnd();
  const q=Q.list[Q.i];
  const dots='<div class="qprog">'+Q.list.map((_,i)=>'<i class="'+(i<Q.i?'on':'')+'"></i>').join('')+'</div>';
  let body='';
  const label=q.t==='mc'?'Çoktan seçmeli':(q.t==='fill'?'Boşluğu doldur':'Çeviri');
  if(q.t==='mc'){
    body='<div class="qtext">'+q.q+'</div><div class="opts">'+q.o.map((o,i)=>{
      let c='';
      if(Q.answered){if(i===q.a)c=' right';else if(i===Q.pick)c=' wrong';}
      return '<button class="opt'+c+'"'+(Q.answered?' disabled':'')+' onclick="answerMC('+i+')"><span class="ltr">'+'ABCD'[i]+'</span><span>'+o+'</span></button>';
    }).join('')+'</div>';
  } else if(q.t==='fill'){
    body='<div class="qtext">'+q.q.replace('___','<span class="blank">&nbsp;</span>')+'</div>'
      +'<div class="answerbox"><input id="ans" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Cevabını yaz…" '+(Q.answered?'disabled value="'+(Q.typed||'').replace(/"/g,'&quot;')+'"':'')+' onkeydown="if(event.key===\'Enter\')answerFill()">'
      +(Q.answered?'':'<button class="btn" onclick="answerFill()">Kontrol et</button>')+'</div>';
  } else {
    body='<div class="qtext">'+q.q+'</div>'
      +(Q.answered?'':'<div class="answerbox"><input id="ans" type="text" autocomplete="off" placeholder="İngilizcesini yaz (isteğe bağlı)…" onkeydown="if(event.key===\'Enter\')revealTr()"><button class="btn" onclick="revealTr()">Cevabı göster</button></div>');
  }
  let fb='';
  if(Q.answered){
    if(q.t==='tr'){
      fb='<div class="fb neutral"><span class="key">'+q.a+'</span>'+(Q.typed?'<span class="why">Senin cevabın: '+esc(Q.typed)+'</span>':'')+'<span class="why">'+q.w+'</span></div>'
        +(Q.ok===null?'<div class="selfcheck"><button class="btn soft" onclick="selfGrade(true)">Bildim</button><button class="btn ghost" onclick="selfGrade(false)">Bilemedim</button></div>':'<button class="btn" onclick="nextQ()">'+(Q.i+1<Q.list.length?'Sonraki soru':'Bitir')+'</button>');
    }else{
      fb='<div class="fb '+(Q.ok?'good':'bad')+'">'+(Q.ok?'Doğru!':'Doğru cevap: '+(q.t==='mc'?q.o[q.a]:q.a))+'<span class="why">'+q.w+'</span></div>'
        +'<button class="btn" onclick="nextQ()">'+(Q.i+1<Q.list.length?'Sonraki soru':'Bitir')+'</button>';
    }
  }
  return '<div class="qcard">'+dots+'<span class="qtype">'+label+' · '+(Q.i+1)+'/'+Q.list.length+'</span>'+body+fb+'</div>';
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function norm(s){return String(s||'').toLocaleLowerCase('tr').replace(/[’'`]/g,"'").replace(/[.,!?]/g,'').replace(/\s+/g,' ').trim();}
function answerMC(i){const q=Q.list[Q.i];Q.pick=i;Q.answered=true;Q.ok=(i===q.a);if(Q.ok)Q.correct++;render();}
function answerFill(){
  const el=document.getElementById('ans');const v=el?el.value:'';Q.typed=v;const q=Q.list[Q.i];
  const accept=[q.a].concat(q.alt||[]).map(norm);
  Q.answered=true;Q.ok=accept.includes(norm(v));if(Q.ok)Q.correct++;render();
}
function revealTr(){const el=document.getElementById('ans');Q.typed=el?el.value:'';Q.answered=true;Q.ok=null;render();}
function selfGrade(ok){Q.ok=ok;if(ok)Q.correct++;render();}
function nextQ(){Q.i++;Q.answered=false;Q.ok=null;Q.pick=null;Q.typed='';render();window.scrollTo({top:0,behavior:'smooth'});}
function quizEnd(){
  const n=Q.list.length,c=Q.correct,pct=n?Math.round(c/n*100):0;
  if(Q.src&&Q.src!=='mix'){
    const prev=exState(Q.src);
    if(n>=prev.done){S.ex[Q.src]={done:n,correct:c,total:n};S.last=Q.src;save();}
  }
  const msg=pct>=80?'Bu konu oturmuş. Videoyu da izlediysen bir sonrakine geçebilirsin.':(pct>=50?'Fena değil. Konuyu bir kez daha oku, sonra tekrar dene.':'Konuya geri dön ve mantığı tekrar oku; sonra alıştırmaları tekrarla.');
  return '<div class="qcard" style="text-align:center;align-items:center">'
    +'<span class="qtype">Oturum bitti</span>'
    +'<div class="ringnum" style="font-size:40px">%'+pct+'</div>'
    +'<div class="small muted">'+n+' soruda '+c+' doğru</div>'
    +'<p class="small" style="color:var(--muted)">'+msg+'</p>'
    +'<button class="btn" style="margin-top:4px" onclick="restartQuiz()">Tekrar dene</button>'
    +(Q.src!=='mix'?'<button class="btn ghost" onclick="TAB=\'konu\';render()">Konuya dön</button>':'<button class="btn ghost" onclick="MIXSEC=\'all\';Q.key=null;render()">Yeni karışık set</button>')
    +'</div>';
}
function restartQuiz(){const k=Q.key;Q.key=null;if(k==='mix')buildMix();render();}

/* ---------- karışık alıştırma ---------- */
let MIXSEC='all';
function buildMix(){
  let pool=[];
  TOPICS.filter(t=>MIXSEC==='all'||t.s===MIXSEC).forEach(t=>t.ex.forEach(q=>pool.push(Object.assign({},q,{_t:t.title}))));
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
  MIX=pool.slice(0,12);
}
let MIX=null;
function viewPractice(){
  if(!MIX)buildMix();
  const chips='<div style="display:flex;gap:7px;overflow-x:auto;padding:0 2px 3px">'
    +['all'].concat(SECTIONS.map(s=>s.id)).map(id=>{
      const name=id==='all'?'Tüm kitap':SECTIONS.find(s=>s.id===id).name;
      return '<button class="chip'+(MIXSEC===id?' on':'')+'" style="white-space:nowrap" onclick="MIXSEC=\''+id+'\';buildMix();Q.key=null;render()">'+name+'</button>';}).join('')+'</div>';
  const head='<div class="hero"><h1>Karışık alıştırma</h1><span class="sub">Seçtiğin bölümden 12 rastgele soru.</span></div>';
  if(!MIX.length)return '<div class="stack">'+head+chips+'<div class="empty">Bu bölümde alıştırma yok.</div></div>';
  const cur=(Q.key==='mix'&&Q.i<Q.list.length)?Q.list[Q.i]:null;
  return '<div class="stack">'+head+chips
    +(cur&&cur._t?'<div class="chip" style="align-self:flex-start">Konu: '+cur._t+'</div>':'')
    +quizShell(MIX,'mix')+'</div>';
}

/* ---------- ekran: ilerleme ---------- */
function viewProgress(){
  const o=overall(),e=exTotals();
  const acc=e.answered?Math.round(e.correct/e.answered*100):0;
  const vids=Object.keys(S.video).filter(k=>S.video[k]).length;
  return '<div class="stack">'
  +'<div class="hero"><h1>İlerleme</h1><span class="sub">Bir konu; okundu, videosu izlendi ve alıştırmaları bitti ise tamamlanmış sayılır.</span></div>'
  +'<div class="stats">'
    +'<div class="stat"><div class="n">'+o.done+'/'+o.total+'</div><div class="l">tamamlanan konu</div></div>'
    +'<div class="stat"><div class="n">'+vids+'/'+TOPICS.length+'</div><div class="l">izlenen video</div></div>'
    +'<div class="stat"><div class="n">'+e.answered+'/'+e.all+'</div><div class="l">çözülen alıştırma</div></div>'
    +'<div class="stat"><div class="n">%'+acc+'</div><div class="l">doğru oranı</div></div>'
  +'</div>'
  +SECTIONS.map(s=>{
    const ts=secTopics(s.id),p=sectionPct(s.id);
    return '<div class="card"><div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px">'
      +'<div style="font-family:var(--font-d);font-weight:600">'+s.name+'</div><div class="small muted">%'+p+'</div></div>'
      +'<div class="bar" style="margin:9px 0 11px"><i style="width:'+p+'%"></i></div>'
      +'<div style="display:flex;flex-direction:column;gap:6px">'+ts.map(t=>{
        const ex=exState(t.id),n=exCount(t);
        return '<a href="#t-'+t.id+'" style="display:flex;gap:9px;align-items:center;text-decoration:none;color:inherit;font-size:13.5px">'
          +'<span style="width:9px;height:9px;border-radius:999px;flex:none;background:'+(topicDone(t)?'var(--ok)':(topicStarted(t)?'var(--accent)':'var(--line)'))+'"></span>'
          +'<span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+t.title+'</span>'
          +'<span class="muted" style="font-size:12px;font-variant-numeric:tabular-nums">'+(n?ex.done+'/'+n:'—')+'</span></a>';
      }).join('')+'</div></div>';
  }).join('')
  +'<button class="btn ghost" onclick="resetAll()">İlerlemeyi sıfırla</button>'
  +'<p class="fine">İlerlemen yalnızca bu cihazın tarayıcısında saklanır.</p>'
  +'</div>';
}
function resetAll(){
  if(document.getElementById('confirmReset'))return;
  const el=document.createElement('div');el.id='confirmReset';el.className='card';el.style.marginTop='10px';
  el.innerHTML='<div class="small">Bütün okundu, video ve alıştırma kayıtların silinsin mi?</div>'
    +'<div style="display:flex;gap:9px;margin-top:10px"><button class="btn" id="yes">Evet, sıfırla</button><button class="btn ghost" id="no">Vazgeç</button></div>';
  document.getElementById('view').appendChild(el);
  el.querySelector('#no').onclick=()=>el.remove();
  el.querySelector('#yes').onclick=()=>{S=Object.assign({},defState,{theme:S.theme});save();Q.key=null;MIX=null;render();};
}

/* ---------- çizim ---------- */
function render(){
  const h=route(),v=document.getElementById('view');
  if(h.startsWith('t-')){
    const t=byId(h.slice(2));
    if(t){S.last=t.id;save();topbar(t.title,t.tag,true);v.innerHTML=viewTopic(t);tabbar('topics');return;}
  }
  const page=VIEWS.includes(h)?h:'home';
  if(page==='home'){topbar('Ek Mantığı','englishwithfurkn',false);v.innerHTML=viewHome();}
  else if(page==='topics'){topbar('Konular',TOPICS.length+' başlık',false);v.innerHTML=viewTopics();
    const q=document.getElementById('q');
    if(q){q.oninput=()=>{QUERY=q.value;const s=q.selectionStart;render();const n=document.getElementById('q');if(n){n.focus();try{n.setSelectionRange(s,s);}catch(e){}}};}
  }
  else if(page==='practice'){topbar('Alıştırma','karışık set',false);v.innerHTML=viewPractice();}
  else {topbar('İlerleme','',false);v.innerHTML=viewProgress();}
  tabbar(page);
}
if(!location.hash)location.hash='#home';
render();
</script>
