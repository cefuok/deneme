<title>Ek Mantığı</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout: telefon kabuğu — sabit üst bar, kayan ekran, alt sekme çubuğu */
:root{
  --bg:#F2F4F6; --app:#FBFCFD; --surface:#FFFFFF; --surface-2:#F4F6F8;
  --ink:#121A20; --muted:#5E6E7B; --line:#E3E8EC;
  --primary:#0E6B63; --primary-soft:#D9EEEB; --primary-ink:#0A4E48;
  --accent:#C9741C; --accent-soft:#FBEBD8;
  --ok:#1C7F52; --ok-soft:#DFF2E7; --bad:#B8362C; --bad-soft:#FAE3E1;
  --on-primary:#FFFFFF;
  --font-d:'Sora',system-ui,sans-serif; --font-b:'Manrope',system-ui,sans-serif;
  --r:14px; --shadow:0 1px 2px rgba(18,26,32,.05),0 8px 24px rgba(18,26,32,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#070A0C; --app:#0E1317; --surface:#161D22; --surface-2:#1D262C;
  --ink:#E8EEF2; --muted:#94A6B2; --line:#27333A;
  --primary:#3FC2B2; --primary-soft:#12302E; --primary-ink:#8FE2D7;
  --accent:#E8A75C; --accent-soft:#33240F;
  --ok:#49C98A; --ok-soft:#10301F; --bad:#F0867A; --bad-soft:#331513;
  --on-primary:#06201E;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#070A0C; --app:#0E1317; --surface:#161D22; --surface-2:#1D262C;
  --ink:#E8EEF2; --muted:#94A6B2; --line:#27333A;
  --primary:#3FC2B2; --primary-soft:#12302E; --primary-ink:#8FE2D7;
  --accent:#E8A75C; --accent-soft:#33240F;
  --ok:#49C98A; --ok-soft:#10301F; --bad:#F0867A; --bad-soft:#331513;
  --on-primary:#06201E;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--surface)}
h1,h2,h3,h4{font-family:var(--font-d);margin:0;text-wrap:balance;line-height:1.25}
p{margin:0}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:6px}

/* ---- kabuk ---- */
#app{max-width:470px;margin:0 auto;min-height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));background:var(--app);position:relative}
@media(min-width:720px){
  #app{box-shadow:0 0 0 1px var(--line),0 24px 70px rgba(10,20,28,.14)}
}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---- üst bar ---- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar-in{display:flex;align-items:center;gap:10px;padding-block:11px;min-height:54px}
.tb-title{font-family:var(--font-d);font-weight:600;font-size:16.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb-sub{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.06em;text-transform:uppercase;display:block;line-height:1.3}
.iconbtn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none;color:var(--muted)}
.iconbtn:hover{background:var(--surface-2);color:var(--ink)}
.iconbtn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* ---- ekran ---- */
.screen{padding-block:16px 0;animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.screen{animation:none}*{transition:none!important}}
.pad-bottom{height:calc(84px + env(safe-area-inset-bottom,0px))}

/* ---- alt sekmeler ---- */
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,470px);z-index:35;
  background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:max(6px,env(safe-area-inset-left,0px));padding-right:max(6px,env(safe-area-inset-right,0px));
  display:flex}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 8px;color:var(--muted);font-size:10.5px;font-weight:600;letter-spacing:.01em}
.tab svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--primary)}
.tab[aria-current="page"] svg{stroke-width:2.2}

/* ---- genel parçalar ---- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stack{display:flex;flex-direction:column;gap:12px}
.eyebrow{font-size:10.5px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--muted)}
.chip.on{background:var(--primary-soft);border-color:transparent;color:var(--primary-ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 16px;border-radius:12px;background:var(--primary);color:var(--on-primary);font-weight:700;font-size:14.5px;width:100%}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.soft{background:var(--primary-soft);color:var(--primary-ink)}
.btn svg{stroke:currentColor;fill:none;stroke-width:2.2;width:17px;height:17px}
.btn:disabled{opacity:.45;cursor:default}

/* ilerleme çubuğu */
.bar{height:6px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:999px;background:var(--primary);transition:width .4s ease}
.bar.acc>i{background:var(--accent)}

/* formül şeridi — kitabın değişmez yapısı */
.formula{display:flex;flex-wrap:wrap;gap:5px;align-items:center;font-family:var(--font-d);font-size:12.5px;font-weight:600}
.formula span{padding:4px 9px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line)}
.formula span.k{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.formula b{color:var(--muted);font-weight:600}

/* konu içeriği */
.prose{display:flex;flex-direction:column;gap:13px;font-size:15px;line-height:1.72}
.prose h4{font-size:15.5px;font-weight:600;margin-top:7px;color:var(--ink);display:flex;align-items:center;gap:8px}
.prose h4::before{content:"";width:3px;height:16px;border-radius:2px;background:var(--primary);flex:none}
.prose ul{margin:0;padding-left:19px;display:flex;flex-direction:column;gap:7px}
.prose li::marker{color:var(--primary)}
.rule{background:var(--accent-soft);border-radius:12px;padding:12px 13px;font-size:14px;line-height:1.6;border-left:3px solid var(--accent)}
.rule b{color:var(--accent)}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px;display:flex;flex-direction:column;gap:4px}
.ex .en{font-weight:700;font-size:14.5px;letter-spacing:-.005em}
.ex .tr{font-size:13.5px;color:var(--muted)}
.ex .nt{font-size:12.5px;color:var(--muted);border-top:1px dashed var(--line);padding-top:7px;margin-top:3px;line-height:1.55}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 10px;font-size:14px}
.kv dt{font-weight:700;color:var(--primary)}
.kv dd{margin:0;color:var(--muted)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:330px}
th,td{text-align:left;padding:9px 11px;border-bottom:1px solid var(--line)}
th{font-family:var(--font-d);font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);background:var(--surface-2)}
tr:last-child td{border-bottom:none}
td b{color:var(--primary)}
</style>
<style>
/* ---- konu kartı listesi ---- */
.toprow{display:flex;gap:11px;align-items:center;width:100%;text-align:left;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.toprow:hover{border-color:var(--primary)}
.tnum{width:32px;height:32px;border-radius:9px;background:var(--surface-2);display:grid;place-items:center;font-family:var(--font-d);font-size:12.5px;font-weight:700;color:var(--muted);flex:none}
.toprow.done .tnum{background:var(--ok-soft);color:var(--ok)}
.toprow.started .tnum{background:var(--accent-soft);color:var(--accent)}
.tmain{flex:1;min-width:0}
.tname{font-family:var(--font-d);font-weight:600;font-size:14.5px;line-height:1.35}
.tmeta{font-size:11.5px;color:var(--muted);margin-top:2px;display:flex;gap:9px;flex-wrap:wrap}
.tick{width:16px;height:16px;flex:none;stroke:var(--ok);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.sechead{display:flex;align-items:baseline;gap:9px;margin:18px 0 9px}
.sechead:first-child{margin-top:4px}
.sechead h3{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.sechead .ct{font-size:11.5px;color:var(--muted);margin-left:auto}

/* ---- arama ---- */
.search{display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px}
.search input{flex:1;min-width:0;border:none;background:none;padding:11px 0;font:inherit;font-size:14.5px;color:var(--ink)}
.search input:focus{outline:none}
.search svg{width:17px;height:17px;stroke:var(--muted);fill:none;stroke-width:2;flex:none}

/* ---- alıştırma ---- */
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px;display:flex;flex-direction:column;gap:13px}
.qtype{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--accent)}
.qtext{font-family:var(--font-d);font-size:16px;font-weight:600;line-height:1.45}
.qtext .blank{color:var(--primary);border-bottom:2px solid var(--primary);padding:0 10px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:flex-start;gap:10px;text-align:left;width:100%;padding:12px;border-radius:11px;border:1.5px solid var(--line);background:var(--surface);font-size:14.5px;line-height:1.45;transition:background .15s,border-color .15s}
.opt:hover:not(:disabled){border-color:var(--primary)}
.opt .ltr{width:21px;height:21px;border-radius:6px;background:var(--surface-2);display:grid;place-items:center;font-size:11.5px;font-weight:700;color:var(--muted);flex:none;margin-top:1px}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .ltr{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .ltr{background:var(--bad);color:#fff}
.opt:disabled{cursor:default}
.answerbox{display:flex;flex-direction:column;gap:9px}
.answerbox input{width:100%;padding:12px;border-radius:11px;border:1.5px solid var(--line);background:var(--surface-2);font:inherit;font-size:15px;color:var(--ink)}
.answerbox input:focus{outline:none;border-color:var(--primary);background:var(--surface)}
.fb{border-radius:11px;padding:11px 12px;font-size:13.5px;line-height:1.6;display:flex;flex-direction:column;gap:6px}
.fb.good{background:var(--ok-soft);color:var(--ok)}
.fb.bad{background:var(--bad-soft);color:var(--bad)}
.fb.neutral{background:var(--surface-2);color:var(--ink)}
.fb .key{font-family:var(--font-d);font-weight:700;color:var(--ink);font-size:14.5px}
.fb .why{color:var(--muted);font-size:13px}
.qprog{display:flex;gap:4px;align-items:center}
.qprog i{flex:1;height:4px;border-radius:999px;background:var(--surface-2)}
.qprog i.on{background:var(--primary)}
.qprog i.miss{background:var(--bad)}
.selfcheck{display:flex;gap:8px}
.selfcheck .btn{padding:10px}

/* video kartı */
.videocard{background:var(--primary-soft);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:11px}
.videocard .vt{font-family:var(--font-d);font-weight:600;font-size:14.5px;color:var(--primary-ink);display:flex;gap:9px;align-items:center}
.videocard .vt svg{width:19px;height:19px;stroke:var(--primary-ink);fill:none;stroke-width:1.9;flex:none}
.videocard p{font-size:13.5px;color:var(--primary-ink);opacity:.85;line-height:1.6}
.vbtn{display:flex;align-items:center;justify-content:center;gap:8px;padding:11px;border-radius:11px;background:var(--surface);font-weight:700;font-size:14px;color:var(--primary-ink);border:1.5px solid transparent}
.vbtn.on{background:transparent;border-color:var(--primary);color:var(--primary-ink)}
.vbtn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}

/* segment */
.seg{display:flex;background:var(--surface-2);border-radius:11px;padding:3px;gap:3px}
.seg button{flex:1;padding:8px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}

/* halka */
.ring{display:flex;align-items:center;gap:14px}
.ring svg{width:66px;height:66px;flex:none;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:7;stroke-linecap:round}
.ring .track{stroke:var(--surface-2)}
.ring .val{stroke:var(--primary);transition:stroke-dashoffset .6s ease}
.ringnum{font-family:var(--font-d);font-size:24px;font-weight:700;line-height:1}

/* istatistik */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat .n{font-family:var(--font-d);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .l{font-size:11.5px;color:var(--muted);margin-top:3px}

.empty{text-align:center;padding:38px 16px;color:var(--muted);font-size:14px}
.hero{display:flex;flex-direction:column;gap:4px}
.hero h1{font-size:25px;font-weight:700;letter-spacing:-.02em}
.hero .sub{font-size:13.5px;color:var(--muted)}
.fine{font-size:11.5px;color:var(--muted);line-height:1.6;text-align:center;padding:14px 0}
</style>

<style>
.chiprow{display:flex;gap:7px;overflow-x:auto;padding:0 2px 3px;scrollbar-width:none;-ms-overflow-style:none}
.chiprow::-webkit-scrollbar{display:none}
.chiprow .chip{white-space:nowrap;flex:none}
.flashcard{width:100%;min-height:210px;border-radius:18px;background:var(--surface);border:1px solid var(--line);
  padding:26px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;text-align:center;box-shadow:var(--shadow);
  transition:background .18s,border-color .18s}
.flashcard.flipped{background:var(--primary-soft);border-color:transparent}
.flashcard:active{transform:scale(.995)}
.fc-side{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.fc-main{font-family:var(--font-d);font-size:23px;font-weight:600;line-height:1.3;letter-spacing:-.01em;overflow-wrap:anywhere}
.flashcard.flipped .fc-main,.flashcard.flipped .fc-side{color:var(--primary-ink)}
.fc-note{font-size:13.5px;color:var(--muted);line-height:1.55;max-width:34ch}
.flashcard.flipped .fc-note{color:var(--primary-ink);opacity:.8}
.fc-hint{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);margin-top:6px;letter-spacing:.02em}
.fc-hint svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.tab{font-size:10px}
.toprow .bar{height:5px}
a.btn{text-decoration:none}
.qtext .blank{display:inline-block;min-width:54px}
</style>

<div id="app">
  <header class="topbar"><div class="topbar-in gut" id="topbar"></div></header>
  <main id="view" class="screen gut"></main>
  <div class="pad-bottom"></div>
  <nav class="tabbar" id="tabbar"></nav>
</div>

<script>
const SECTIONS=[{"id":"s1","name":"Temel Mantık","desc":"Cümle yapısı, özne, fiil ve ekler"},{"id":"s2","name":"Cümle Uzatma","desc":"Bağlaç, çağrışım, relative ve noun clause"},{"id":"s3","name":"Zamanlar","desc":"Tenslerin tek kuralı: yardımcı fiiller"},{"id":"s4","name":"Modals ve If","desc":"Duygusal ekler ve koşul cümleleri"},{"id":"s5","name":"Passive","desc":"“-ıl / -il” ekinin bütün halleri"}];
const TOPICS=[{"id":"onsoz","s":"s1","title":"Ön Söz","tag":"Giriş","sum":"Kitabın amacı ve nasıl çalışman gerektiği.","blocks":[["p","Bir dil öğrenmek yalnızca kelimeleri ve kuralları ezberlemek değildir; o dilin mantığını kavramaktır. İngilizce, yapısı itibarıyla Türkçeden oldukça farklı bir dildir ve bu farklılık özellikle cümle kurarken eklerin, bağlaçların ve zaman yapılarının doğru kullanımını kritik hale getirir."],["p","“Anlıyorum ama konuşamıyorum” sorununun temelinde İngilizcenin yapısal mantığını tam olarak kavrayamamak yatar. Bu kitap size bu mantığı adım adım öğretmeyi hedefliyor. Özne–fiil–ek–isim yapısı gibi İngilizcenin değişmez kurallarını öğrenerek uzun ve karmaşık cümleleri bile rahatlıkla kurabilir ve çevirebilir hâle geleceksiniz."],["p","Kitabın en önemli özelliği Türkçe düşünme alışkanlığınızı İngilizceye uyarlamanızı sağlamasıdır. Eklerin nasıl kullanılacağını, bağlaçların cümle içindeki işlevini ve zaman yapılarının mantığını öğrenirken aslında İngilizce düşünmeye başladığınızı fark edeceksiniz."],["r","Kitabı okurken her konu anlatımı bittiğinde ödev videolarını <b>MUTLAKA</b> izlemelisiniz; çünkü yazarak bazı şeyler tam ifade edilemeyebilir. Hangi konuyu okuduysanız o konunun başlığını diğer dosyadaki başlıkla eşleştirmelisiniz ki karışıklık olmasın."],["p","Şunu da belirtmeliyim: Başta anlatacağım konular en temelden en zora doğru ilerliyor. Bu yüzden sizi asıl geliştirecek konular “isimleştirme — relative clause — passive — noun clause” konularının mantığını anlamanızdır. Bu konuları anlayabilmek için sırasıyla diğer konuları da anlatıyor olacağım; o yüzden konuları atlamadan, sabırlı ve sistemli bir şekilde okumalısınız ki kafanız karışmasın."],["p","Yolculuğunuza başlarken sabırlı olmanızı ve her adımda öğrendiklerinizi pratik etmenizi öneririm. Unutmayın, dil öğrenmek bir maratondur; adım adım ilerledikçe başarıya ulaşırsınız. Keyifli öğrenmeler dilerim."]]},{"id":"cumle-yapisi","s":"s1","title":"Cümle Yapısı","tag":"Temel","sum":"İngilizcenin asla değişmeyen kalıbı.","blocks":[["f",["Özne","fiil","ek","isim","………","isim"]],["p","Yukarıda yazdığım yapı, İngilizcenin asla değişmeyecek olan yapılarından birisidir. Bu yapıyı öğrendikten sonra, aslında İngilizcenin ne kadar basit bir dil olduğunu göreceksiniz. “Anlıyorum ama konuşamıyorum.” sorununun en büyük sebebi, bu yapıya tam anlamıyla hâkim olamamaktan kaynaklanır."],["p","Bu yapının en önemli kısmı “ekler”dir; çünkü aslında biz İngilizcede fiilleri ve özneleri yazabiliyoruz. Bunun sebebi, bu yapının lise ve hazırlık sınıflarında sürekli öğretilmesi ve öğrencilerin bunun dışına çıkamamasıdır."],["p","Örneğin, bu kitaba sahip olan herkes zaten “I go”, “I went” veya “I read”, “I am reading” cümlelerini kurabiliyordur. Çünkü bu yapılar dışında, eğitim sistemimizde cümle uzatmaya dair bir mantık anlatılmıyor. Sizi konuşturacak en önemli mantık ise “ekleri” kullanmayı bilmektir."],["p","Örneğin “Ben arkadaşlarımla evde oturuyorum.” cümlesini çevirin desem, belki birkaçınız bütün kelimelerin anlamlarını bilmesine rağmen yanlış çevirecektir. Fakat burada “arkadaşı – friend”, “evi – home”, “oturmak eylemini – sit” olarak bilsek de, “ile”, “-m”, “-de/-da” eklerini doğru bağlayamazsak bu cümleyi kuramayız."],["r","Bu yapıyı anlatırken <b>mantığını anlamaya odaklanın</b>; çünkü şu an anlatmamış olduğum bazı konuları da kullanıyor olacağım. Ancak onlara takılmadan sadece neyi anlatmak istediğime odaklanın."],["p","Hazırsanız, bu yapıda yer alan özne nedir, fiil nedir, en yaygın ekler hangileridir ve isimleştirmeler nedir, bunları tek tek detaylı anlatalım."]]},{"id":"ozne","s":"s1","title":"Özne","tag":"Temel","sum":"7 özne ve tekil–çoğul ayrımı.","blocks":[["p","İngilizcede 7 tane özne vardır ve bunların anlamlarını her ne kadar bilsek de, asıl bilmemiz gereken şey bunları <b>tekil ve çoğul</b> olarak ayırmak zorunda olduğumuzdur. Çünkü birazdan anlatacağım fiil grameri, bu öznelerin tekil veya çoğul olmasına göre şekillenecektir."],["dl",[["I","ben — (-m)"],["You","sen — (-n)"],["We","biz — (-mız/-miz)"],["They","onlar — (-lar/-ler)"],["He","o (erkek için)"],["She","o (kız için)"],["It","o (cansız varlıklar, hayvanlar ve öznesiz cümle başlangıçları için)"]]],["r","<b>I - you - we - they</b> çoğul öznelerken, <b>he - she - it</b> tekil öznedir."],["p","Cümlelere bu öznelerle başlamak zorundayız, fakat bazı istisnalar olabilir. Örneğin, he öznesi yerine özel isimler de kullanılabilir:"],["e","He is going to work.","O işe gidiyor.",""],["e","Ahmet is going to work.","Ahmet işe gidiyor.","Burada “kim işe gidiyor?” sorusunun cevabı “o” yani “Ahmet” olduğu için, özne olarak Ahmet kullanılmıştır."],["e","She is drinking coffee.","O kahve içiyor.",""],["e","Ayşe is drinking coffee.","Ayşe kahve içiyor.","Her zaman “she” öznesiyle başlamak zorunda değiliz; eğer “she”ye gönderme yapacak bir özel isim varsa onunla başlarız."],["p","Şimdi biraz “it” öznesine bakalım. Eğer “it” öznesini “cat” ismiyle birleştirirsem, cümle başlangıcım “it” ile olmayacaktır; çünkü bir hayvan ismiyle başlıyorum."],["e","The cat is sleeping now.","Kedi şu an uyuyor.","Hayvanlarda “it” kullanmak gerekse de, “it” gizli özne olarak kullanılır ve “cat” isminin içinde barınır. Bu yüzden cümlelerde bu isimlerle başlarız."]]},{"id":"cogullastirma","s":"s1","title":"İsimleri Çoğullaştırma","tag":"Temel","sum":"“-s” takısı ve çoğul özne mantığı.","blocks":[["p","Herhangi bir ismin sonuna “-s” takısı koyarsanız, o ismi çoğullaştırarak “-lar/-ler” anlamı kazandırırsınız. Örneğin, “cat” isminin sonuna “s” takısı koyarsam bu “cats” yani “kediler” anlamına gelir."],["p","Çoğul isimler otomatik olarak çoğul özne olarak kabul edilir. Her ne kadar “it” öznesi “kediye” gönderme yapsa da, artık “cats” dediğimde “kediler”, yani “onlar” anlamı oluşur ve “they” öznesine gönderme yapar."],["e","Cats are sleeping.","Kediler uyuyor.","Fark ettiyseniz, fiilim is’den are’a dönüştü; çünkü çoğul özne olarak yazdık."],["p","Örnek olarak, özel isimleri yani Ahmet – Ayşe – Fatma gibi isimleri çoğul bir şekilde kullanabiliyoruz. Örneğin, her ne kadar Ahmet “he” öznesine gönderme yapsa da, şöyle bir cümlede çoğul olarak yazılmalıdır:"],["e","Ahmet and Ayşe are playing football.","Ahmet ve Ayşe futbol oynuyor.","“Onlar – they” göndermesi olduğu için fiilim de otomatik olarak çoğul özne mantığına göre yazılmalıdır."],["r","Özneler konusunda çok zor bir yapı yok; sadece <b>tekil ve çoğul</b> kısımlara dikkat etmelisiniz."]]},{"id":"tobe","s":"s1","title":"To Be Fiilleri","tag":"Fiil","sum":"am – is – are ve isim cümlecikleri.","blocks":[["p","İngilizcede iki tane fiil yapısı vardır: <b>“To be” fiilleri</b> ve <b>“Action” fiilleri</b>."],["p","“To be” fiillerinin Türkçede birebir bir karşılığı olmamakla birlikte, mantığını anlamanız gereken fiillerdir. Bunları am – is – are olarak ayırıyoruz. Bu fiillerin tam Türkçe karşılığı olmasa da şu şekilde çevirebiliriz: “-dır, -dir”, “bulunma”, “görünme” gibi anlamlara gelir."],["dl",[["is","tekil özneler"],["are","çoğul özneler"],["am","sadece “I” öznesine özeldir"]]],["p","Bu fiil yapılarını kullanırken, cümle başında kullandığımız öznelerin herhangi bir eylem yapmadığını, pasif durumda olduklarını bilmemiz gerekir. Aynı zamanda “to be” fiillerini <b>isim cümlecikleri</b> olarak öğrenmemiz de önemlidir."],["h","İsim cümlecikleri nedir?"],["r","Eğer Türkçede yüklemimiz bir <b>isim</b> ile bitiyorsa, orada gizli bir “to be” fiili vardır."],["e","I am happy.","Ben mutluyum.","Yüklemim bir sıfatla bitmiş. Bu yüzden özneden sonra “to be” fiilini kullanmam gerekir. “I” öznesi kullandığımız için alacağı fiil yapısı “am” olacaktır."],["e","She is in the kitchen.","O mutfakta.","Türkçesinde “mutfakta bulunuyor”, “mutfaktadır” ya da “mutfakta görünüyor” diyebildiğimiz için bu anlamları “is” fiiline yükleyebiliriz. Bunu çözmenin en basit yolu: Eğer yüklemim isimle bitiyorsa “to be” fiilini kullanmak zorundayım."],["e","They are handsome.","Onlar yakışıklı.","Yüklem bir sıfatla bittiği için, çoğul özneye uygun olarak “are” fiilini kullanıyoruz."]]},{"id":"action","s":"s1","title":"Action Fiilleri","tag":"Fiil","sum":"Sonu “-mak / -mek” ile biten bütün eylemler.","blocks":[["p","Bu fiil yapısı aslında çok basittir; çünkü Türkçede sonu <b>-mak / -mek</b> ile biten bütün eylem fiilleri bu gruba girer. Örneğin: go – gitmek, come – gelmek, drink – içmek vb."],["r","Eğer yüklemim “mak / mek”li bir fiille bitiyorsa <b>sadece action fiil</b> kullanmak zorundayım. “To be” fiillerinden farkı, bu özneler artık aktiftir; bir eylem yaparlar."],["e","I drink coffee.","Ben kahve içerim.","Yüklemim doğrudan “içmek” fiilidir, bu yüzden İngilizcede karşılığı olan fiili yazıyorum."],["e","He comes to home.","O eve gelir.","Yüklem “gelmek” olduğu için action fiil “come” kullanılır. Buradaki “s” takısını present simple konusunda açıklayacağım."],["e","They love us.","Onlar bizi seviyor.","“Sevmek” fiiliyle bittiği için sadece o fiilin karşılığını yazıyoruz."]]},{"id":"ozet-fiil","s":"s1","title":"Özet: İki Cambaz Oynamaz","tag":"Kural","sum":"Bir cümlede iki fiil yan yana gelmez.","blocks":[["p","Kısaca özetlemek gerekirse, öğrencilerin sık yaptığı hatalardan biri iki fiili yan yana getirmektir."],["e","I am go to school.","(Yanlış) Okula giderim.","Bu çeviriyi yapmak isteyen bir öğrenci “I” dedikten sonra otomatik olarak “am” fiilini koyuyor, ardından “go” fiilini de ekleyerek iki fiili yan yana getirmiş oluyor. Ancak cümlenin sonunda gitmek eylemi bulunduğu için “am” kullanmamalıyız."],["r","Unutmayın: <b>Bir cümlede iki cambaz oynamaz.</b> İngilizce, her şeyden bir tane isteyen bir yapıya sahiptir."]]},{"id":"ceviri-mantigi","s":"s1","title":"Çeviri Mantığı: Sondan Başla","tag":"Yöntem","sum":"Türkçenin sonundan başlayarak çevirmek.","blocks":[["p","Türkçe, sondan eklemeli bir dil olduğu için bizim cümle kurma yapımız her zaman şu şekildedir: <b>“Özne – isim – ek – fiil”</b>. İngilizcede ise tam tersi bir yapı vardır: <b>“Özne – fiil – ek – isim.”</b>"],["r","Bu yüzden ne okursanız okuyun, ne çevirirseniz çevirin, her zaman <b>Türkçenin en sonundan</b> başlamanız gerekiyor ki İngilizcenin yapısına uydurabilesiniz. Cümleyi sondan çevirmemizin tek sebebi, Türkçede sona gelen ekleri İngilizcede ilk söyleyebilmemizdir."],["h","Örnek çözüm"],["e","We go by car to the school from the home with our friends.","Arkadaşlarımızla evden okula arabayla gideriz.","Sondan doğru çeviri yaparken ilk yükleme bakarız: “Gideriz” — “Kim gidiyor?” “–ız, –iz” ekinden we öznesi olduğunu anladım ve cümleme başladım."],["l",["go → gitmek","by → ile / la / le","car → araba","to → a / e","school → okul","from → dan / den","home → ev","with → ile / la / le","our → mız / miz","friends → arkadaşlar"]],["p","Bu çeviri mantığı hiçbir şekilde değişmeyecektir ve uzun cümleleri de bu şekilde çevirebilir, kurabilirsiniz."]]},{"id":"ekler-edatlar","s":"s1","title":"En Çok Kullanılan Ekler ve Edatlar","tag":"Ek","sum":"with, by, to, from, in, on, at, for, about.","blocks":[["h","With → (ile, -la, -le)"],["p","Sadece nesne, canlı isimler ile kullanılır."],["e","I am with you.","Seninleyim.",""],["e","I open the door with a key.","Anahtarla kapıyı açarım.",""],["h","By → (ile, -la, -le)"],["p","Aynı anlama gelir, ancak sadece araçlarla kullanılır."],["e","I come by car.","Arabayla gelirim.",""],["e","I travel by plane.","Uçakla seyahat ederim.",""],["h","To → (a, e)"],["p","Yönelme anlamı katar. İsimlerle kullanılır."],["e","I go to the school.","Okula giderim.",""],["e","I come to your home.","Evine gelirim.",""],["h","From → (dan, den, tan, ten)"],["p","Çıkma anlamı katar."],["e","I come from the school.","Okuldan gelirim.",""],["e","They take a knife from the kitchen.","Mutfaktan bıçak alırlar.",""],["h","In → (de, da, ta, te)"],["p","Bulunma hali bildiren bir edattır. Fakat bu eki “içinde” anlamını düşünerek değil, yalnızca “de-da” olarak öğrenmelisiniz. “Evin içindeyim” ile “Evdeyim” cümlelerinden hangisini daha sık kullanırız? Tabii ki “Evdeyim.” Buradaki “de” takısı zaten “evin içinde” olduğumuzu anlatıyor."],["e","I am in the house.","Evdeyim.",""],["e","We eat food in the kitchen.","Mutfakta yemek yeriz.",""],["h","On → (de, da, ta, te) + “üstünde”"],["p","“in” mantığıyla benzer düşünülmelidir. “Sandalyenin üzerindeyim” yerine kafamız otomatik olarak “Sandalyedeyim.” der; bu yüzden buradaki “de-da” anlamını “üstünde” olarak düşünmeli ve “on” kullanmalıyız."],["e","I am on the chair.","Sandalyedeyim.",""],["e","I sit on the sofa.","Koltukta otururum.",""],["h","At → (de, da, ta, te)"],["p","Tekrar bulunma hali bildirir. Fakat “in” ve “on” gibi içinde ya da üstünde anlamı yoktur. Buna rağmen, özel alanlar, saatler ve ne içinde ne üstünde olduğumuz durumlarda kullanılır."],["e","At seven o’clock.","Saat yedide.","“Her saatte ‘de-da’ anlamı varsa, bunlar her zaman at ile kullanılır.”"],["e","I am at home.","Evdeyim.","Home, kendine ait olan ev, yani özel alan anlamındadır. Ancak house kendine ait olmayan bir evdir; komşunun evi ya da herhangi bir ev olabilir → I am in the house."],["e","I play football at the garden.","Bahçede futbol oynarım.","Ne içinde ne üstünde olduğumuz için at kullanılır."],["e","I walk at the street.","Sokakta yürürüm.","Sokağın belli bir bölümünde olduğumuzu vurgularız."],["h","For → (için)"],["p","Amaç belirten bir edattır. Kendisinden sonra bir isim gelmesi gerektiğini unutmayalım."],["e","I live for you.","Senin için yaşarım.",""],["e","I work for money.","Para için çalışırım.",""],["h","About → (hakkında / neredeyse)"],["e","I know something about math.","Matematik hakkında bir şeyler biliyorum.","“Math” bir isim olduğundan “hakkında” anlamı çıkar."],["e","I study about two hours.","Neredeyse iki saat ders çalışırım.","Bir zaman ifadesiyle kullanılırsa “neredeyse” anlamı katar."]]},{"id":"sahiplik","s":"s1","title":"Sahiplik Ekleri","tag":"Ek","sum":"my, your, our, their, his, her, its.","blocks":[["p","Aşağıda yazmış olduğum eklerin çevirilerini ne desem herkes “benim, senin, bizim, onların, onun” olarak söyleyecektir. Fakat yukarıda anlattığım “in-on” mantığına göre bunların uzun hallerini aslında Türkçemizde kullanmıyoruz ve daha kısa hallerini kullanıyoruz: “Benim arabam” değil, “Arabam”."],["r","Türkçemiz her zaman ekleri <b>kısaltmaya dayalı</b> konuşmadır. Bu yüzden bu ekleri kısa ek karşılıklarıyla öğrenirsek çeviri yapmak basitleşir."],["dl",[["My – “m”","arabam → my car"],["Your – “n”","araban → your car"],["Our – “mız”","arabamız → our car"],["Their – “ları”","arabaları → their car"],["His (erkek) – “sı/si”","arabası → his car"],["Her (kız) – “sı/si”","arabası → her car"],["Its (hayvan-cansız) – “u/ü/ı/i”","kuyruğu → its tail"]]]]},{"id":"isimlestirme-to","s":"s1","title":"İsimleştirme: “To”","tag":"İsimleştirme","sum":"(mak için / ma-me) — fiilden önce gelen ek.","blocks":[["p","Türkçede 13 adet isimleştirme (fiilimsiler) eki bulunur: “-ma, -ış, -mak, -an, -ası, -mez, -ar, -dik, -ecek, -miş…” Bu ekler, bir fiille geldiklerinde onu isme çevirmekle görevlidir."],["r","Türkçede bu kadar çok olması sizi korkutmasın; İngilizcede sadece <b>iki tane</b> isimleştirme eki vardır: <b>“to”</b> ve <b>“-ing”</b>."],["p","“To”, (mak için / ma-me) anlamlarına gelen, kendisinden sonra bir fiil ile kullanılan ve bu fiili cümle içinde isimleştirmeye yarayan bir ektir. Bu ek, cümledeki fiilin bir amacı olduğunu açıklar. Her fiilin yapılmadan önce bir amacı olabileceği için, bu yapı neredeyse her cümlede kullanılabilir."],["e","You go to the library to study.","Ders çalışmak için kütüphaneye gidersin.","Cümlede iki fiil var: go ve study. İngilizce gramerde sadece bir fiil kullanılabilir; ortadaki “study” fiilini “to – (mak için)” ekiyle isimleştirmeliyim. Böylece asıl fiilim sadece “go” olur."],["e","You go to the library study.","(Yanlış) “Ders çalışmak kütüphaneye gidersin.”","“Study” fiilini yalın halde yazdığım için iki fiil olmuş olur ve bu gramer hatasıdır."],["e","I watch TV on the sofa to relax.","Rahatlamak için koltukta TV izlerim.","Ana fiil (yüklem) dışında gelen her fiili isimleştirmemiz gerekir. Bunu da “to” ile yapıyoruz."]]},{"id":"isimlestirme-ing","s":"s1","title":"İsimleştirme: “-ing”","tag":"İsimleştirme","sum":"Sona gelen isimleştirme eki; “-yor” demek değildir.","blocks":[["p","“Ing” kullanımını sadece şimdiki zamanda gördüğünüzü düşünüyorum ve bunun anlamını “-yor” olarak algılıyorsunuz. Fakat “-ing” ekinin İngilizcede tek bir görevi vardır, o da <b>isimleştirmeden</b> başka bir şey değildir. Aynı zamanda “-yor” gibi bir anlamı da yoktur; biz onu Türkçeye çevirirken o şekilde çevirmek zorunda kaldığımız için öyle sanıyoruz."],["h","“After” ve “Then” Mantığı"],["p","Size “after” kelimesinin anlamını sorsam çoğunuz “sonra” diyecektir. “Then” için de aynısını. “Okuldan sonra” derken “sonra”yı after alırsak, “okuldan” kısmındaki “-dan/-den” ekini from olarak vermemiz gerekir. O zaman cümle “After from school” olurdu."],["r","Böyle bir çeviri görmediniz, değil mi? Çünkü <b>iki ek yan yana kullanılmaz</b> — tıpkı iki fiilin yan yana gelememesi gibi. Demek ki “after” = “-den sonra” anlamına gelir ve doğru çeviri “After school” olmalıdır."],["h","“After Coming” Örneği"],["p","“Geldikten sonra” cümlesini çevirelim. “Gelmek” fiilini “come” olarak yazarsak cümlede iki fiil olur; fiili isimleştirmemiz gerekir. “to” koyarsak “After to come” olur — teknik olarak isimleşti, fakat iki ek yan yana geldiği için yine gramer hatasıdır."],["r","O zaman “-ing” de bir isimleştirme ekidir; fakat <b>öne gelen</b> bir ek değildir. “-ing” ekini <b>sona gelen</b> bir ek olarak öğreniriz."],["e","After coming.","Geldikten sonra.","Hem iki ek yan yana gelmemiş olur hem de “come” fiili artık isimleşmiş hale gelir. “After come” deseydik çevirisi “gelmekten sonra” olurdu."],["h","“I am going” Yapısına Dikkat"],["p","“I am go” gibi bir yapı söyleyemeyiz. Eğer “-ing” konusunu biliyorsam, “go” fiiline “-ing” geldiğinde artık onun isimleştiğini anlamalıyım. O zaman “I am going” dediğimde benim ana fiilim “am” olur, çünkü “going” kısmı artık isimdir."],["p","Öğrenciler genellikle “I going” der; çünkü “am/is/are” kelimelerinin bir anlamı olmadığını düşünürler. Fakat bu yapıda fiil yoktur, sadece özne ve isim vardır. İngilizce kurallı bir dil olduğu için fiil mutlaka olmalıdır, ve o fiil de “to be” fiilidir: <b>I am going.</b>"],["h","Diğer ekler"],["e","I listen to music while studying.","Ders çalışırken müzik dinlerim.","While = -ken. “Ders çalışmak” eylemi “-ken” eki ile birleştiği için ve ana fiilimiz müzik dinlemek olduğundan, onu “-ing” ile isimleştiriyoruz."],["e","I study by listening to music.","Müzik dinleyerek ders çalışırım.","By = -arak / -erek. Ek ile bir fiil birleştiğinde “-ing” ile isimleştiriyoruz."],["h","Uzun Cümle Örneği"],["e","I am sitting in the library to study by listening to music.","Müzik dinleyerek ders çalışmak için kütüphanede oturuyorum.","1) “-m” → I  2) oturuyorum → I am sitting  3) kütüphanede → in the library  4) ders çalışmak için → to study  5) müzik dinleyerek → by listening to music."],["r","Yukarıda anlattığım kurallar hiçbir zaman değişmeyecektir. A2-B1-B2-C1 seviyelerindeki cümlelerde bile İngilizce kuralı birdir."]]},{"id":"baglaclar","s":"s2","title":"Bağlaçlar","tag":"Cümle Uzatma","sum":"İki cümleciği birbirine bağlayan köprüler.","blocks":[["p","Yukarıda anlattığım yapı sadece tek bir cümle kurmaya dayalı olan eklerle uzatılmış cümlelerdi. Şimdi iki tane cümle yapma mantığına bakacağız. Bağlaç dediğimiz olay, iki “clause”, yani cümleciği bağlayan ve <b>köprü görevi</b> gören yapılardır."],["p","Örneğin “I came to home” – “eve geldim” ifadesini okuduğunuzda mantıksız bir şey algılamıyorsunuz. Fakat bu cümleyi “when I came to home” – “eve geldiğimde” yaparsam, artık mantıksız gelecektir; çünkü kendisinden sonra bir cümle daha söyleme gereksinimi duyuyoruz."],["r","BAĞLAÇLARIN KENDİ ANLAMI HER ZAMAN CÜMLENİN <b>ANA FİİLİ</b> NE İSE ONUNLA BİRLEŞİR VE CÜMLENİN BAŞINDA YAZILIR."],["h","En çok kullanılan bağlaçlar"],["dl",[["When","dığında / dığı zaman"],["By the time","dığında / dığı zaman"],["Once","dığında / dığı zaman"],["Because","den dolayı / dığı için"],["Since","dığı için / den dolayı"],["As soon as","olur olmaz"],["While","ken"],["As","ken"],["After","den sonra"],["Before","den önce"],["As long as","dığı sürece"],["Although","e rağmen"]]],["h","When – dığında"],["e","When I wake up, I wash my face.","Uyandığımda yüzümü yıkarım.","“I wake up” uyanırım demektir; başına “when” koyduğumuzda ekin anlamı fiille birleşir ve bir cümle daha ister. “I wash my face” ile köprüyü tamamlarız."],["h","Because – dığı için / den dolayı"],["p","Bu bağlaca “çünkü” dediğinizi duyar gibiyim; fakat “çünkü” ifadesi Türkçede çok yapay bir şekilde karşımıza çıkar. “Mutluyum çünkü seni gördüm.” ile “Seni gördüğüm için mutluyum.” cümlelerinden ikincisi kulağa daha yatkın gelir. İkisini de aynı şekilde çeviriyoruz: <b>I am happy because I saw you.</b>"],["r","Ekleri size vereceğim anlamıyla öğrenirseniz daha rahat cümleler kurabileceksiniz."],["h","Cümleyi sonsuza kadar uzatmak"],["e","Although I wake up from the bed every day, I want to sleep.","Her gün yataktan kalkmama rağmen uyumak istiyorum.","“I wake up from the bed every day” cümlesinin başına “although” koyduk; yarım kalan anlamı ikinci cümleyle tamamladık. “İstiyorum” → I want, “uyumak” → to sleep (iki fiil olduğu için isimleştirdik)."],["e","When I want to sleep, I sleep.","Uyumak istediğim zaman uyurum.","İkinci çağrışan cümlenin başına yeni bir bağlaç koyarak devam ediyoruz."],["e","As soon as I sleep, I start to see a dream.","Uyur uyumaz rüya görmeye başlarım.","“I start” → başlarım, “to see” → görmeye (isimleştirdik), “a dream” → rüya."],["p","Bu şekilde ikinci çağrışan cümlenizin başına bir bağlaç ekleyerek sonsuza kadar cümle yapabilir ve bağlaç mantığını da bu şekilde çalışabilirsiniz."]]},{"id":"cagrisim","s":"s2","title":"Çağrışım Cümlesi Kurmak","tag":"Yöntem","sum":"Çeviri yapmadan uzun cümle: what, where, who, how, why, when.","blocks":[["p","Şimdi gelelim en önemli mantıklardan biri olan: kafada çeviri yapmadan nasıl uzun cümle kurabiliriz? Normal şartlarda bir dili öğrenirken sadece o dili düşünerek konuşmamız gerekir. Bu konu, öğrendiğimiz ekleri kafamızda <b>çağrıştırarak</b> İngilizceye dökebilme mantığıdır."],["p","Öncelikle bir özne ve bir fiil gerekir: I go, I drink, They run. Bu cümleyi uzatabilmek için bu fiile bazı sorular sormamız gerekir. Soracağımız sorular, daha önce öğrendiğimiz ekleri çağrıştıracak şekilde olmalıdır."],["h","What → eksik isim"],["e","What do you drive? → I drive a car.","Ne sürüyorsun? → Araba sürüyorum.","Çıkan cevapta eksik bir isim bize çıktı. Bu yüzden “what” sorusu her zaman eksik bir isim çıkarır."],["h","Where → in / on / at"],["e","Where do you drive? → I drive on the way.","Nerede sürüyorsun? → Yolda sürüyorum.","Ortak nokta “de-da” takısı çağrışıyor. Neden “on”? Çünkü yolun üstünde olacağımız için “de-da” anlamını “on” ile veriyoruz."],["h","Who → with"],["e","Who do you drive? → I drive with my friend.","Kimle sürersin? → Arkadaşımla sürerim.","With my mom, with my friend, with my girlfriend… Ortak kelime “ile” → with. Yani “who” sorusu her zaman “with” ekini çağrıştırır."],["h","How → by / -ly"],["e","I drive by listening to music.","Müzik dinleyerek sürerim.","“arak-erek” → by; “bir şekilde / ca-ce” → -ly."],["p","<b>Zarf konusu:</b> “Bir şekilde” anlamı veren -ly takısı, sıfatları zarfa dönüştürür. Sıfatlar gözle görülmeyen veya ölçülemeyen şeyleri betimler; zarflar ise fiili betimler, artık bir ismi değil fiili tanımlar. Fast car – hızlı araba (sıfat); I drive fastly – arabayı hızlı bir şekilde sürerim (zarf)."],["h","Why → to / because / so that"],["dl",[["To – mak için","İsimleştirme eki. I drive to go to job."],["Because – dığı için","Bağlaçtır, kendisinden sonra bir cümle gerekir. I drive because I want."],["So that – e bilsin diye","Bağlaçtır; can/may/might gibi modal fiiller ile kullanılır. I drive so that I can go to job."]]],["h","When → zaman / bağlaç"],["e","I drive when I leave from the home.","Evden çıktığımda sürerim.","Bağlaç mantığını hatırlarsak when = dığında / dığı zaman, bu nedenle cevabımız bir cümle olabilir."],["h","Hepsini tek cümlede birleştirmek"],["e","I drive a car on the way with my friend to go to job by listening to music when I leave from the home.","Evden ayrıldığımda müzik dinleyerek işe gitmek için arkadaşımla yolda araba sürerim.","Sadece ekleri çağrıştırarak tek bir cümleye birleştirdik ve B1-B2 seviyesinde bir cümle kurmuş olduk."],["e","I drink water in the kitchen with my brother by standing up to relax when I get thirsty.","Susadığımda rahatlamak için ayakta durarak kardeşimle mutfakta su içerim.","Soru sırası: what → where → who → how → why → when."],["r","Çalışma fiilleri: I buy · They drink · He reads · She watches · We sleep · I run · She chats"]]},{"id":"relative","s":"s2","title":"Relative Clause","tag":"İleri","sum":"who / which / that: isimleri detaylandırmak.","blocks":[["p","Gelelim İngilizcenin en önemli konularından biri olan relative clause kullanmaya. İngilizcede relative clause kullanmak zorunludur. Anlamamız gereken en temel mantık, bu konuda sadece <b>isimlerin detaylandırılmasıdır</b>."],["h","Temel 3 ek"],["dl",[["who","betimlediğimiz isim bir insan olmalıdır — Ahmet who… / my friend who…"],["which","öncesinde bir hayvan veya cansız bir şey olmalıdır — the cat which… / the pencil which…"],["that","öncesinde belirli bir şeye gerek yoktur; insan, hayvan veya cansız fark etmez"]]],["h","Sonrasında ne gelir?"],["p","“who / which / that” kullanıldıktan sonra iki anlam ortaya çıkar ve bu anlamlar kendilerinden sonra gelen fiillere veya cümleye göre değişir."],["r","1) <b>Fiil</b> ile kullanılırsa → <b>-an / -en</b> anlamı verir.<br>2) <b>Cümle</b> ile kullanılırsa → <b>-dığı / -diği</b> anlamı verir."],["e","the cat which runs","koşan kedi","which → -an/-en anlamı veriyor, run → koşmak."],["e","the cat which is white","beyaz olan kedi","Eğer “am / is / are” kullanırsak “olmak” anlamına dönüşür: which is → olan."],["e","the cat which I saw","gördüğüm kedi","Cümle ile kullanıldığı için -dığı / -diği anlamı verir."],["e","Ahmet who I like","sevdiğim Ahmet",""],["e","the pencil that I bought","satın aldığım kalem",""],["h","Opsiyonel ek: where"],["p","“where” sadece “-dığı/-diği” anlamı için kullanılır ve öncesinde tanımlanan isim <b>yer</b> olmalıdır."],["e","the restaurant where we went","gittiğimiz restoran","Neden ekstra anlattım? Çünkü “that” kullanımı zaten isim fark etmeksizin geçerlidir; bu yüzden “where” yerine “that” de kullanılabilir. Hatta “who” veya “which” yerine de sadece “that” kullanılabilir."]]},{"id":"oznesiz","s":"s2","title":"Öznesiz Cümle Kurma","tag":"İleri","sum":"It is … to … ve “-ing” ile başlayan özne.","blocks":[["p","Öznesiz cümlelerden kastımız, “I, you, we, they, he, she” özneleri olmadan cümlelere nasıl başlarız. Önce “it” konusuna değinelim, daha sonra fiil ile başlayan cümlelerimize bakacağız."],["p","Bana İngilizcede “iyi” ne demek desem, çoğu kişi “good” cevabını verir. Fakat her cümleyi “özne – fiil – isim/sıfat” yapısına göre kurmamız gerekir. O zaman ben “good” derken bile bir cümle kurmam gerekiyor."],["r","“İyi” dediğimizde bize “I, you, we, they, he, she” özneleri çağrışmıyorsa, bu özne belirsiz olan <b>“it”</b> olur. Yani cümlenin sonu belirsizlikle bitiyorsa, bunlar her zaman “it” cümleleridir."],["p","“İyi” yüklemi bir eylem midir? Hayır, bir sıfat. Yani sıfatla veya isimle biten yapılarda, fiilimiz her zaman <b>to be (am / is / are)</b> yapısı olur."],["dl",[["İyi","It is good"],["Kötü","It is bad"],["Sağlıklı","It is healthy"]]],["p","İngilizce her zaman en az üç kelime ile konuşulur; öznesiz ve fiilsiz hiçbir yapı yoktur. Türkçede kapı çalınca “Kim o?” deriz, cevap “Ben” olur. İngilizcede: <b>Who is it? → It is me.</b>"],["h","It – fiil – to – fiil yapısı"],["e","It is healthy to do sport.","Spor yapmak sağlıklıdır.","Yükleme baktığımızda (“sağlıklıdır”) öznesi belli değil → it is healthy. Sola doğru ilerlediğimizde “spor yapmak” fiilini isimleştirmeliyiz → to do."],["e","It is fun to study in the library.","Kütüphanede ders çalışmak eğlenceli.","Gene özne bulamıyoruz → it is fun. Sola: “ders çalışmak” → to study, “kütüphanede” → in the library."],["h","Fiille başlatmak: “-ing”"],["p","Eğer bir cümlede özne olmayıp it ile de başlamak istemiyorsak, cümledeki yalın (mak/mek) fiilimizi cümlenin başına koyup “-ing” ile isimleştirerek başlatabiliriz."],["e","Studying in the library is fun.","Kütüphanede ders çalışmak eğlenceli.","“Çalışmak” fiilini özne konumuna aldık ve “-ing” ile isimleştirdik; sola doğru çevirdik; artık sola gidecek yer kalmayınca yükleme geçtik: is fun."],["h","Öznel hale getirmek: for + ekler"],["p","“Ders çalışmak” gibi genel kısımlara “ders çalışman – ders çalışmam – ders çalışmamız” eklerini koyduğumuzda bir kişiye gönderme yapıyoruz. Bunları koymadan önce <b>“for”</b> ekini kullanmamız gerekiyor."],["dl",[["You → n","ders çalışman → for you to study"],["Me → m","ders çalışmam → for me to study"],["Them → ları","ders çalışmaları → for them to study"],["Us → mız","ders çalışmamız → for us to study"],["Him → sı","ders çalışması → for him to study"],["Her → sı","ders çalışması → for her to study"]]],["e","It is very important for you to do sport.","Spor yapman çok önemli.",""],["e","It is hard for us to meet with others.","Başkalarıyla buluşmamız zor.",""],["e","It is easy for them to buy this cloth.","Bu kıyafeti satın almaları kolay.",""],["e","It is important for him to speak with you.","Seninle konuşması önemli.",""]]},{"id":"noun-clause","s":"s2","title":"Noun Clause","tag":"İleri","sum":"“that” ve wh5 ile cümleyi isimleştirmek.","blocks":[["p","Bu konunun temel amacı şudur: bildiğimiz soru eklerini (what, where, which, who, why, how much) sadece sorularda kullanmadığımızı öğreneceksiniz. Noun clause dediğimizde aklımıza gelen ilk şeyin <b>“that”</b> kullanımı olması önemlidir. “That” İngilizcenin bel kemiğidir."],["r","Noun clause’un temel amacı, gramer olarak bir <b>cümleyi isimleştirme</b> görevi görmesidir. “to/ing” sadece fiilleri isimleştirirken, “that” bir cümleyi isimleştirir ve çok uzun cümleler kurmamızı sağlar."],["h","“That”ın iki anlamı"],["dl",[["“ma-me” anlamı","Sadece “that” kullanımından önce bir <b>sıfat</b> varsa gelir."],["“dığı-diği” anlamı","“That” öncesine bir <b>fiil</b> geldiğinde oluşur."]]],["e","It is nice that you are here.","Burada olman güzel.","Nice (sıfat) ve that yan yana kullanıldığında, that’ten sonra gelen cümlenin ana fiiline “ma-me” anlamı katılır. “are + that” → “olman” olarak çevrilir."],["e","I know that you are here.","Burada olduğunu biliyorum.","Çünkü that’ın öncesine fiil gelmiş (know)."],["h","“ma-me” kısmını “that” dışında çevirmek"],["p","Eğer özne varsa, bunu sadece isimleştirme yaparak da çevirebiliriz. Bunun için “for” edatının gramer mantığını kullanırız. “For”, kendisinden sonra gelen özneleri isimleştirir: For I → me, For you → you, For we → us, For they → them, For he → him, For she → her."],["e","It is hard for me to come.","Gelmem zor.","“Zor” → it is hard; “Gelmem” → “m” (for me) + “to” + “gel” (come)."],["e","It is impossible for them to study.","Ders çalışmaları imkansız.","“İmkansız” → it is impossible; “Çalışmaları” → “ları” (for them) + “ma” + “çalış” (study)."],["h","Wh5 soruları — “dığı” ekiyle"],["p","Burada “what, where” vb. soru kalıplarının anlamları bildiğiniz gibi kalacak. Tek fark, bunları “dığı” ekiyle birleştirecek olmamızdır. En önemlisi, bu wh5 sorularından sonra her zaman cümle gelmek zorundadır (özne + fiil şeklinde)."],["dl",[["What","ne-dığı"],["Who","kim-dığı"],["Where","nerde-dığı"],["Why","niçin-dığı"],["How much","ne kadar çok-dığı"],["What kind of","ne tür-düğü"]]],["e","I know what you want.","Ne istediğini biliyorum.","Sondan: “Biliyorum” → I know, “Ne istediğini” → what you want."],["e","I know where you live.","Nerede yaşadığını biliyorum.",""],["e","You know how much I love you.","Seni ne kadar çok sevdiğimi biliyorsun.",""],["e","I know who you met with.","Kiminle buluştuğunu biliyorum.","“with” burada sonda kalır; kimle buluştuğu belli olmadığı için with/to/in gibi ekleri sona koymamız gerekir."]]},{"id":"quantifiers","s":"s2","title":"Quantifiars","tag":"Miktar","sum":"much, many, some, any, a lot of ve there is / there are.","blocks":[["p","İsimlerin miktarını belli etmek için kullanacağımız yapılara bakacağız: “Çok, az, biraz, hiç, herhangi” gibi anlamları vereceğiz. Önce sayılamayan ve sayılabilen isimlere bakmamız gerekiyor."],["h","1. Sayılamayan isimler"],["p","<b>Much (çok)</b>, <b>a little (az)</b> → sayılamayan isimlerle kullanılır."],["l",["%80 mantığı: Kendinden sonra -s takısı alamayan isimlerdir (money → moneys ✗).","Sıvılar: water, coke, sea, juice gibi sıvı olan şeyler sayılamaz.","Kalıp hâlindeki şeyler: cheese, bread, money gibi bütün hâlde olan şeyler sayılmaz. Fakat a piece of / a slice of ile parçalarsak sayılabilir hale gelir; paranın parçalanmış hâli coins → bozuk para → sayılabilir olur.","Mantıken sayamayacağımız şeyler: rice, hair gibi isimler teknik olarak sayılabilir ama mantık olarak sayılamaz kabul edilir."]],["dl",[["much money","çok para"],["little water","az su"]]],["h","2. Sayılabilir isimler"],["p","<b>Many (çok)</b> – <b>a few (az)</b> → sayılabilir isimlerle kullanılır. Sonu -s takısı alabilen her şey sayılabilir olarak kodlanabilir."],["dl",[["many students","çok öğrenci"],["a few people","az insan"]]],["h","3. Her ikisinde de kullanılanlar"],["dl",[["Some (biraz)","Genelde olumlu cümlelerde: some coke"],["Any (hiç / herhangi)","Genelde sorularda: Do you have any money? / Did you see any cats here?"],["A lot of (çok)","much / many olarak düşünebilirsiniz; her yerde kullanılabilir"],["A bit of (az)","a few / a little gibi düşünülebilir: a bit of water, a bit of children"]]],["h","There is / There are"],["p","Bu konuyla en çok kullanılan yapı budur ve aşırı önemlidir. Önce bilmemiz gereken kelimeler: <b>someone</b> (birisi), <b>anyone</b> (herhangi biri), <b>no one</b> (hiç kimse), <b>everyone</b> (herkes). Bu kelimeler her zaman <b>tekil</b> olarak kullanılır."],["f",["There is","s-a-n-e","to","fiil"]],["e","There is someone to help me.","Bana yardım edecek birisi var.","Sondan çevirirsek: there is → var, someone → birisi, to help → yardım edecek, me → bana."],["e","There is no one to make me happy.","Beni mutlu edecek kimse yok.",""],["e","Is there anyone to give me a pencil?","Bana kalem verecek birisi var mı?","Soru formu."]]},{"id":"superlative","s":"s2","title":"Superlative","tag":"Sıfat","sum":"“en” anlamı: the most + sıfat veya the …-est.","blocks":[["p","Bu konuyu işlemeden önce bilmeniz gereken temel mantık şudur: sıfatların değişimlerine odaklanmalısınız. Yani bad, good, beautiful, fast, slow gibi sıfatlar bu konuyla birlikte değişim gösterecek."],["r","<b>6 harf kuralı:</b> Sıfat 6 harften <b>uzunsa</b> başına <b>the most</b>; 6 harften <b>kısaysa</b> sonuna <b>-est</b> gelir."],["dl",[["beautiful (9 harf)","the most beautiful → en güzel"],["fast (4 harf)","the fastest → en hızlı"]]],["p","Burada harf sayısını tam saymanıza gerek yok; sıfat uzun görünüyor veya telaffuzu uzunsa the most alacağını düşünebilirsiniz."],["h","Değişmeyen sıfatlar (ezberlenmeli)"],["dl",[["bad","the worst"],["good","the best"],["little","the least"],["far","the furthest"]]],["h","En yaygın kullanım kalıbı"],["f",["the best way","to + fiil","is","to + fiil"]],["p","Anlam: “Bir şey yapmanın en iyi yolu şudur.” Buradaki to “-mak/-mek” anlamı verir ve fiili isimleştirir."],["e","The best way to learn English is to study a lot.","İngilizce öğrenmenin en iyi yolu çok çalışmaktır.",""],["e","The best way to be happy is to dance.","Mutlu olmanın en iyi yolu dans etmektir.",""]]},{"id":"comparative","s":"s2","title":"Comparative","tag":"Sıfat","sum":"“daha” anlamı: more + sıfat veya sıfat + -er.","blocks":[["p","Bu konuda superlative ile gramer yapısı birebir aynıdır; tek fark kelimelerde olacak. Comparative (karşılaştırma), iki şeyi karşılaştıracağımız zaman kullanılır ve Türkçesi <b>“daha”</b> demektir."],["r","<b>6 harf kuralı:</b> Sıfat 6 harften uzunsa başına <b>more</b>; kısaysa sonuna <b>-er</b> gelir."],["dl",[["beautiful (9 harf)","more beautiful → daha güzel"],["fast (4 harf)","faster → daha hızlı"]]],["h","Değişen sıfatlar (irregular)"],["dl",[["good","better"],["bad","worse"],["little","less"],["far","further"]]],["h","Kullanım mantığı"],["p","Bu yapı genellikle iki şey karşılaştırılırken kullanılır, ancak soyut kavramlarla da karşılaştırma yapabiliriz. Her zaman “Ayşe, Fatma’dan daha zeki” gibi somut karşılaştırmalar yapmak zorunda değiliz."],["e","You are more beautiful than I think.","Düşündüğümden daha güzelsin.",""],["e","You ran faster than I expected.","Umduğumdan daha hızlı koştun.",""],["r","En çok kullanılan kalıplar: <b>than I think</b>, <b>than I hope</b>, <b>than I expected</b>."]]},{"id":"kelime","s":"s2","title":"Kelime Ezberleme Mantığı","tag":"Yöntem","sum":"“Yancı” kelimeler ve sahne kurarak öğrenme.","blocks":[["p","Öncelikle yapmamanız gereken şeyi açıklayayım: bir kelimeyi okurken hemen anlamına bakıp bir deftere yazmak, arkasına Türkçesini yazmak ve sadece bakarak öğrenmeye çalışmak <b>kısa süreli hafıza</b> için işe yarar. Sınava girecekseniz bu yöntem 1-2 hafta için geçici fayda sağlar. Ama gerçekten öğrenmek istiyorsanız, ezberlemek yerine kelimenin <b>“yancıları”</b> üzerine çalışmalısınız."],["h","Nasıl yapılır?"],["l",["Kelimeyi düşündüğünüzde aklınıza gelen yakın anlamlı veya ilgili kelimeleri yazın.","Bu kelimelerin Türkçelerini düşünün ve bilmediklerinizi sözlükten bulup yazın.","Kafanızda bir sahne oluşturun ve yancılarınızı bu sahneye yerleştirin.","Bu yancıları kullanarak, daha önce öğrendiğimiz çağrışım mantığıyla cümleler oluşturun."]],["h","Örnek: war – savaş"],["dl",[["battlefield","savaş alanı"],["soldier","asker"],["enemy","düşman"],["kill","öldürmek"],["blood","kan"],["supply","malzeme"],["gun","silah"],["sword","kılıç"],["armor","zırh"],["commander","komutan"],["pit","hendek"]]],["h","Çağrışımla cümle kurma"],["e","Soldier kills the enemy.","Asker düşmanı öldürür.","What does the soldier kill?"],["e","Soldier kills in the battlefield.","Asker savaş alanında öldürür.","Where does the soldier kill?"],["e","Soldier kills by screaming. / Soldier kills with a gun.","Asker bağırarak öldürür. / Asker silahla öldürür.","How does the soldier kill?"],["e","Soldier kills to win the war.","Asker savaşı kazanmak için öldürür.","Why does the soldier kill? — “so that he can win the war” de denebilir."],["e","Soldier kills when the war begins.","Asker savaş başladığında öldürür.","When does the soldier kill?"],["e","Soldier kills the enemy in the battlefield with a gun by screaming to win the war when the war begins.","Asker savaş başladığında savaşı kazanmak için bağırarak, silahla savaş alanında düşmanı öldürür.","Hem “war” kelimesini öğreniyoruz, hem de anlamını bilmediğimiz diğer yancı kelimeleri de öğrenmiş oluyoruz."],["r","Eğer öğrenmek istediğiniz kelimeyle ilgili cümleler kurmazsanız, o kelimeyi sadece <b>ezberlemiş</b> olursunuz."]]},{"id":"tenses-giris","s":"s3","title":"Tensler “Zamanlar” — Giriş","tag":"Zaman","sum":"Tenslerin tek kuralı: yardımcı fiiller.","blocks":[["p","Bu kısma kadar sizlere “cümle kurma, nasıl çeviri yapılır, İngilizce düşünme, öznesiz cümleler, kelime ezberleme mantığı nasıl olmalı?” gibi konularda mantık vermeye çalıştım; konu anlatımı yapmadım. Kitabın geri kalanında asıl konu anlatımına başlayacağız."],["r","Unutmamamız gereken en önemli şey, bu ilk kısımda anlattığım mantıkları <b>her zaman kullanarak</b> cümleler kurmamız ve öğrendiğimiz her konuyu bu mantıkların üstüne eklememizdir."],["p","Tenses mantığının tek bir kuralı vardır: Eğer bu kuralı iyi anlarsanız, 12 tane tense’i öğrenmek çok kolay olur."],["r","Her tense’in kendine ait <b>yardımcı fiilleri</b> vardır ve bunların tek amacı, <b>ana fiilin içine girerek</b> ona hangi zaman anlamını vereceksek onu katmaktır."]]},{"id":"present-simple","s":"s3","title":"Geniş Zaman (Present Simple)","tag":"Zaman","sum":"DO ve DOES yardımcı fiilleri.","blocks":[["p","Adından da anlaşılacağı gibi basit bir zaman. Genel rutinlerimiz için ve bilimsel gerçeklerde kullanılır. Bilmeniz gereken tek şey: Action fiillerin çekimleri."],["r","İhtiyacımız olan yardımcı fiiller: <b>DO</b> ve <b>DOES</b>. Anlamları yoktur, sadece ana fiilin içine girip <b>“ar-er”</b> anlamını katar. DO → çoğul özneler (I, YOU, WE, THEY); DOES → tekil özneler (HE, SHE, IT)."],["h","Olumlu"],["e","I wake up from the bed every day.","Her gün yataktan kalkarım.","DO yardımcı fiilini “wake up” fiilinin içine koyduğumuzda, içinde gizlenmiş olur: I do wake up from the bed every day."],["h","Olumsuz"],["e","I don’t wake up from the bed every day.","Her gün yataktan kalkmam.","Olumsuzluk eki “not” yardımcı fiile eklenir. Fiilin kendisi hiçbir zaman olumsuz yapılmaz; tüm tenslerde olumsuzluk sadece yardımcı fiiller ile yapılır."],["h","Soru"],["e","Do I wake up from the bed every day?","Her gün yataktan kalkar mıyım?","DO yardımcı fiilini ana fiilden çıkarıp, öznenin başına koyarız."],["h","Tekil özneler (He, She, It)"],["e","He wakes up from the bed every day.","O her gün yataktan kalkar.","DOES yardımcı fiilini “wake up” fiiline soktuğumuzda, DOES içindeki “es” takısı fiile eklenir."],["e","He doesn’t wake up from the bed every day.","O her gün yataktan kalkmaz.","does wake up → doesn’t wake up."],["e","Does he wake up from the bed every day?","O her gün yataktan kalkar mı?","“Does he wakes up” demiyoruz; DOES artık dışarıda ve fiili etkileyecek bir ek yok, fiil yalın hâlde olmalıdır."],["r","Bu mantık tüm tense’lerde aynıdır: fiilin içine yardımcı fiil girer ve ona bazı ekler ekler; olumsuz ve soru cümlelerinde yardımcı fiil <b>dışarı çıkar</b>, fiil her zaman <b>yalın</b> olur."],["h","Zaman zarfları"],["dl",[["Every","her (day, year, week, month)"],["Sometimes","bazen"],["Never","asla, hiç"],["Always","her zaman, daima"],["Often","sık sık"],["Usually","genellikle"],["Rarely","nadiren"]]],["p","Zaman zarfları, ana fiilin ne sıklıkla gerçekleştiğini gösterdiği için genellikle <b>özne ve fiil arasına</b> yerleştirilir."],["e","I sometimes play football to enjoy with my friends.","Arkadaşlarımla eğlenmek için bazen futbol oynarım.",""],["e","She usually drinks hot milk so that she can feel relaxed.","Rahat hissedebilmek için genellikle sıcak süt içer.",""]]},{"id":"present-cont","s":"s3","title":"Present Continious Tense","tag":"Zaman","sum":"TO BE + fiil-ing.","blocks":[["p","Bu tense’i kullanırken tekrar <b>“-ing”</b> ekini hatırlayacağız. Her tense gibi, bu tense’in de yardımcı fiilleri vardır ve bunlar <b>TO BE (am, is, are)</b> olacaktır. Bu yardımcı fiiller, ana fiilimizin içine girerek bir değişim yapmaz; fakat ana fiilimizi isimleştirmemiz gerekir."],["h","Olumlu"],["e","I am playing football.","Futbol oynuyorum.","O an oynuyor olduğumu belirtmek için to be yardımcı fiilini kullanmam gerekir. Ama “I am play” diyemeyiz; iki fiil yan yana gelemez. Bu nedenle “-ing” ile playing yaparız; cümlede tek fiil kalır, o da am’dır."],["e","I playing football.","(Yanlış)","Fiil yapısı eksik, büyük gramer hatasıdır."],["e","I am drinking. / She is eating.","Şu an içiyorum. / Şu an yiyor.",""],["h","Olumsuz"],["e","I am not playing football.","Şu anda futbol oynamıyorum.","Her yardımcı fiile not eklediğimizde cümle olumsuz olur."],["h","Soru"],["e","Am I playing football?","Şu anda futbol oynuyor muyum?","Yardımcı fiilleri her zaman dışarı çıkarıp öznemizin başına koyuyoruz."],["h","Zaman zarfları"],["dl",[["Now","şimdi"],["Right now","tam şimdi"],["At the moment","şu anda"]]],["e","Ayşe is playing volleyball by enjoying to spend time with her friends at the street.","Ayşe sokakta arkadaşlarıyla zaman geçirmek için eğlenerek voleybol oynuyor.","Eklerin karşılığını daha önce öğretmiştim; çeviriyi sondan gelerek yaptığımızda mantığını anlayabilirsiniz."]]},{"id":"future","s":"s3","title":"Future Tense","tag":"Zaman","sum":"will (plansız) ve be going to (planlı).","blocks":[["p","Bu tense’i kullanırken anlamamız gereken mantık, yapacağımız eylemin <b>planlı mı plansız mı</b> olduğudur."],["dl",[["will","plansız, spontan, kanıtı olmayan eylemler için"],["be going to","planlı, kanıtı olan eylemler için"]]],["r","Bu yardımcı fiiller ana fiilin içine girmeyecek, her zaman <b>dışarıda</b> olacaklardır."],["e","I will come to the party.","Partiye geleceğim. (Plansız)","will kullandığımızda ana fiil come’a “acak-ecek” anlamını eklemiş oluyoruz."],["e","I am going to come to the party.","Partiye geleceğim. (Planlı)","Buradaki be, yani am/is/are yardımcı fiil olarak kullanılır."],["h","Olumsuz"],["e","I will not come to the party. / I won’t come to the party.","Partiye gelmeyeceğim.",""],["e","I am not going to come to the party.","Partiye gelmeyeceğim.",""],["h","Soru"],["e","Will I go to the party?","Partiye gidecek miyim? (Plansız)",""],["e","Am I going to go to the party?","Partiye gidecek miyim? (Planlı)",""],["h","Zaman zarfları"],["dl",[["Next","gelecek (next day/year/month/week)"],["Tomorrow","yarın"],["Future","gelecek — in the future → gelecekte"]]],["e","She is going to bring a gift for me to give next month when my birthday comes.","Doğum günüm geldiğinde, gelecek ay vermek için bana hediye getirecek. (PLANLI)",""],["e","She will sleep to rest on the bed while listening to music.","Müzik dinlerken yatakta dinlenmek için uyuyacak. (PLANSIZ)",""]]},{"id":"past","s":"s3","title":"Past Tense (Geçmiş Zaman)","tag":"Zaman","sum":"Did yardımcı fiili, düzenli ve düzensiz fiiller.","blocks":[["p","Bu zamanı, Present Simple Tense mantığıyla çözümlerseniz mantığını çok rahat oturtabilirsiniz. Ancak bazı ezberler yapmanız gerekecek."],["h","1. Ana fiilleri tanımak"],["p","Past Tense’i öğrenmeden önce ana fiillerimizi iki kategoriye ayırmalıyız: <b>Düzensiz (Irregular)</b> ve <b>Düzenli (Regular)</b> fiiller."],["r","Tavsiyem: Sadece <b>düzensiz</b> fiilleri ezberleyin; İngilizcede ortalama 100–150 düzensiz fiil vardır, düzenli fiillerin sayısı ise binlerceyi bulur. Düzenli fiilleri ezberlemeden <b>“-ed”</b> takısı ile çekimleyebilirsiniz."],["h","2. Yardımcı fiil: Did"],["p","Do/Does yardımcı fiillerinin geçmiş zamanı <b>Did</b>’dir. Did, ana fiilin içine girerek onu geçmiş zamanda çeker ve <b>“-dı/-di”</b> anlamını katar."],["e","I went home.","Eve gittim.","Go (düzensiz) → Did go → went."],["e","I listened to music.","Müzik dinledim.","Listen (düzenli) → Did listen → listened."],["h","3. Olumsuz"],["e","I didn’t go to work.","İşe gitmedim.","Did yardımcı fiilini dışarı çıkarır ve “not” ekini bağlarız; ana fiil yalın hâline döner."],["e","I didn’t listen to music.","Müzik dinlemedim.",""],["h","4. Soru"],["e","Did you go to work?","İşe gittin mi?","Did başa gelir, fiil yalın hâlde kalır."],["e","Did you listen to music?","Müzik dinledin mi?",""],["h","5. Zaman zarfları"],["dl",[["Last","geçen (last year / month / week)"],["Yesterday","dün"],["Ago","önce (five minutes ago → 5 dakika önce)"]]],["r","“Ago”yu <b>before</b> ile karıştırmayın; before “den önce” demektir."],["p","Düzensiz fiillerin anlam ve çekimi farklıdır. Her fiil için aynı mantık geçerli olmayabilir, fakat yaklaşık %70 oranında yukarıdaki mantığa göre kullanılır."]]},{"id":"present-perfect","s":"s3","title":"Present Perfect Tense","tag":"EN ÖNEMLİ","sum":"have/has + V3 — “mış”lı geçmiş zaman.","blocks":[["r","Bu tense’i gerçekten iyi anlamanız gerekiyor, çünkü bu tense’in Türkçe birebir karşılığı yok. Bu tense’i öğrendiğinizde, geri kalan 6 tane perfect tense’i de Present Perfect mantığıyla öğrenebilirsiniz."],["h","Temel mantık"],["dl",[["Past Simple","Eylemin ne zaman gerçekleştiğini belirtir."],["Present Perfect","Eylemin geçmişte gerçekleştiğini söyler ama ne kadar önce veya ne kadar zamandır yapıldığını vurgular."]]],["p","Kısaca: Present Perfect, <b>yakın geçmiş</b> veya bir <b>süreci</b> vurgulayan zaman zarflarıyla kullanılır. Eğer zaman zarfınız varsa ve geçmişi vurgulamak istiyorsanız, her zaman Perfect tense’i kullanmalısınız."],["f",["Özne","have/has","V3","…bir süre…"]],["p","Have/Has yardımcı fiili her zaman fiilin <b>V3 (past participle)</b> hâliyle kullanılır. İngilizcede diğer perfect tense’lerde de hep <b>have + V3</b> yapısını kullanacağız."],["h","Section 1 — Çok yakın zaman"],["p","Yapılan eylemin çok ama çok yakın zamanda gerçekleşmiş olmasıdır. Başlamış bir sürecin bitmemiş olması gerekiyor: gün, yıl, ay, hafta gibi zaman periyotlarının bitmemesi gerekir."],["e","I have just finished my homework.","Daha şimdi ödevimi bitirmiştim.","Just – şimdi. “Just” kullandığımız yere dikkat edin, have ve fiil arasına yazılması gerekiyor."],["e","I have already eaten my meat.","Çoktan etimi yemiştim.","Already – çoktan. Yakın zamanı vurguladığı için perfect yapı ile kullanılır."],["e","I have gone to school this morning.","Okula bu sabah gitmiştim.","This – bu. Gün devam ediyor ve bitmediğinden dolayı “bu sabah” gibi zaman bölümlerinde perfect yapı kullanılır."],["e","My brother hasn’t come to home yet.","Abim henüz eve gelmedi.","Yet – henüz. Çoğu zaman negatif bir yapı ile kullanılır."],["h","Section 2 — Ne kadar süre: for / since"],["dl",[["For – den beri / dır-dir","Başlangıcı <b>belirsiz</b> olan zamanlar: for two years, for a long time, for five months"],["Since – den beri / dır-dir","Başlangıcı <b>belirli</b> olan zamanlar: since 2010, since April, since my childhood"]]],["p","Since’den sonra cümle yapısı da kullanabiliriz, yani bir bağlaç olarak da kullanılır: “Since I was child” → Çocuk olduğumdan beri. Burada cümle past tense ile kullanılır."],["e","I have worked here for two years.","Burada iki yıldır çalışmıştım.","Geçmişte başlamış ve hâlâ etkisi devam eden bir eylem; başlangıcı belirsiz olduğu için for."],["e","I haven’t seen you since Saturday.","Seni cumartesiden beri görmemiştim.","Bir zaman periyodundan beri görmediğini söylediğimiz için perfect yapı."],["h","Section 3 — Tecrübe: ever / never"],["dl",[["Ever – Hiç","Sorularda kullanılır, karşı tarafın tecrübesini öğrenmek için."],["Never – Hiç","Olumsuz anlamda, tecrübeyi yaşamamış olduğumuzu belirtmek için."]]],["e","Have you ever eaten chocolate?","Çikolata yedin mi?",""],["e","Have you ever studied English before? — No, I have never studied English.","Daha önce İngilizce çalıştın mı? — Hayır, daha önce hiç İngilizce çalışmadım.",""]]},{"id":"modals","s":"s4","title":"Modals","tag":"Modal","sum":"can, may, might, must, should — duygusal ekler.","blocks":[["r","Modals konusuna bir <b>zaman</b> olarak yaklaşmamak sizi en doğru mantığı anlamaya götürecektir. Modalları zamandan ziyade <b>duygusal</b> olarak düşünerek kullanmamız gerekiyor."],["p","Türkçede kullandığımız “-ebilir / -ma / -me” ekleri farklı anlamlar taşıyabilir. Örneğin “-ebilir” olasılık, rica veya yetenek anlamına göre değişir:"],["e","I can go to Europe.","Avrupaya gidebilirim.","Olasılık anlamında kullanılıyor."],["e","I can play football.","Futbol oynayabilirim.","Yetenek anlamında kullanılıyor."],["e","Can I order?","Sipariş verebilir miyim?","Rica anlamında kullanılıyor."],["p","Aynı şekilde “-malı / -meli” ekleri Türkçede tavsiye, zorunluluk veya tahmin anlamı verebilir: “Hastaneye gitmeli”, “Ahmet hastanede olmalı”, “Buraya gelmelisin”. Türkçe gramer açısından bu anlamlar aynı kullanılırken, İngilizcede hangi anlamla söyleyeceksek ona göre farklı modal kullanmamız gerekir."],["h","“-ebilir”: can / may / might"],["dl",[["Can","%100 yapabilme. I can climb on the mountain → Dağa tırmanabilirim. Tahmin olarak yüksek olasılık: He can be here because the time has come. Rica: Can I order? (samimi olduğumuz kişilere)"],["May","%50 ihtimal ve yapabilite. I may come → Sana gelebilirim. Soru kalıplarında sadece “I” öznesiyle ricalı: May I go out?"],["Might","%25 yapabilite. I might swim today → Bugün yüzebilirim (büyük ihtimal yüzmeyecek)."]]],["h","“-malı / -meli”: must / should"],["dl",[["Must","Kendi zorunluluğumuz: I must do my homework. Tahmin (be ile): Ahmet must be at home → Ahmet evde olmalı. Olumsuz yasak: You mustn’t smoke here."],["Should","Tavsiye: You should go to the doctor because you are sick."]]],["r","Bu modallar zamanlarla kullanılmıyor, yani bir çekimleri yok. Fakat semi-modals zamanlarla çekilir."]]},{"id":"semi-modals","s":"s4","title":"Semi-Modals","tag":"Modal","sum":"be able to, be supposed to, have to — zamanlarla çekilir.","blocks":[["p","Şimdi en çok kullanacağımız modallara gelelim, çünkü bunlar zamanlarla çekimleniyor."],["h","be able to — “-ebilir”"],["p","can-may-might’ın <b>be able to</b> olarak çekimlendiğini göreceksiniz ve “be” olduğundan dolayı bunu istediğimiz zaman çekebiliriz."],["dl",[["was/were able to","ebilirdi"],["will be able to","ebilecek"],["is able to","ebilir"]]],["p","Ancak tek sefer yapabiliteden bahsettiğini bilmeliyim. Tek sefer yapabilite verip diğer tenslerde kullanabiliriz:"],["e","I am able to climb on the mountain.","Dağa tırmanabilirim.",""],["e","I was able to climb on the mountain.","Dağa tırmanabilirdim.",""],["e","I will be able to climb on the mountain.","Dağa tırmanacaktım.",""],["h","to be able to — “ebilmek için”"],["e","I am coming to be able to see you.","Seni görebilmek için geliyorum.","Parçalayalım: “mek için” → to, “ebil” → be able to, “gör” → see."],["e","I hope you to be able to understand me.","Beni anlayabilmeni umuyorum.","“ma-me” → to, “ebil” → be able to, “anla” → understand."],["r","Kısacası “to — mak için” kullanacağınız her yere <b>to be able to — ebilmek için</b> ekini kullanabilirsiniz. Hem uzun hem güzel durur cümlende."],["h","be supposed to — “malı-meli” (should)"],["p","Should’u nerede kullanıyorsan be supposed to da kullanabilirsin. Farkı: should bir zaman alamıyor; fakat be supposed to’nun “be” hali olduğu için will — was — were — is — are gibi çekimler yapabilirsin."],["e","You are supposed to come to home.","Eve gelmelisin.",""],["e","You were supposed to come to home.","Eve gelmeliydin.",""],["e","You will be supposed to come to home.","Eve gelecek olmalısın.",""],["h","have to — “malı-meli” (must)"],["e","You have to come to home.","Eve gelmelisin.",""],["e","You had to come to home.","Eve gelmeliydin.",""],["e","You will have to come to home.","Eve gelmek zorunda olacaksın.",""]]},{"id":"modals-perfect","s":"s4","title":"Modals Perfect","tag":"Modal","sum":"might/must/should + have + V3 — “mış” çekimleri.","blocks":[["p","Burada kullanacağımız ekler “ebilir — can/may/might” ve “malı-meli — must/should” eklerinin <b>“mışlı”</b> çekimleri olacaktır."],["r","“Mış” dediğimiz her şey İngilizcede <b>have/has V3</b> demektir."],["h","“mış olabilir” → might/may have V3"],["e","He might have come to home.","Eve gelmiş olabilir.",""],["e","Ayşe may have slept.","Ayşe uyumuş olabilir.",""],["h","“mış olmalıydı” → should have V3"],["p","Buradaki anlam <b>pişmanlık</b> olarak karşı tarafa duygusal olarak verilir."],["e","Ahmet should have come to home.","Ahmet eve gelmiş olmalıydı.",""],["e","You should have studied.","Ders çalışmış olmalıydın.",""],["h","“mış olmalı” → must have V3"],["p","Bu kullanım geçmişte olmuş bir olayın ihtimalinden bahseder ama <b>yüksek</b> bir ihtimaldir."],["e","Ahmet must have come to home.","Ahmet eve gelmiş olmalı.",""],["e","Ahmet must have studied.","Ahmet ders çalışmış olmalı.",""],["r","Bildiğimiz must’ın <b>zorundalık</b> anlamı perfectle birleştiğinde yok olur ve ihtimal olayları devreye girer."]]},{"id":"future-perfect","s":"s4","title":"Future Perfect","tag":"Zaman","sum":"will have V3 ve by / until / for / since / in.","blocks":[["r","İçinde perfect yazan her tensi <b>“mış”</b> olarak çevireceğiz; bu temel mantığı öğrenmiş olalım."],["p","Burada “acak-ecek” ekini <b>sadece will</b> olarak kullanacağız, çünkü gelecekte bir şey yapılmış olacağı için planlı değildir. Ama her perfect tenste olduğu gibi zaman zarfları olması gerekiyor: <b>by - until - for - since - in</b> gibi zaman zarflarını kullanacağız, çünkü kısıtlı bir zaman içinde gelecekte bir şey yapılmış olacak anlamı vereceğiz."],["h","by / until"],["p","“by-until” ikisi de “e kadar” anlamına gelen zaman zarfıdır: “by tomorrow — yarına kadar”. By’dan sonra sadece zaman koymanız gerekiyor; “until tomorrow” da diyebilirsiniz. Kısacası until ile by aynı anlamda ve aynı kullanıma sahiptir, kendisinden sonra bir zaman alabilir."],["r","Until’in bir diğer kullanımı kendisinden sonra <b>cümle</b> gelebilmesidir, yani bağlaç görevi görebilir: “until you come” — sen gelene kadar."],["p","“for-since” anlatıldığı gibi “dır-dir veya lığına-liğine” anlamlarıyla gelecek."]]},{"id":"if-clause","s":"s4","title":"If Clause","tag":"Koşul","sum":"Type 1, 2, 3 — “eğer-sa-se” koşul cümleleri.","blocks":[["p","If clause konusu Türkçemizdeki koşul konusuyla aynıdır ve Türkçe çevirisi <b>“eğer-sa-se”</b> olarak çevireceğiz; karşılığı sadece <b>“if”</b>tir. If clause’da 3 tane type vardır ve bunlar 1’den 3’e gidene kadar bir geçmiş zaman olarak ilerler: type 1 → v1, type 2 → v2, type 3 → v3 olarak kodlarsanız hangi zamanda kullanıldıklarını unutmazsınız."],["r","HİÇBİR BAĞLAÇ <b>modals-will</b> ekleriyle aynı anda kullanılmaz. Örneğin “when-while-because-although ve if” bunların içinde sadece v1-v2 veya v3 olmak zorundadır. Bunların dışında 2. cümleyi kurarken modals-will gibi ekleri kullanabiliriz."],["h","Type 1 — Gelecekte veya ihtimal"],["f",["if + özne + v1",",","özne + will/can/may/might + fiil"]],["e","If I go to the library, I can study.","Eğer kütüphaneye gidersem, ders çalışabilirim.","“if I go” — gidersem (“sa-se” if), “to the library” — kütüphaneye, “I can study” — ders çalışabilirim (“ebilirim”)."],["h","Type 2 — Olmamış olaylar"],["f",["if + özne + v2",",","özne + would/could + fiil"]],["e","If I studied lesson, I would pass the exam.","Eğer ders çalışsaydım, sınavı geçebilirdim.","Type 1’de v1 olan fiili type 2’de v2 olarak çekimlendiriyoruz; can-will modallarının 2. halleri would/could olur."],["p","Type 2’nin bir kullanımı da “birinin yerinde olsaydın” gibi soru sorma yapılarıdır: <b>if I were you</b> — senin yerinde olsaydım; <b>if you were me</b> — benim yerimde olsaydın."],["h","Type 3 — Hiç gerçekleşmemiş olaylar"],["f",["if + özne + had v3",",","özne + would/could have v3"]],["e","If I had seen Hadise at the street, I would have taken photo with her.","Eğer dışarıda Hadise’yi görmüş olsaydım, onunla fotoğraf çektirmiş olabilirdim.","Type 3’ün en önemli Türkçesi “mış”lı çeviridir. Type 2’de v2 koyuyorduk; v2’nin en geçmişi past perfect olur, yani had v3."],["h","Olumsuz yapılar"],["e","If I don’t study, I won’t pass the exam.","Ders çalışmazsam, sınavı geçemem.",""],["e","If I didn’t study, I wouldn’t pass the exam.","Ders çalışmasaydım, sınavı geçemezdim.",""],["e","If I hadn’t studied, I wouldn’t have passed the exam.","Ders çalışmış olmasaydım, sınavı geçmiş olamazdım.",""],["h","Unless = if not"],["p","“unless — if not” demektir ve kendisinden sonra <b>olumlu</b> bir cümle ister. Bunun sebebi kendisi zaten olumsuz olduğu içindir. İngilizcede iki tane olumsuzluk yan yana olamaz."],["e","Unless I study, I won’t pass the exam.","Ders çalışmazsam, sınavı geçemem.",""],["e","Unless I had studied, I wouldn’t have passed the exam.","Ders çalışmış olmasaydım, sınavı geçmiş olamazdım.",""],["h","Soru yapıları — “What if”"],["p","Anlamı “ya olsaydı” şeklindedir ve genelde olmamış olaylar üzerinden soru sorarken kullanılır."],["e","What if you were a superhero?","Ya süper kahraman olsaydın?",""],["e","What if you had a lot of money?","Ya çok paran olsaydı?",""],["e","What if you were a superhero, what would you do?","Ya süper kahraman olsaydın, ne yapardın?","Tamamlayıcıları soru şeklinde yazmak zorundayız."]]},{"id":"passive","s":"s5","title":"Passive — Tenslerle","tag":"Passive","sum":"“-ıl / -il” eki = be + V3, bütün zamanlarda.","blocks":[["p","Bu konu İngilizcenin en önemli konularından birisidir ve şu anki seviyenizi birden üst seviyeye çıkaracak bir öneme sahiptir."],["p","Ben size “çok pasifsin, hiçbir şey yapmıyorsun, sadece yatıyor ve televizyon izliyorsun” desem ne anlardınız? Muhtemelen: hiç aktif değilim, eylemim yok ve hareketsiz duruyorum. Biz her zaman aktif özneler kullanıyorduk; fakat passive (edilgen) konuda öznelerimiz <b>cansız nesneler</b> olmalıdır, çünkü onlar hareket edemez, bir eylem yapamazlar."],["dl",[["Pencil is red",""],["Pencil is expensive",""],["Pencil is on the table",""]]],["p","Ortak noktaları nedir? “Is” yani “to be” ekidir. Çünkü “pencil” bir eşya ve bu eşyanın bir eylem yapamayacağını biliyoruz. “Go, buy” gibi eylemler kalem tarafından yapılamaz."],["r","Temel mantık: Passive cümlelerde <b>“be”</b> fiilini kullanmamız gerekiyor. Yanlış: “pencil is buy”. Doğru: <b>“the pencil is bought”</b> — kalem satın alınır."],["r","Passive yapının Türkçesi %80 oranında her zaman <b>“-ıl / -il”</b> ekiyle çevrilir. “-ıl/-il” eki gördüğümüz yerde <b>be + V3</b> kuralını uygulamak zorundayız."],["p","Bu passive konusu iki şekilde karşımıza çıkacak: 1) Ana fiil (yüklem) kısmındaki tüm tense çekimlerine göre değişimi, 2) Ana fiil dışında gelen, edatlarla bağlanmış eklerle olan birleşimi."],["h","Tense tablosu — “Cam …”"],["tbl",["Türkçe","Yapı","İngilizce"],[["Cam kırılır","am/is/are + V3","The window is broken"],["Cam kırıldı","was/were + V3","The window was broken"],["Cam kırılacak","will be + V3 / be going to be + V3","The window will be broken"],["Cam kırılacaktı","was/were going to be + V3","The window was going to be broken"],["Cam kırılmıştı","have/has been + V3","The window has been broken"],["Cam kırılabilir","can/may/might be + V3","The window can be broken"],["Cam kırılmalı","must/should be + V3","The window must be broken"],["Cam kırılıyor","am/is/are being + V3","The window is being broken"],["Cam kırılıyordu","was/were being + V3","The window was being broken"],["Cam kırılmış olabilir","can/may/might have been + V3","The window might have been broken"],["Cam kırılmış olmalı","must/should have been + V3","The window must have been broken"],["Cam kırılmış olacak","will hav
