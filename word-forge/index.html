<title>Word Forge 750</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Epilogue:wght@600;700;800&family=Source+Sans+3:wght@400;500;600;700&family=Roboto+Mono:wght@500;700&display=swap">
<style>
/* Layout: tek sütun kelime atölyesi - üstte gün çubuğu, ortada kart sahnesi, altta sekme rayı */
:root{
  --bg:#F3F2F6; --surface:#FFFFFF; --surface2:#E8E5EE; --raise:#FAF9FC;
  --ink:#1A1420; --ink2:#59506B; --ink3:#7E7590;
  --line:#DBD6E2; --line2:#C5BDD0;
  --accent:#7A2E5D; --accent-ink:#FFFFFF; --accent-soft:#F6E6F0;
  --amber:#9A6210; --amber-soft:#F9EEDB;
  --forest:#26674B; --forest-soft:#DDEDE4;
  --rose:#A52742; --rose-soft:#FAE3E7;
  --f-disp:"Epilogue",system-ui,sans-serif;
  --f-body:"Source Sans 3",system-ui,-apple-system,Segoe UI,sans-serif;
  --f-mono:"Roboto Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:14px; --gut:max(16px,env(safe-area-inset-left,0px)); --gutr:max(16px,env(safe-area-inset-right,0px));
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#120F16; --surface:#1B1722; --surface2:#262033; --raise:#211C2B;
  --ink:#EEEAF2; --ink2:#AFA5BE; --ink3:#8C8299;
  --line:#2D2639; --line2:#3D3450;
  --accent:#E888B8; --accent-ink:#22030F; --accent-soft:#361A2A;
  --amber:#E7B45E; --amber-soft:#36280F;
  --forest:#5FC098; --forest-soft:#13301F;
  --rose:#F0808F; --rose-soft:#3A1419;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#120F16; --surface:#1B1722; --surface2:#262033; --raise:#211C2B;
  --ink:#EEEAF2; --ink2:#AFA5BE; --ink3:#8C8299;
  --line:#2D2639; --line2:#3D3450;
  --accent:#E888B8; --accent-ink:#22030F; --accent-soft:#361A2A;
  --amber:#E7B45E; --amber-soft:#36280F;
  --forest:#5FC098; --forest-soft:#13301F;
  --rose:#F0808F; --rose-soft:#3A1419;
  color-scheme:dark}

*{box-sizing:border-box}
html{height:100%;box-sizing:border-box;background:var(--surface)}
body{height:100%;margin:0;overflow:hidden;display:flex;flex-direction:column;
  background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

.top{flex:0 0 auto;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{padding-left:var(--gut);padding-right:var(--gutr);padding-block:9px;display:flex;align-items:center;gap:9px}
.brand{font-family:var(--f-disp);font-weight:800;font-size:16px;letter-spacing:-.02em;line-height:1.05;margin-right:auto;min-width:0}
.brand span{display:block;font-family:var(--f-mono);font-size:9.5px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);margin-top:2px}
.iconbtn{width:34px;height:34px;border-radius:9px;border:1px solid var(--line2);display:grid;place-items:center;font-size:14px;flex:0 0 auto}
main{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.wrap{padding-left:var(--gut);padding-right:var(--gutr);padding-block:15px 30px;max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:13px}
.rail{flex:0 0 auto;background:var(--surface);border-top:1px solid var(--line)}
.rail-in{padding-left:var(--gut);padding-right:var(--gutr);padding-block:5px;display:flex;gap:2px;max-width:720px;margin:0 auto}
.tab{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px 5px;border-radius:9px;color:var(--ink3)}
.tab b{font-size:10.5px;font-weight:600}
.tab i{font-style:normal;font-size:16px;line-height:1}
.tab[aria-selected="true"]{color:var(--accent);background:var(--accent-soft)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
h1,h2,h3{font-family:var(--f-disp);letter-spacing:-.025em;text-wrap:balance;margin:0;font-weight:700}
h1{font-size:28px;line-height:1.08}
h2{font-size:20px;line-height:1.15}
h3{font-size:16px;line-height:1.2}
.lbl{font-family:var(--f-mono);font-size:10px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;color:var(--ink3)}
.sub{color:var(--ink2);font-size:14px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.mt{margin-top:5px}
.badge{display:inline-block;font-family:var(--f-mono);font-size:9.5px;font-weight:700;letter-spacing:.08em;padding:3px 6px;border-radius:5px;white-space:nowrap}
.badge.a2{background:var(--forest-soft);color:var(--forest)}
.badge.b1{background:var(--amber-soft);color:var(--amber)}
.badge.pos{background:var(--surface2);color:var(--ink2);letter-spacing:.04em;text-transform:lowercase}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:46px;padding:11px 15px;border-radius:11px;
  background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:15px;border:1px solid var(--accent);text-align:center}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line2);font-weight:600}
.btn.soft{background:var(--surface2);color:var(--ink);border-color:transparent;font-weight:600}
.btn.ok{background:var(--forest);border-color:var(--forest);color:#fff}
.btn.full{width:100%}
.btn.sm{min-height:38px;padding:8px 12px;font-size:14px;border-radius:9px}
.btn:active{transform:translateY(1px)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btnrow>*{flex:1 1 140px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.pick{padding:7px 11px;border-radius:999px;border:1px solid var(--line2);font-size:13px;font-weight:600;color:var(--ink2)}
.pick[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.search{width:100%;min-height:44px;padding:10px 13px;border-radius:11px;border:1.5px solid var(--line2);background:var(--surface);font-size:15px}

/* --- kelime kartı: kullanıcının istediği biçim --- */
.wcard{background:var(--surface);border:1px solid var(--line);border-radius:17px;overflow:hidden}
.whead{padding:16px 15px 13px;border-bottom:1px solid var(--line);background:var(--raise)}
.whead .wline{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.whead .w{font-family:var(--f-disp);font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1.05}
.whead .m{font-size:17px;font-weight:600;color:var(--accent);margin-top:5px}
.whead .m.hide{color:transparent;background:var(--surface2);border-radius:7px;display:inline-block;padding:0 8px;user-select:none}
.sent{padding:12px 15px;border-bottom:1px solid var(--line);display:flex;gap:10px}
.sent:last-child{border-bottom:0}
.sent .sg{flex:0 0 22px;height:22px;border-radius:7px;display:grid;place-items:center;font-family:var(--f-mono);
  font-size:13px;font-weight:700;margin-top:2px}
.sent.aff .sg{background:var(--forest-soft);color:var(--forest)}
.sent.q   .sg{background:var(--amber-soft);color:var(--amber)}
.sent.neg .sg{background:var(--rose-soft);color:var(--rose)}
.sent .sx{flex:1 1 auto;min-width:0}
.sent .en,.sent .tr{display:block}
.sent .en{font-size:16px;font-weight:600;line-height:1.38}
.sent .en mark{background:var(--accent-soft);color:inherit;border-radius:4px;padding:0 3px;font-weight:700}
.sent .tr{font-size:13.5px;color:var(--ink2);line-height:1.38;margin-top:2px}
.wextra{padding:11px 15px;background:var(--raise);border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.wextra div{font-size:13px;color:var(--ink2);line-height:1.4}
.wextra b{font-family:var(--f-mono);font-size:9.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);
  display:inline-block;min-width:54px}
.boxes{display:flex;gap:4px;justify-content:center;margin-top:2px}
.boxes i{width:17px;height:4px;border-radius:999px;background:var(--line2)}
.boxes i.on{background:var(--forest)}

/* ilerleme & liste */
.bar{height:6px;border-radius:999px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .25s}
.bar.ok i{background:var(--forest)}
.qmeta{display:flex;justify-content:space-between;align-items:center;font-family:var(--f-mono);font-size:11.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.stat{background:var(--surface);padding:11px 10px;min-width:0}
.stat b{display:block;font-family:var(--f-disp);font-size:23px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{display:block;font-family:var(--f-mono);font-size:9px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);margin-top:2px}
.goal{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.goal:last-child{border-bottom:0}
.goal .bx{width:22px;height:22px;flex:0 0 auto;border-radius:7px;border:1.5px solid var(--line2);display:grid;place-items:center;font-size:12px;color:transparent}
.goal.done .bx{background:var(--forest);border-color:var(--forest);color:#fff}
.goal .t{flex:1 1 auto;min-width:0;font-size:14.5px}
.goal .v{font-family:var(--f-mono);font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums}

.lrow{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.lrow:last-child{border-bottom:0}
.lrow .lw{flex:0 0 36%;min-width:0}
.lrow .lw b{display:block;font-weight:700;font-size:15.5px;line-height:1.25}
.lrow .lw em{font-style:normal;font-family:var(--f-mono);font-size:9.5px;color:var(--ink3);letter-spacing:.06em}
.lrow .lm{flex:1 1 auto;min-width:0;font-size:14px;color:var(--ink2)}
.lrow .lm i{display:block;font-style:normal;font-size:12.5px;color:var(--ink3);margin-top:3px;line-height:1.35}
.star{flex:0 0 30px;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:14px;color:var(--ink3)}
.star[aria-pressed="true"]{color:var(--amber)}
.grp{font-family:var(--f-mono);font-size:10px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--accent);padding:13px 0 3px}

/* test */
.opt{display:block;width:100%;text-align:left;padding:12px 13px;border-radius:11px;border:1.5px solid var(--line);
  background:var(--surface);font-size:15.5px;font-weight:500;margin-bottom:7px;line-height:1.35}
.opt.right{border-color:var(--forest);background:var(--forest-soft);font-weight:700}
.opt.wrong{border-color:var(--rose);background:var(--rose-soft)}
.opt[disabled]{cursor:default}
.fb{font-size:14px;padding:11px 12px;border-radius:11px;background:var(--surface2);color:var(--ink2);line-height:1.5}
.fb b{color:var(--ink)}
.fb.good{background:var(--forest-soft);color:var(--ink)}
.fb.bad{background:var(--rose-soft);color:var(--ink)}
.qtext{font-size:18px;font-weight:600;line-height:1.5}
.qtext u{text-decoration:none;border-bottom:2.5px solid var(--accent);padding:0 14px}
.inpw{display:flex;gap:7px;align-items:stretch}
.inpw .search{flex:1 1 auto;min-width:0;font-family:var(--f-mono);font-size:16px}
.pline{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid var(--line)}
.pline:last-child{border-bottom:0}
.pline .t{flex:1 1 auto;min-width:0;font-size:14.5px;font-weight:500}
.pline .bar{flex:0 0 74px}
.pline .v{flex:0 0 44px;text-align:right;font-family:var(--f-mono);font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--ink2)}
.empty{text-align:center;padding:28px 14px;color:var(--ink2);line-height:1.55}
.empty b{display:block;font-family:var(--f-disp);font-size:18px;color:var(--ink);margin-bottom:6px}
.divider{height:1px;background:var(--line);margin:3px 0}
</style>

<header class="top">
  <div class="top-in">
    <div class="brand">Word Forge<span id="hsub">750 kelime · A2 &amp; B1</span></div>
    <span class="badge a2" id="syncB">yerel</span>
    <button class="iconbtn" id="themeBtn" aria-label="Tema">◐</button>
  </div>
</header>

<main id="main">
  <section class="wrap" id="v-today"></section>
  <section class="wrap" id="v-study" hidden></section>
  <section class="wrap" id="v-quiz" hidden></section>
  <section class="wrap" id="v-list" hidden></section>
  <section class="wrap" id="v-prog" hidden></section>
</main>

<nav class="rail">
  <div class="rail-in" role="tablist">
    <button class="tab" role="tab" data-v="today" aria-selected="true"><i>◉</i><b>Bugün</b></button>
    <button class="tab" role="tab" data-v="study" aria-selected="false"><i>▭</i><b>Kart</b></button>
    <button class="tab" role="tab" data-v="quiz" aria-selected="false"><i>✓</i><b>Test</b></button>
    <button class="tab" role="tab" data-v="list" aria-selected="false"><i>☰</i><b>Sözlük</b></button>
    <button class="tab" role="tab" data-v="prog" aria-selected="false"><i>◴</i><b>İlerleme</b></button>
  </div>
</nav>

<script>
/* ============================================================
   WORD FORGE - 750 kelime, A2 & B1
   Her kelime: anlam + tür + seviye
     (+) düz cümle   (?) soru cümlesi   (−) olumsuz cümle   hepsi çevirili
     aile  = türemiş biçimler
     kalıp = birliktelik / kullanım kalıbı
   Alan sırası:
   word|tr|pos|lvl|aff|affTR|q|qTR|neg|negTR|aile|kalıp
   ============================================================ */
const CATS = [
{id:"c01",name:"İnsanlar & Kişilik",short:"Kişilik",w:[
"friendly|arkadaş canlısı, cana yakın|adj|A2|Our new neighbours are very friendly.|Yeni komşularımız çok cana yakın.|Are the people there friendly?|Oradaki insanlar cana yakın mı?|He isn't friendly to strangers.|Yabancılara karşı cana yakın değil.|friendship (n) arkadaşlık, unfriendly (adj) soğuk|be friendly to sb",
"polite|kibar, nazik|adj|A2|She is always polite to customers.|Müşterilere karşı her zaman kibardır.|Is it polite to ask that question?|O soruyu sormak kibarca mı?|He wasn't polite to the waiter.|Garsona karşı kibar değildi.|politely (adv) kibarca, politeness (n) nezaket|be polite to sb",
"rude|kaba|adj|B1|It is rude to interrupt people.|İnsanların sözünü kesmek kabalıktır.|Was I rude to him?|Ona karşı kaba mı davrandım?|She never says anything rude.|Asla kaba bir şey söylemez.|rudely (adv) kabaca, rudeness (n) kabalık|be rude to sb",
"honest|dürüst|adj|B1|I will be honest with you about the price.|Fiyat konusunda sana dürüst olacağım.|Do you think he is honest?|Sence dürüst mü?|They weren't honest about the problem.|Problem konusunda dürüst davranmadılar.|honesty (n) dürüstlük, dishonest (adj) sahtekâr|be honest with sb, to be honest",
"shy|utangaç|adj|A2|My son is shy with new people.|Oğlum yeni insanlara karşı utangaçtır.|Why are you so shy?|Neden bu kadar utangaçsın?|She isn't shy at all on stage.|Sahnede hiç utangaç değil.|shyness (n) utangaçlık|be shy with sb",
"confident|kendine güvenen|adj|B1|He feels confident before an interview.|Mülakat öncesi kendine güveniyor.|Are you confident about the exam?|Sınav konusunda kendine güveniyor musun?|I am not confident enough to speak.|Konuşacak kadar kendime güvenmiyorum.|confidence (n) özgüven|be confident about sth",
"patient|sabırlı|adj|B1|A good teacher must be patient.|İyi bir öğretmen sabırlı olmalı.|Can you be patient for five more minutes?|Beş dakika daha sabredebilir misin?|He isn't patient with children.|Çocuklara karşı sabırlı değil.|patience (n) sabır, impatient (adj) sabırsız|be patient with sb",
"generous|cömert|adj|B1|Our host was very generous with his time.|Ev sahibimiz zamanı konusunda çok cömertti.|Is she generous with her money?|Parası konusunda cömert mi?|He wasn't generous with the tips.|Bahşiş konusunda cömert değildi.|generosity (n) cömertlik|be generous with sth",
"selfish|bencil|adj|B1|That was a selfish decision.|Bu bencil bir karardı.|Am I being selfish?|Bencillik mi ediyorum?|She is not selfish about sharing.|Paylaşma konusunda bencil değil.|selfishly (adv) bencilce, unselfish (adj) özverili|a selfish decision",
"reliable|güvenilir|adj|B1|He is a reliable colleague.|Güvenilir bir iş arkadaşı.|Is this information reliable?|Bu bilgi güvenilir mi?|The old car isn't reliable in winter.|Eski araba kışın güvenilir değil.|reliability (n) güvenilirlik, rely on (v) güvenmek|a reliable source",
"hard-working|çalışkan|adj|A2|The whole team is hard-working.|Bütün ekip çalışkan.|Is your brother hard-working?|Kardeşin çalışkan mı?|He isn't lazy; he is hard-working.|Tembel değil, çalışkan.|work hard (v) çok çalışmak|a hard-working student",
"lazy|tembel|adj|A2|I feel lazy on Sunday mornings.|Pazar sabahları kendimi tembel hissederim.|Why are you so lazy today?|Bugün neden bu kadar tembelsin?|She isn't lazy, she is just tired.|Tembel değil, sadece yorgun.|laziness (n) tembellik|feel lazy",
"clever|zeki, akıllı|adj|A2|That was a clever answer.|Bu zekice bir cevaptı.|Who is the cleverest in the class?|Sınıfın en zekisi kim?|It wasn't a clever idea.|Bu akıllıca bir fikir değildi.|cleverly (adv) zekice|a clever idea",
"talented|yetenekli|adj|B1|She is a talented musician.|Yetenekli bir müzisyen.|Is he talented at drawing?|Çizimde yetenekli mi?|He isn't talented, but he works hard.|Yetenekli değil ama çok çalışıyor.|talent (n) yetenek|be talented at sth",
"brave|cesur|adj|B1|It was brave of you to speak up.|Konuşman cesurcaydı.|Are you brave enough to try?|Denemeye cesaretin var mı?|I wasn't brave enough to ask.|Sormaya cesaretim yoktu.|bravery (n) cesaret, bravely (adv) cesurca|be brave enough to do sth",
"cheerful|neşeli|adj|B1|She always sounds cheerful on the phone.|Telefonda hep neşeli görünür.|Why are you so cheerful today?|Bugün neden bu kadar neşelisin?|He wasn't cheerful after the news.|Haberden sonra neşeli değildi.|cheer up (v) neşelendirmek|a cheerful person",
"serious|ciddi|adj|A2|This is a serious problem.|Bu ciddi bir problem.|Are you serious about moving?|Taşınma konusunda ciddi misin?|It isn't serious, don't worry.|Ciddi değil, merak etme.|seriously (adv) ciddi olarak|be serious about sth",
"strict|katı, sert|adj|B1|Our manager is strict about deadlines.|Müdürümüz son tarihler konusunda katı.|Are the rules strict here?|Buradaki kurallar katı mı?|My parents weren't strict with me.|Ailem bana karşı katı değildi.|strictly (adv) kesinlikle|be strict about sth",
"calm|sakin|adj|A2|Please stay calm and wait here.|Lütfen sakin olun ve burada bekleyin.|How do you stay calm under pressure?|Baskı altında nasıl sakin kalıyorsun?|He wasn't calm during the meeting.|Toplantı sırasında sakin değildi.|calmly (adv) sakince, calm down (v) sakinleşmek|stay calm, calm down",
"nervous|gergin, heyecanlı|adj|A2|I get nervous before exams.|Sınavlardan önce gerilirim.|Are you nervous about the interview?|Mülakat için gergin misin?|She wasn't nervous at all.|Hiç gergin değildi.|nervously (adv) gergin biçimde|be nervous about sth",
"character|karakter|n|B1|He has a strong character.|Güçlü bir karakteri var.|What kind of character does she have?|Nasıl bir karaktere sahip?|Money doesn't change his character.|Para karakterini değiştirmiyor.|characteristic (adj) tipik|a strong character",
"personality|kişilik|n|B1|She has a warm personality.|Sıcak bir kişiliği var.|Does personality matter in this job?|Bu işte kişilik önemli mi?|Skills aren't more important than personality.|Beceriler kişilikten daha önemli değil.|personal (adj) kişisel|a warm personality",
"behaviour|davranış|n|B1|His behaviour at work has improved.|İşteki davranışı düzeldi.|Is this behaviour normal?|Bu davranış normal mi?|Such behaviour isn't acceptable here.|Böyle bir davranış burada kabul edilemez.|behave (v) davranmak|good behaviour",

/* ===================== YARDIMCILAR ===================== */
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function $(id){return document.getElementById(id);}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function pad(n){return n<10?"0"+n:""+n;}
function ymd(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function today(){return ymd(new Date());}
function pYmd(s){var p=String(s).split("-");return new Date(+p[0],+p[1]-1,+p[2]);}
function dBetween(a,b){return Math.round((pYmd(b).getTime()-pYmd(a).getTime())/86400000);}
function addDays(s,n){var d=pYmd(s);d.setDate(d.getDate()+n);return ymd(d);}
function norm(s){return String(s).toLowerCase().trim().replace(/[‘’ʼ]/g,"'").replace(/\s+/g," ").replace(/[.!?,]+$/,"").trim();}

/* cümlede kelimeyi işaretle - düzensiz fiiller ve öbek fiiller dahil */
var IRR={be:"was were been is are am",bring:"brought",buy:"bought",catch:"caught",
choose:"chose chosen",come:"came",do:"did does done",drink:"drank drunk",eat:"ate eaten",
fall:"fell fallen",feel:"felt",find:"found",forget:"forgot forgotten",get:"got gotten",
give:"gave given",go:"went gone",grow:"grew grown",have:"has had",hear:"heard",hold:"held",
keep:"kept",know:"knew known",lead:"led",leave:"left",lend:"lent",lose:"lost",make:"made",
mean:"meant",meet:"met",pay:"paid",run:"ran",say:"said",see:"saw seen",sell:"sold",send:"sent",
sit:"sat",sleep:"slept",speak:"spoke spoken",spend:"spent",stand:"stood",take:"took taken",
teach:"taught",tell:"told",think:"thought",understand:"understood",wear:"wore worn",
win:"won",write:"wrote written",break:"broke broken",fly:"flew flown",swim:"swam swum"};

function wordCands(word){
  var base=String(word).toLowerCase().replace(/[^a-z \-]/g,"").trim();
  if(!base) return [];
  var out=[base], toks=base.split(/[ \-]+/).filter(Boolean);
  toks.forEach(function(t){
    if(t.length<2) return;
    out.push(t);
    if(IRR[t]) IRR[t].split(" ").forEach(function(f){ if(f) out.push(f); });
    if(/y$/.test(t)) out.push(t.slice(0,-1)+"i");
    if(/e$/.test(t)) out.push(t.slice(0,-1));
    for(var n=t.length-1;n>=3;n--) out.push(t.slice(0,n));
  });
  return out;
}
function findForm(sent,word){
  var cs=wordCands(word);
  for(var i=0;i<cs.length;i++){
    var c=cs[i].replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
    var re=new RegExp("\\b("+c+"[a-zA-Z]*)","i");
    var m=sent.match(re);
    if(m) return {re:re, match:m[1]};
  }
  return null;
}
function markWord(sent,word){
  var e=esc(sent), f=findForm(e,word);
  return f ? e.replace(f.re,"<mark>$1</mark>") : e;
}
function blankWord(sent,word){
  var f=findForm(sent,word);
  return f ? {text:sent.replace(f.re,"___"), answer:f.match} : null;
}

var LS="wforge.v1";
var st={srs:{},fav:{},log:{},cfg:{npd:15},updatedAt:0};
try{var raw=localStorage.getItem(LS); if(raw){var o=JSON.parse(raw);
  st.srs=o.srs||{}; st.fav=o.fav||{}; st.log=o.log||{}; st.cfg=o.cfg||{npd:15}; st.updatedAt=o.updatedAt||0;}}catch(e){}
if(!st.cfg.npd) st.cfg.npd=15;

var INT=[0,1,2,4,8,16];
function isNew(k){return !st.srs[k];}
function isDue(k){var s=st.srs[k]; return s? dBetween(today(),s.due)<=0 : false;}
function learned(){var n=0; for(var k in st.srs) if(st.srs[k].b>=3) n++; return n;}
function started(){return Object.keys(st.srs).length;}
function bump(f,n){var d=today(),l=st.log[d]||{n:0,r:0,q:0};l[f]=(l[f]||0)+(n||1);st.log[d]=l;}
function streak(){
  var n=0,d=new Date(),k=today(),l=st.log[k];
  if(!l||((l.n|0)+(l.r|0)+(l.q|0))===0) d.setDate(d.getDate()-1);
  for(var i=0;i<500;i++){
    var key=ymd(d), e=st.log[key];
    if(e&&((e.n|0)+(e.r|0)+(e.q|0))>0){n++; d.setDate(d.getDate()-1);} else break;
  }
  return n;
}
function save(){ st.updatedAt=Date.now();
  try{localStorage.setItem(LS,JSON.stringify(st));}catch(e){} pushRemote(); }
function grade(k,ok){
  var s=st.srs[k], fresh=!s;
  var b = ok ? Math.min(5,(s?s.b:-1)+1) : 0;
  st.srs[k]={b:b, due:addDays(today(),INT[b]), t:Date.now()};
  bump(fresh?"n":"r"); save();
}

var db=null, uid=null, pushT=null, writing=false, dirty=false;
function setSync(m){var c=$("syncB");
  if(m==="sync"){c.textContent="senkron";c.className="badge a2";}
  else if(m==="wait"){c.textContent="bağlanıyor";c.className="badge b1";}
  else {c.textContent="bu cihaz";c.className="badge b1";}}
function mergeRemote(r){
  if(!r) return;
  var rs=r.srs||{};
  for(var k in rs){var m=st.srs[k]; if(!m||(rs[k].t||0)>(m.t||0)) st.srs[k]=rs[k];}
  var rf=r.fav||{}; for(var f in rf) st.fav[f]=rf[f];
  var rl=r.log||{};
  for(var d in rl){var x=rl[d]||{},y=st.log[d];
    st.log[d]=y?{n:Math.max(x.n|0,y.n|0),r:Math.max(x.r|0,y.r|0),q:Math.max(x.q|0,y.q|0)}:x;}
  if(r.cfg&&r.cfg.npd&&(r.updatedAt||0)>(st.updatedAt||0)) st.cfg=r.cfg;
  try{localStorage.setItem(LS,JSON.stringify(st));}catch(e){}
}
function doWrite(){
  if(!db||!uid||writing) return;
  writing=true; dirty=false;
  db.doc("data/users/"+uid+"/progress").set({srs:st.srs,fav:st.fav,log:st.log,cfg:st.cfg,updatedAt:Date.now()})
    .then(function(){writing=false; if(dirty) doWrite();}).catch(function(){writing=false;});
}
function pushRemote(){ if(!db||!uid) return; dirty=true; clearTimeout(pushT); pushT=setTimeout(doWrite,1800); }
(function(){
  if(!window.claude||!window.claude.use){ setSync("local"); return; }
  setSync("wait");
  var done=false, guard=setTimeout(function(){ if(!done) setSync("local"); },11000);
  Promise.all([claude.use("db"),claude.use("user")]).then(function(r){
    var d=r[0],u=r[1];
    if(!d||!u){done=true;clearTimeout(guard);setSync("local");return;}
    return u.id().then(function(id){
      if(!id){done=true;clearTimeout(guard);setSync("local");return;}
      db=d; uid=id;
      return db.doc("data/users/"+id+"/progress").get().then(function(sn){
        done=true; clearTimeout(guard);
        if(sn.exists) mergeRemote(sn.data());
        setSync("sync"); renderAll(); doWrite();
      });
    });
  }).catch(function(){done=true;clearTimeout(guard);setSync("local");});
})();
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="hidden"&&dirty)doWrite();});

     '<div class="sub mt" style="font-size:13px">Tekrarlar bunun dışında, aralıklı tekrar takvimine göre gelir.</div>'+
   '</div>';
  var goals=[{t:st.cfg.npd+" yeni kelime",v:l.n|0,n:st.cfg.npd},
             {t:"Zamanı gelen tekrarları bitir",v:(l.r|0),n:Math.max(1,s.due.length+(l.r|0))},
             {t:"15 test sorusu",v:l.q|0,n:15}];
  $("goals").innerHTML=goals.map(function(g){
    var d=g.v>=g.n;
    return '<div class="goal'+(d?" done":"")+'"><span class="bx">✓</span><span class="t">'+esc(g.t)+
      '</span><span class="v num">'+Math.min(g.v,g.n)+"/"+g.n+'</span></div>';}).join("");
  $("goStudy").addEventListener("click",function(){ queue=null; go("study"); });
  $("goQuiz").addEventListener("click",function(){ qq=null; go("quiz"); });
  $("npd").querySelectorAll(".pick").forEach(function(b){
    b.addEventListener("click",function(){ st.cfg.npd=+b.dataset.n; save(); renderToday(); });
  });
}

/* ===================== KART ÇALIŞMASI ===================== */
var queue=null, qi=0, flip=false, sCat="today", sDone=0;
function buildQueue(){
  if(sCat==="today"){
    var s=dailySet();
    queue=shuffle(s.due.slice()).concat(s.fresh);
    if(!queue.length) queue=shuffle(WORDS.filter(function(w){return st.srs[w.key];}).slice()).slice(0,20);
  } else {
    var pool=BYCAT[sCat].items.slice();
    var d=pool.filter(function(w){return isNew(w.key)||isDue(w.key);});
    queue=shuffle(d.length?d:pool).slice(0,25);
  }
  qi=0; flip=false; sDone=0;
}
function renderStudy(){
  var el=$("v-study");
  var head='<div class="card flat" style="background:none;border:0;padding:0"><div class="chips">'+
    '<button class="pick" data-sc="today" aria-pressed="'+(sCat==="today")+'">Bugünün seti</button>'+
    CATS.map(function(c){return '<button class="pick" data-sc="'+c.id+'" aria-pressed="'+(sCat===c.id)+'">'+esc(c.short)+'</button>';}).join("")+
    '</div></div>';
  if(!queue) buildQueue();
  function bind(){
    el.querySelectorAll("[data-sc]").forEach(function(b){
      b.addEventListener("click",function(){ sCat=b.dataset.sc; queue=null; renderStudy(); });
    });
  }
  if(!queue.length){
    el.innerHTML=head+'<div class="card"><div class="empty"><b>Şu an çalışacak kart yok</b>'+
      'Bu destede zamanı gelen tekrar kalmadı. Başka bir tema seç ya da teste geç.</div>'+
      '<button class="btn full soft" id="toQ">Teste geç</button></div>';
    $("toQ").addEventListener("click",function(){ qq=null; go("quiz"); }); bind(); return;
  }
  if(qi>=queue.length){
    el.innerHTML=head+'<div class="card"><div class="lbl">Tur bitti</div>'+
      '<h1 class="mt num">'+sDone+'</h1><div class="sub">kart çalışıldı</div>'+
      '<div class="btnrow" style="margin-top:13px">'+
      '<button class="btn" id="again">Yeni tur</button>'+
      '<button class="btn ghost" id="toQ2">Teste geç</button></div></div>';
    $("again").addEventListener("click",function(){ queue=null; renderStudy(); });
    $("toQ2").addEventListener("click",function(){ qq=null; go("quiz"); }); bind(); return;
  }
  var it=queue[qi], s=st.srs[it.key], b=s?s.b:-1, boxes="";
  for(var i=0;i<6;i++) boxes+='<i class="'+(b>=i?"on":"")+'"></i>';
  el.innerHTML=head+
    '<div class="bar"><i style="width:'+Math.round(qi/queue.length*100)+'%"></i></div>'+
    '<div class="qmeta mt"><span>'+esc(it.cat.name)+(isNew(it.key)?" · yeni":"")+'</span><span>'+(qi+1)+" / "+queue.length+'</span></div>'+
    '<div id="cw">'+cardHTML(it,flip)+'</div>'+
    '<div class="boxes">'+boxes+'</div>'+
    (flip?'<div class="btnrow"><button class="btn ghost" id="bad">Tekrar göster</button>'+
          '<button class="btn ok" id="good">Biliyorum</button></div>'
         :'<button class="btn soft full" id="rev">Anlamı ve cümleleri göster</button>');
  $("cw").addEventListener("click",function(){ if(!flip){flip=true;renderStudy();} });
  var r=$("rev"); if(r) r.addEventListener("click",function(){ flip=true; renderStudy(); });
  var g=$("good"); if(g) g.addEventListener("click",function(){ grade(it.key,true); sDone++; qi++; flip=false; renderStudy(); });
  var bd=$("bad"); if(bd) bd.addEventListener("click",function(){ grade(it.key,false); sDone++; qi++; flip=false; renderStudy(); });
  bind();
}

/* ===================== TEST ===================== */
var qType="mean", qq=null, qAns=null, qRight=0, qTotal=0, qLvl="all";
function quizPool(){
  var p=WORDS.filter(function(w){ return qLvl==="all"||w.lvl===qLvl; });
  var seenW=p.filter(function(w){ return st.srs[w.key]; });
  return seenW.length>=8?seenW:p;
}
function makeQ(){
  var pool=quizPool(), it=pick(pool);
  if(qType==="mean"||qType==="prod"){
    var others=shuffle(pool.filter(function(x){return x.key!==it.key;}).slice()).slice(0,3);
    var opts=shuffle([it].concat(others));
    return {kind:qType,it:it,
      lead:qType==="mean"?"Bu kelimenin anlamı ne?":"Bunun İngilizcesi hangisi?",
      prompt:qType==="mean"?it.w:it.tr,
      opts:opts.map(function(x){return qType==="mean"?x.tr:x.w;}),
      a:opts.indexOf(it)};
  }
  if(qType==="gap"){
    var tries=0, bl=null, cur=it;
    while(tries<12){ bl=blankWord(cur.aff,cur.w); if(bl) break; cur=pick(pool); tries++; }
    if(!bl) return makeQ2();
    return {kind:"gap",it:cur,bl:bl};
  }
  return {kind:"spell",it:it};
}
function makeQ2(){ qType="mean"; return makeQ(); }
function renderQuiz(){
  var el=$("v-quiz");
  var head='<div class="card flat" style="background:none;border:0;padding:0">'+
    '<div class="chips">'+
      '<button class="pick" data-qt="mean" aria-pressed="'+(qType==="mean")+'">EN → TR</button>'+
      '<button class="pick" data-qt="prod" aria-pressed="'+(qType==="prod")+'">TR → EN</button>'+
      '<button class="pick" data-qt="gap" aria-pressed="'+(qType==="gap")+'">Cümlede boşluk</button>'+
      '<button class="pick" data-qt="spell" aria-pressed="'+(qType==="spell")+'">Yazım</button>'+
    '</div>'+
    '<div class="chips" style="margin-top:7px">'+
      '<button class="pick" data-ql="all" aria-pressed="'+(qLvl==="all")+'">Tümü</button>'+
      '<button class="pick" data-ql="A2" aria-pressed="'+(qLvl==="A2")+'">A2</button>'+
      '<button class="pick" data-ql="B1" aria-pressed="'+(qLvl==="B1")+'">B1</button>'+
    '</div></div>';
  function bind(){
    el.querySelectorAll("[data-qt]").forEach(function(b){
      b.addEventListener("click",function(){ qType=b.dataset.qt; qq=null; qAns=null; renderQuiz(); });});
    el.querySelectorAll("[data-ql]").forEach(function(b){
      b.addEventListener("click",function(){ qLvl=b.dataset.ql; qq=null; qAns=null; renderQuiz(); });});
  }
  if(!qq){ qq=makeQ(); qAns=null; }
  var it=qq.it;
  var scor='<div class="qmeta"><span>'+esc(it.cat.short)+' · '+it.lvl+'</span><span>'+qRight+" / "+qTotal+' doğru</span></div>';

  if(qq.kind==="mean"||qq.kind==="prod"){
    el.innerHTML=head+scor+'<div class="card">'+
      '<div class="lbl">'+esc(qq.lead)+'</div>'+
      '<div class="qtext mt" style="font-family:var(--f-disp);font-size:26px;font-weight:800">'+esc(qq.prompt)+'</div>'+
      '<div style="margin-top:14px">'+qq.opts.map(function(o,k){
        var cls="opt"; if(qAns!==null){ if(k===qq.a) cls+=" right"; else if(k===qAns) cls+=" wrong"; }
        return '<button class="'+cls+'" data-k="'+k+'"'+(qAns!==null?" disabled":"")+'>'+esc(o)+'</button>';}).join("")+'</div>'+
      (qAns!==null?'<div class="fb '+(qAns===qq.a?"good":"bad")+'"><b>'+esc(it.w)+'</b> = '+esc(it.tr)+'<br>'+
        '<span style="opacity:.85">'+esc(it.aff)+' — '+esc(it.affTR)+'</span></div>'+
        '<button class="btn full" id="nx" style="margin-top:10px">Sıradaki</button>':'')+
      '</div>';
    el.querySelectorAll(".opt").forEach(function(b){
      b.addEventListener("click",function(){
        if(qAns!==null) return;
        qAns=+b.dataset.k; var ok=qAns===qq.a;
        qTotal++; if(ok) qRight++; bump("q"); grade(it.key,ok); renderQuiz();
      });});
  }
  else if(qq.kind==="gap"){
    el.innerHTML=head+scor+'<div class="card">'+
      '<div class="lbl">Boşluğa doğru kelimeyi yaz</div>'+
      '<div class="qtext mt">'+esc(qq.bl.text).replace(/___/g,"<u>&nbsp;&nbsp;&nbsp;&nbsp;</u>")+'</div>'+
      '<div class="sub mt" style="font-size:13.5px">İpucu: '+esc(it.tr)+' ('+esc(it.pos)+')</div>'+
      '<div class="inpw" style="margin-top:12px">'+
        '<input class="search" id="gin" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="kelimeyi yaz"'+(qAns!==null?" disabled":"")+' value="'+esc(qq.typed||"")+'">'+
        (qAns===null?'<button class="btn sm" id="gchk" style="flex:0 0 auto;padding:0 15px">Kontrol</button>':'')+
      '</div>'+
      (qAns!==null?'<div class="fb '+(qAns?"good":"bad")+'" style="margin-top:10px">'+
        (qAns?"<b>Doğru. </b>":"<b>Doğrusu: </b><b>"+esc(qq.bl.answer)+"</b>. ")+esc(it.affTR)+'</div>'+
        '<button class="btn full" id="nx" style="margin-top:10px">Sıradaki</button>':'')+
      '</div>';
    var chk=function(){
      if(qAns!==null) return;
      var v=$("gin").value; qq.typed=v;
      var ok = norm(v)===norm(qq.bl.answer) || norm(v)===norm(it.w);
      qAns=ok?1:0; qTotal++; if(ok) qRight++; bump("q"); grade(it.key,ok); renderQuiz();
    };
    var gb=$("gchk"); if(gb) gb.addEventListener("click",chk);
    var gi=$("gin"); if(gi&&qAns===null){ gi.addEventListener("keydown",function(e){ if(e.key==="Enter"){e.preventDefault();chk();} }); gi.focus(); }
  }
  else {
    el.innerHTML=head+scor+'<div class="card">'+
      '<div class="lbl">Türkçesinden İngilizcesini yaz</div>'+
      '<div class="qtext mt" style="font-family:var(--f-disp);font-size:24px;font-weight:800">'+esc(it.tr)+'</div>'+
      '<div class="sub mt" style="font-size:13.5px">'+esc(it.pos)+' · '+it.lvl+' · ilk harf: <b>'+esc(it.w[0])+'</b> · '+it.w.length+' karakter</div>'+
      '<div class="inpw" style="margin-top:12px">'+
        '<input class="search" id="sin" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="İngilizcesini yaz"'+(qAns!==null?" disabled":"")+' value="'+esc(qq.typed||"")+'">'+
        (qAns===null?'<button class="btn sm" id="schk" style="flex:0 0 auto;padding:0 15px">Kontrol</button>':'')+
      '</div>'+
      (qAns!==null?'<div class="fb '+(qAns?"good":"bad")+'" style="margin-top:10px">'+
        (qAns?"<b>Doğru. </b>":"<b>Doğrusu: </b><b>"+esc(it.w)+"</b>. ")+esc(it.aff)+'</div>'+
        '<button class="btn full" id="nx" style="margin-top:10px">Sıradaki</button>':'')+
      '</div>';
    var chk2=function(){
      if(qAns!==null) return;
      var v=$("sin").value; qq.typed=v;
      var ok=norm(v)===norm(it.w); qAns=ok?1:0;
      qTotal++; if(ok) qRight++; bump("q"); grade(it.key,ok); renderQuiz();
    };
    var sb=$("schk"); if(sb) sb.addEventListener("click",chk2);
    var si=$("sin"); if(si&&qAns===null){ si.addEventListener("keydown",function(e){ if(e.key==="Enter"){e.preventDefault();chk2();} }); si.focus(); }
  }
  var nx=$("nx"); if(nx) nx.addEventListener("click",function(){ qq=null; qAns=null; renderQuiz(); });
  bind();
}

/* ===================== SÖZLÜK ===================== */
var lCat="all", lQ="", lOpen=null;
function renderList(){
  var el=$("v-list");
  var list=WORDS.filter(function(w){
    if(lCat==="fav") return !!st.fav[w.key];
    if(lCat!=="all"&&w.cat.id!==lCat) return false;
    if(lQ) return (w.w+" "+w.tr+" "+w.aff+" "+w.affTR+" "+w.coll).toLowerCase().indexOf(lQ)>=0;
    return true;
  });
  var html='<input class="search" id="lsearch" type="search" placeholder="Ara: afford, helal, pazarlık, deadline..." value="'+esc(lQ)+'" autocomplete="off">'+
    '<div class="chips">'+
      '<button class="pick" data-lc="all" aria-pressed="'+(lCat==="all")+'">Tümü ('+TOTAL+')</button>'+
      '<button class="pick" data-lc="fav" aria-pressed="'+(lCat==="fav")+'">★ Favoriler</button>'+
      CATS.map(function(c){return '<button class="pick" data-lc="'+c.id+'" aria-pressed="'+(lCat===c.id)+'">'+esc(c.short)+'</button>';}).join("")+
    '</div>';
  if(lOpen&&BYKEY[lOpen]){
    html+='<button class="btn soft sm" id="lback" style="align-self:flex-start">← Listeye dön</button>'+
      cardHTML(BYKEY[lOpen],true);
  } else if(!list.length){
    html+='<div class="card"><div class="empty"><b>Sonuç yok</b>'+
      (lCat==="fav"?"Listede bir kelimenin yıldızına dokun, buraya düşsün.":"Başka bir kelime dene.")+'</div></div>';
  } else {
    html+='<div class="card">';
    var last="";
    list.forEach(function(w){
      if((lCat==="all"||lCat==="fav"||lQ)&&w.cat.name!==last){ last=w.cat.name; html+='<div class="grp">'+esc(last)+'</div>'; }
      html+='<div class="lrow"><div class="lw" data-k="'+w.key+'" style="cursor:pointer"><b>'+esc(w.w)+'</b>'+
        '<em>'+esc(w.pos)+' · '+w.lvl+'</em></div>'+
        '<div class="lm" data-k="'+w.key+'" style="cursor:pointer">'+esc(w.tr)+
        '<i>'+esc(w.aff)+'</i></div>'+
        '<button class="star" data-f="'+w.key+'" aria-pressed="'+(!!st.fav[w.key])+'">'+(st.fav[w.key]?"★":"☆")+'</button></div>';
    });
    html+='</div>';
  }
  el.innerHTML=html;
  var b=$("lback"); if(b) b.addEventListener("click",function(){ lOpen=null; renderList(); });
  el.querySelectorAll("[data-lc]").forEach(function(x){
    x.addEventListener("click",function(){ lCat=x.dataset.lc; lOpen=null; renderList(); });});
  el.querySelectorAll("[data-k]").forEach(function(x){
    x.addEventListener("click",function(){ lOpen=x.dataset.k; renderList(); });});
  el.querySelectorAll("[data-f]").forEach(function(x){
    x.addEventListener("click",function(ev){ ev.stopPropagation();
      var k=x.dataset.f; if(st.fav[k]) delete st.fav[k]; else st.fav[k]=1; save(); renderList(); });});
  var s=$("lsearch");
  s.addEventListener("input",function(){ var p=this.selectionStart; lQ=this.value.toLowerCase().trim(); lOpen=null; renderList();
    var n=$("lsearch"); if(n){n.focus(); try{n.setSelectionRange(p,p);}catch(e){}} });
}

/* ===================== İLERLEME ===================== */
function catStats(c){
  var l=0,s=0;
  c.items.forEach(function(it){ var x=st.srs[it.key]; if(x){s++; if(x.b>=3) l++;} });
  return {l:l,s:s,t:c.items.length};
}
function renderProg(){
  var L=learned(), S=started();
  var a2=WORDS.filter(function(w){return w.lvl==="A2";}), b1=WORDS.filter(function(w){return w.lvl==="B1";});
  var a2L=a2.filter(function(w){var x=st.srs[w.key];return x&&x.b>=3;}).length;
  var b1L=b1.filter(function(w){var x=st.srs[w.key];return x&&x.b>=3;}).length;
  var weak=WORDS.filter(function(w){var x=st.srs[w.key];return x&&x.b<=1;}).slice(0,12);
  var boxes=[0,0,0,0,0,0];
  for(var k in st.srs) boxes[st.srs[k].b]=(boxes[st.srs[k].b]||0)+1;
  $("v-prog").innerHTML=
   '<div class="card"><div class="lbl">Toplam</div>'+
     '<h1 class="mt num">'+L+' / '+TOTAL+'</h1><div class="sub">kelime öğrenildi</div>'+
     '<div class="bar ok" style="margin-top:11px"><i style="width:'+Math.max(Math.round(L/TOTAL*100),1)+'%"></i></div></div>'+
   '<div class="stats">'+
     '<div class="stat"><b class="num">'+a2L+'/'+a2.length+'</b><span>A2 öğrenildi</span></div>'+
     '<div class="stat"><b class="num">'+b1L+'/'+b1.length+'</b><span>B1 öğrenildi</span></div>'+
     '<div class="stat"><b class="num">'+streak()+'</b><span>gün serisi</span></div>'+
   '</div>'+
   '<div class="card"><div class="lbl">Tekrar kutuları</div>'+
     '<div class="sub mt" style="font-size:13px">Kutu numarası yükseldikçe kelime daha seyrek karşına çıkar: '+
     INT.map(function(d,i){return i+". kutu "+(d===0?"aynı gün":d+" gün");}).join(" · ")+'.</div>'+
     '<div style="margin-top:10px">'+boxes.map(function(n,i){
       return '<div class="pline"><span class="t">'+i+'. kutu</span>'+
         '<span class="bar'+(i>=3?" ok":"")+'"><i style="width:'+(S?Math.round(n/S*100):0)+'%"></i></span>'+
         '<span class="v">'+n+'</span></div>';}).join("")+'</div></div>'+
   (weak.length?'<div class="card"><div class="lbl">Zorlandıkların</div>'+
     '<div class="sub mt" style="font-size:13px">Alt kutularda kalan kelimeler. Bunlara daha sık döneceksin.</div>'+
     '<div style="margin-top:8px">'+weak.map(function(w){
       return '<div class="lrow"><div class="lw"><b>'+esc(w.w)+'</b><em>'+esc(w.pos)+' · '+w.lvl+'</em></div>'+
         '<div class="lm">'+esc(w.tr)+'</div></div>';}).join("")+'</div></div>':'')+
   '<div class="card"><div class="lbl">Tema tema</div><div style="margin-top:8px">'+
     CATS.map(function(c){var s=catStats(c);
       return '<div class="pline"><span class="t">'+esc(c.name)+'</span>'+
         '<span class="bar"><i style="width:'+Math.round(s.l/s.t*100)+'%"></i></span>'+
         '<span class="v">'+s.l+'/'+s.t+'</span></div>';}).join("")+
   '</div></div>';
}

/* ===================== BAŞLAT ===================== */
function renderAll(){
  if(view==="today") renderToday();
  else if(view==="study") renderStudy();
  else if(view==="quiz") renderQuiz();
  else if(view==="list") renderList();
  else if(view==="prog") renderProg();
}
renderToday();
</script>
