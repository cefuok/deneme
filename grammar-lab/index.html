<style>

  --b1:#A8471A; --b1s:#F8E6DC;
  --ok:#0E7462; --oks:#DCEFEA; --no:#B3261E; --nos:#FBE3E1;
  --f-disp:"Newsreader",Georgia,serif;
  --f-body:"Public Sans",system-ui,-apple-system,Segoe UI,sans-serif;

}

  --ink:#E8EBF5; --ink2:#A2AAC4; --ink3:#848CA6;
  --line:#242C45; --line2:#323C5A;
  --accent:#9095FF; --accent-ink:#0B0E1C; --accent-soft:#1E2347;
  --a2:#4FC2AC; --a2s:#0F2E29;
  --b1:#F0945F; --b1s:#33200F;
  --ok:#4FC2AC; --oks:#0F2E29; --no:#FF7A72; --nos:#331615;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A0D18; --surface:#121729; --surface2:#1B2237; --raise:#161D30;
  --ink:#E8EBF5; --ink2:#A2AAC4; --ink3:#848CA6;
  --line:#242C45; --line2:#323C5A;
  --accent:#9095FF; --accent-ink:#0B0E1C; --accent-soft:#1E2347;
  --a2:#4FC2AC; --a2s:#0F2E29;
  --b1:#F0945F; --b1s:#33200F;
  --ok:#4FC2AC; --oks:#0F2E29; --no:#FF7A72; --nos:#331615;

*{box-sizing:border-box}
html{height:100%;box-sizing:border-box;background:var(--surface)}
body{height:100%;margin:0;overflow:hidden;display:flex;flex-direction:column;
  background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}

.top{flex:0 0 auto;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{padding-left:var(--gut);padding-right:var(--gutr);padding-block:9px;display:flex;align-items:center;gap:9px}
.brand{font-family:var(--f-disp);font-weight:700;font-size:17px;letter-spacing:-.01em;line-height:1.05;margin-right:auto;min-width:0}
.brand span{display:block;font-family:var(--f-mono);font-size:9.5px;font-weight:500;letter-spacing:.11em;text-transform:uppercase;color:var(--ink3);margin-top:1px}
.iconbtn{width:34px;height:34px;border-radius:9px;border:1px solid var(--line2);display:grid;place-items:center;font-size:14px;flex:0 0 auto}
main{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.wrap{padding-left:var(--gut);padding-right:var(--gutr);padding-block:15px 30px;max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:13px}

.tab b{font-size:10.5px;font-weight:600}
.tab i{font-style:normal;font-size:16px;line-height:1}
.tab[aria-selected="true"]{color:var(--accent);background:var(--accent-soft)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.card.pad0{padding:0;overflow:hidden}

h1{font-size:27px;line-height:1.1}
h2{font-size:21px;line-height:1.15}
h3{font-size:17px;line-height:1.2}
h4{font-size:15px;line-height:1.25;font-weight:600}
.lbl{font-family:var(--f-mono);font-size:10px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;color:var(--ink3)}

.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:46px;padding:11px 15px;border-radius:10px;

.titem .pr{flex:0 0 auto;text-align:right}
.titem .pr b{display:block;font-family:var(--f-mono);font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums}
.titem .ring{width:30px;height:30px;border-radius:999px;display:grid;place-items:center;font-size:11px;font-weight:700;font-family:var(--f-mono)}

/* ders içeriği */
.prose p{margin:0 0 11px;font-size:15.5px;line-height:1.62}
.prose p:last-child{margin-bottom:0}
.prose strong{font-weight:700}
.prose code{font-family:var(--f-mono);font-size:13.5px;background:var(--surface2);padding:1px 5px;border-radius:5px}
.form{font-family:var(--f-mono);font-size:13.5px;font-weight:700;background:var(--accent-soft);color:var(--accent);

.gtab{width:100%;border-collapse:collapse;font-size:14px;margin:10px 0}

.gtab td{padding:8px 9px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.4}
.gtab tr:last-child td{border-bottom:0}
.gtab td:first-child{font-weight:600;white-space:nowrap}
.scrollx{overflow-x:auto;-webkit-overflow-scrolling:touch}
.extab{border:1px solid var(--line);border-radius:11px;overflow:hidden;margin-top:9px}
.extab div{padding:9px 12px;border-bottom:1px solid var(--line);background:var(--surface)}
.extab div:last-child{border-bottom:0}

.extab span{display:block;font-size:13.5px;color:var(--ink2);line-height:1.35}

.err div{padding:10px 12px;border-bottom:1px solid var(--line)}

.err .x s{text-decoration-color:var(--no)}
.err .v{color:var(--ok);font-weight:600;font-size:14.5px}

.callout{border-left:3px solid var(--accent);background:var(--accent-soft);padding:11px 13px;border-radius:0 10px 10px 0;font-size:14.5px;line-height:1.5}
.sec{margin-top:16px}
.sec:first-child{margin-top:0}
.sech{font-family:var(--f-disp);font-size:18px;font-weight:700;margin-bottom:8px;padding-bottom:6px;border-bottom:1.5px solid var(--line2)}

/* test */
.opt{display:block;width:100%;text-align:left;padding:12px 13px;border-radius:10px;border:1.5px solid var(--line);
  background:var(--surface);font-size:15.5px;font-weight:500;margin-bottom:7px;line-height:1.35}
.opt.right{border-color:var(--ok);background:var(--oks);font-weight:700}
.opt.wrong{border-color:var(--no);background:var(--nos)}
.opt[disabled]{cursor:default}
.fb{font-size:14px;padding:11px 12px;border-radius:10px;background:var(--surface2);color:var(--ink2);line-height:1.5}
.fb b{color:var(--ink)}
.fb.good{background:var(--oks);color:var(--ink)}
.fb.bad{background:var(--nos);color:var(--ink)}
.qtext{font-size:18px;font-weight:600;line-height:1.5;font-family:var(--f-body)}
.qtext u{text-decoration:none;border-bottom:2.5px solid var(--accent);padding:0 2px}
.hintp{font-family:var(--f-mono);font-size:13px;color:var(--accent);font-weight:700}
.bar{height:5px;border-radius:999px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .2s}
.qmeta{display:flex;justify-content:space-between;align-items:center;font-family:var(--f-mono);font-size:11.5px;color:var(--ink3);font-variant-numeric:tabular-nums}

/* kelime */
.fcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 16px;min-height:200px;
  display:flex;flex-direction:column;justify-content:center;gap:11px;text-align:center}
.fcard .w{font-family:var(--f-disp);font-size:30px;font-weight:700;line-height:1.1;display:block}
.fcard .m{font-size:19px;font-weight:600;color:var(--ok);display:block}
.fcard .s{font-size:14px;color:var(--ink2);border-top:1px dashed var(--line2);padding-top:10px;display:block;text-align:left;line-height:1.45}
.fcard .s em{display:block;font-style:normal;color:var(--ink3);font-size:13px;margin-top:2px}
.fcard .h{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);display:block}
.vrow{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.vrow:last-child{border-bottom:0}
.vrow .a{flex:0 0 38%;font-weight:600;font-size:15px;min-width:0}
.vrow .b{flex:1 1 auto;min-width:0;font-size:14px;color:var(--ink2)}
.vrow .b em{display:block;font-style:normal;font-size:12.5px;color:var(--ink3);margin-top:3px;line-height:1.4}

/* ilerleme */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.stat{background:var(--surface);padding:11px 10px;min-width:0}
.stat b{display:block;font-family:var(--f-disp);font-size:23px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{display:block;font-family:var(--f-mono);font-size:9px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);margin-top:2px}
.pline{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid var(--line)}
.pline:last-child{border-bottom:0}
.pline .t{flex:1 1 auto;min-width:0;font-size:14.5px;font-weight:500}
.pline .bar{flex:0 0 78px}
.pline .v{flex:0 0 42px;text-align:right;font-family:var(--f-mono);font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--ink2)}
.empty{text-align:center;padding:28px 14px;color:var(--ink2);line-height:1.55}
.empty b{display:block;font-family:var(--f-disp);font-size:18px;color:var(--ink);margin-bottom:6px}
.divider{height:1px;background:var(--line);margin:3px 0}
.inpw{display:flex;gap:7px;align-items:stretch}
.inpw .search{flex:1 1 auto;min-width:0;font-family:var(--f-mono);font-size:15px}
</style>

<script>
/* ============================================================
   GRAMMAR LAB - A2 & B1 tam dilbilgisi müfredatı
   Her konu: detaylı anlatım + tablolar + örnekler + sık hatalar
             + çoktan seçmeli (mc) + klasik boşluk doldurma (fill)
             + konu kelimeleri (voc)
   ============================================================ */
const TOPICS = [
/* ---------- A2-01 Present Simple ---------- */
{id:"a2-01",lvl:"A2",t:"Present Simple",sum:"Geniş zaman: rutinler, genel gerçekler, programlar.",
sec:[
{h:"Ne zaman kullanılır?",p:[
"<strong>1. Rutinler ve alışkanlıklar:</strong> her gün, her hafta tekrar eden işler. <em>I get up at seven.</em>",
"<strong>2. Genel gerçekler:</strong> her zaman doğru olan şeyler. <em>Water boils at 100 degrees.</em>",
"<strong>3. Kalıcı durumlar:</strong> uzun süredir devam eden hâller. <em>She lives in Ankara.</em>",
"<strong>4. Programlar ve tarifeler:</strong> uçak, tren, ders saatleri. <em>The train leaves at 6 p.m.</em>",
"<strong>5. Duygu ve düşünce fiilleri:</strong> like, want, know, believe, need gibi fiiller genelde Present Simple ile kullanılır."]},
{h:"Yapı",p:["Olumlu cümlede <strong>he / she / it</strong> öznesiyle fiile <strong>-s</strong> eklenir. Diğer tüm öznelerde fiil yalın kalır."],
form:["I / You / We / They + V1","He / She / It + V1 + s / es"],
tab:{head:["","Olumlu","Olumsuz","Soru"],rows:[
["I / You / We / They","I work","I <strong>don't</strong> work","<strong>Do</strong> I work?"],
["He / She / It","He work<strong>s</strong>","He <strong>doesn't</strong> work","<strong>Does</strong> he work?"]]}},
{h:"-s / -es yazım kuralları",p:["Çoğu fiile sadece <strong>-s</strong> eklenir: work → works, play → plays."],
tab:{head:["Fiil sonu","Ek","Örnek"],rows:[
["-s, -sh, -ch, -x, -o","<strong>-es</strong>","watch → watches, go → goes, fix → fixes"],
["ünsüz + y","y düşer, <strong>-ies</strong>","study → studies, carry → carries"],
["ünlü + y","sadece <strong>-s</strong>","play → plays, buy → buys"],
["have","düzensiz","have → <strong>has</strong>"]]}},
{h:"Olumsuz ve soru",p:[
"Olumsuzda ve soruda <strong>yardımcı fiil do / does</strong> kullanılır ve esas fiil <strong>yalın hâle</strong> döner. Yani <code>-s</code> yardımcı fiile geçer.",
"<em>He works</em> → <em>He <strong>doesn't work</strong></em> (doesn't works DEĞİL).",
"Kısa cevaplar: <em>Yes, I do. / No, I don't. / Yes, she does. / No, she doesn't.</em>"],
form:["don't / doesn't + V1","Do / Does + özne + V1 ?"]},
{h:"Sıklık zarflarıyla birlikte",p:[
"always, usually, often, sometimes, rarely, never gibi zarflar <strong>esas fiilden önce</strong>, ama <strong>be fiilinden sonra</strong> gelir.",
"<em>She <strong>always</strong> arrives early.</em> / <em>She <strong>is always</strong> early.</em>",
"every day, once a week, twice a month gibi ifadeler genelde cümlenin <strong>sonunda</strong> durur."]}],
ex:["I work in a bank.|Bir bankada çalışıyorum.",
"She studies English every evening.|Her akşam İngilizce çalışır.",
"My brother doesn't drink coffee.|Kardeşim kahve içmez.",
"Do you live near here?|Buralarda mı oturuyorsunuz?",
"Does the shop open on Sunday?|Dükkân pazar günü açılıyor mu?",
"Water freezes at zero degrees.|Su sıfır derecede donar.",
"The bus leaves at half past eight.|Otobüs sekiz buçukta kalkar.",
"He usually walks to work.|Genelde işe yürür.",
"They don't speak Turkish at home.|Evde Türkçe konuşmazlar.",
"My sister has two children.|Kız kardeşimin iki çocuğu var."],
err:["He go to school every day.|He <strong>goes</strong> to school every day.|he/she/it öznesinde fiile -s eklenir.",
"She doesn't works here.|She doesn't <strong>work</strong> here.|doesn't'tan sonra fiil yalın kalır.",
"Do he like tea?|<strong>Does</strong> he like tea?|he ile 'does' kullanılır.",
"I am work in a bank.|I <strong>work</strong> in a bank.|Present Simple'da 'am/is/are' kullanılmaz.",
"She studys hard.|She <strong>studies</strong> hard.|Ünsüz + y ise y düşer, -ies gelir."],
mc:[
{q:"My father ___ in a hospital.",o:["works","work","working","is work"],a:0,e:"'My father' = he -> works."},
{q:"We ___ television in the morning.",o:["don't watch","doesn't watch","not watch","don't watches"],a:0,e:"'We' ile don't, sonrasında yalın fiil."},
{q:"___ your sister speak English?",o:["Does","Do","Is","Has"],a:0,e:"'your sister' = she -> Does."},
{q:"The train ___ at 9:15 every morning.",o:["leaves","leave","is leaving","left"],a:0,e:"Tarife bildirir, Present Simple."},
{q:"She ___ her homework after dinner.",o:["does","do","doing","is do"],a:0,e:"she + do -> does."},
{q:"They ___ in Istanbul.",o:["live","lives","living","is living"],a:0,e:"'They' çoğul, fiil yalın."},
{q:"___ you drink tea in the morning?",o:["Do","Does","Are","Is"],a:0,e:"'you' ile Do."},
{q:"He ___ like spicy food.",o:["doesn't","don't","isn't","not"],a:0,e:"he ile doesn't."},
{q:"My mother ___ dinner every evening.",o:["cooks","cook","cooking","is cook"],a:0,e:"my mother = she -> cooks."},
{q:"Water ___ at 100 degrees Celsius.",o:["boils","boil","is boiling","boiled"],a:0,e:"Genel gerçek -> Present Simple."},
{q:"I ___ to the gym on Mondays.",o:["go","goes","am go","going"],a:0,e:"'I' ile fiil yalın."},
{q:"The shop ___ at eight o'clock.",o:["opens","open","is open","opening"],a:0,e:"Program bildirir -> opens."},
{q:"Ayse ___ have a car.",o:["doesn't","don't","hasn't","isn't"],a:0,e:"Present Simple olumsuzu: doesn't have."},
{q:"___ it rain a lot here?",o:["Does","Do","Is","Has"],a:0,e:"'it' ile Does."},
{q:"We ___ our grandparents every summer.",o:["visit","visits","are visit","visiting"],a:0,e:"'We' ile yalın fiil."},
{q:"He ___ his teeth twice a day.",o:["brushes","brushs","brush","brushing"],a:0,e:"-sh ile biten fiile -es eklenir."},

"<strong>1. Geçmişte belirli bir anda süren eylem:</strong> <em>At eight o'clock I was having dinner.</em>",
"<strong>2. Uzun eylem kesilirken:</strong> Uzun eylem Past Continuous, onu kesen kısa olay Past Simple olur. <em>I <strong>was walking</strong> home when it <strong>started</strong> to rain.</em>",
"<strong>3. Aynı anda süren iki eylem:</strong> <em>She was cooking while I was cleaning.</em>",
"<strong>4. Hikâye için arka plan:</strong> <em>The sun was shining and the birds were singing.</em>"]},
{h:"Yapı",form:["was / were + V-ing"],
tab:{head:["","Olumlu","Olumsuz","Soru"],rows:[
["I / He / She / It","I <strong>was</strong> working","I <strong>wasn't</strong> working","<strong>Was</strong> I working?"],
["You / We / They","We <strong>were</strong> working","We <strong>weren't</strong> working","<strong>Were</strong> we working?"]]}},
{h:"when ve while farkı",p:[
"<strong>when</strong> genelde <strong>kısa / ani</strong> olayla kullanılır ve Past Simple alır.",
"<strong>while</strong> genelde <strong>uzun / süren</strong> eylemle kullanılır ve Past Continuous alır.",
"<em>I <strong>was reading</strong> <u>when</u> the phone <strong>rang</strong>.</em>",
"<em><u>While</u> I <strong>was reading</strong>, the phone <strong>rang</strong>.</em>",
"İki cümle de aynı anlama gelir; sadece bağlacın yeri ve yapısı değişir."]},
{h:"Past Simple ile karşılaştırma",tab:{head:["Past Simple","Past Continuous"],rows:[
["Olay bitti, tamamlandı","Olay o anda sürüyordu"],
["<em>I read a book last night.</em> (bitirdim)","<em>I was reading a book at 9 p.m.</em> (okumaktaydım)"],
["Kısa, ani olay","Uzun, arka plan"],
["<em>She arrived at six.</em>","<em>She was waiting at six.</em>"]]}},
{h:"Dikkat",p:[
"Durum fiilleri (know, like, want, understand, belong) burada da <strong>-ing almaz</strong>: <em>I knew him.</em> ✓",
"Zaman ifadeleri: <strong>at 7 o'clock, at that moment, all day, all night, while, when, as</strong>."]}],

{id:"a2-05",lvl:"A2",t:"Present Perfect",sum:"have/has + V3: zamanı belirsiz geçmiş, deneyim, şimdiyi etkileyen sonuç.",
sec:[
{h:"Ne zaman kullanılır?",p:[
"<strong>1. Hayat deneyimi (ne zaman olduğu önemsiz):</strong> <em>I have been to Italy.</em>",
"<strong>2. Şimdiyi etkileyen geçmiş sonuç:</strong> <em>I have lost my keys.</em> (hâlâ bulamadım)",
"<strong>3. Yeni biten olay:</strong> <em>She has just finished her work.</em>",
"<strong>4. Devam eden dönem içinde olan şey:</strong> <em>I have seen him twice today.</em> (bugün henüz bitmedi)",
"<strong>5. Geçmişten şimdiye süren durum (for / since ile):</strong> <em>We have lived here for ten years.</em>"]},

/* ---------- A2-06 Future: will & be going to ---------- */
{id:"a2-06",lvl:"A2",t:"Future: will & be going to",sum:"Gelecek zamanın iki temel yolu ve hangisinin nerede kullanıldığı.",
sec:[
{h:"will ne zaman kullanılır?",p:[
"<strong>1. Konuşma anında verilen karar:</strong> <em>It's cold. I<strong>'ll</strong> close the window.</em>",
"<strong>2. Söz verme, teklif, rica:</strong> <em>I<strong>'ll</strong> help you.</em> / <em>I<strong>'ll</strong> call you tonight.</em>",
"<strong>3. Tahmin (kanıt olmadan, düşünceye dayalı):</strong> <em>I think it <strong>will</strong> rain tomorrow.</em>",
"<strong>4. Kesin gelecek gerçekler:</strong> <em>She <strong>will be</strong> twenty next month.</em>",
"Sık kullanılan kalıplar: I think / I hope / I'm sure / probably / maybe + will."],

{h:"be going to ne zaman kullanılır?",p:[

{h:"İyelik sıfatı vs. iyelik zamiri",p:[
"<strong>İyelik sıfatı</strong> isimden önce gelir: <em><strong>my</strong> car, <strong>their</strong> house</em>.",
"<strong>İyelik zamiri</strong> tek başına durur, isim almaz: <em>This car is <strong>mine</strong>.</em> (mine car ✗)",
"<em>Is this your bag?</em> → <em>Yes, it's <strong>mine</strong>.</em>"]},
{h:"its / it's karışıklığı",p:[
"<strong>its</strong> = onun (iyelik, kesme işareti YOK): <em>The dog wagged <strong>its</strong> tail.</em>",
"<strong>it's</strong> = it is / it has (kısaltma): <em><strong>It's</strong> raining.</em>",
"Aynı şekilde <strong>their</strong> (onların) / <strong>they're</strong> (they are) / <strong>there</strong> (orada) karıştırılmamalı.","Bu üçü İngilizcede en sık yapılan yazım hatasıdır."]},
{h:"Dönüşlü zamirler",p:[
"Özne ile nesne aynı kişiyse kullanılır: <em>She hurt <strong>herself</strong>.</em>",
"Vurgu için: <em>I made it <strong>myself</strong>.</em> (kendim yaptım)",
"<strong>by + dönüşlü zamir</strong> = tek başına: <em>He lives <strong>by himself</strong>.</em>"]},
{h:"'s ile iyelik (Saxon genitive)",p:[
"Kişi ve canlılarda <strong>'s</strong> kullanılır: <em>Ali<strong>'s</strong> car, my brother<strong>'s</strong> house</em>.",
"Çoğul -s ile biten isimlerde sadece kesme işareti: <em>the students<strong>'</strong> books</em>.",
"Cansız nesnelerde genelde <strong>of</strong> tercih edilir: <em>the door <strong>of</strong> the room</em>."]},

{h:"than ve the kullanımı",p:[
"Comparative'de karşılaştırılan şeyden önce <strong>than</strong> gelir: <em>She is taller <strong>than</strong> me.</em>",
"Superlative'den önce <strong>the</strong> gelir: <em>He is <strong>the</strong> tallest in the class.</em>",
"Superlative sonrası <strong>in</strong> (yer/grup) ya da <strong>of</strong> (süre/sayı): <em>the best <strong>in</strong> the world</em>, <em>the happiest day <strong>of</strong> my life</em>."]},
{h:"as ... as (eşitlik)",p:[
"<strong>as + sıfat + as</strong> = kadar: <em>He is <strong>as tall as</strong> his brother.</em>",
"Olumsuzu: <strong>not as/so ... as</strong> = kadar değil: <em>Today isn't <strong>as hot as</strong> yesterday.</em>"]},
{h:"Vurgulayıcılar",p:[
"Comparative'i güçlendirmek: <strong>much, far, a lot, slightly, a bit</strong> + comparative. <em>This is <strong>much</strong> better.</em>",
"<strong>very</strong> comparative ile KULLANILMAZ: <em>very better</em> ✗ → <em><strong>much</strong> better</em> ✓",
"Artan değişim: <strong>comparative and comparative</strong>: <em>It's getting <strong>colder and colder</strong>.</em>"]}],

{id:"a2-12",lvl:"A2",t:"Modallar 2: must, have to, should",sum:"Zorunluluk, yasak, gereklilik yokluğu ve tavsiye.",
sec:[
{h:"must",p:[
"<strong>Güçlü zorunluluk</strong>, genelde konuşanın kendi kararı ya da kural: <em>I <strong>must</strong> finish this today.</em>",
"Yazılı kurallarda çok yaygın: <em>Passengers <strong>must</strong> wear a seatbelt.</em>",
"<strong>must</strong> sadece şimdiki/gelecek için kullanılır. Geçmişte <strong>had to</strong> gerekir."]},
{h:"have to / has to",p:[
"<strong>Dış kaynaklı zorunluluk</strong>: kural, yasa, başkasının isteği. <em>I <strong>have to</strong> wear a uniform at work.</em>",
"Modal değildir, normal fiil gibi çekimlenir: <em>do/does/did</em> kullanır.",
"<em>Do you <strong>have to</strong> work on Saturdays?</em> / <em>She <strong>doesn't have to</strong> come.</em>"],
tab:{head:["Zaman","Olumlu","Olumsuz","Soru"],rows:[
["Şimdi","have/has to","don't/doesn't have to","Do/Does ... have to?"],
["Geçmiş","had to","didn't have to","Did ... have to?"],
["Gelecek","will have to","won't have to","Will ... have to?"]]}},
{h:"KRİTİK FARK: mustn't ve don't have to",p:[
"<strong>mustn't</strong> = <strong>YASAK</strong>. Yapmaman gerekir. <em>You <strong>mustn't</strong> park here.</em> (yasak)",
"<strong>don't have to</strong> = <strong>GEREK YOK</strong>. İstersen yap. <em>You <strong>don't have to</strong> park here.</em> (zorunlu değil)",
"Bu ikisi Türkçeye farklı çevrilir ve en çok karıştırılan konudur."]},
{h:"should / ought to",p:[
"<strong>should</strong> = tavsiye, doğru olan şey: <em>You <strong>should</strong> see a doctor.</em>",
"Olumsuz: <strong>shouldn't</strong> = yapmamalısın (tavsiye, yasak değil).",
"<strong>ought to</strong> aynı anlamdadır ama daha az kullanılır: <em>You <strong>ought to</strong> apologise.</em>",
"Soru: <em><strong>Should</strong> I call him?</em> = Arayayım mı?"]},
{h:"need to / needn't",p:[
"<strong>need to</strong> = ihtiyaç duymak: <em>I <strong>need to</strong> buy a ticket.</em>",
"<strong>needn't</strong> / <strong>don't need to</strong> = gerek yok (don't have to ile aynı anlam)."]},
{h:"Özet tablo",tab:{head:["Yapı","Anlam","Türkçe"],rows:[

["shouldn't","olumsuz tavsiye","-memeli"]]}}],

{h:"Future Continuous",p:[
"<strong>will be + V-ing</strong>. Gelecekte belirli bir anda devam edecek eylemi anlatır.",
"<em>At 8 p.m. tomorrow we <strong>will be having</strong> dinner.</em>",
"Ayrıca kibar soru sormak için kullanılır: <em><strong>Will you be using</strong> the car tonight?</em> (Arabayı kullanacak mısın? — baskısız soru)"],
form:["will be + V-ing"]},
{h:"Future Perfect",p:[
"<strong>will have + V3</strong>. Gelecekteki bir noktaya kadar tamamlanmış olacak eylemi anlatır.",
"Hemen her zaman <strong>by</strong> ile kullanılır: by then, by next year, by the time you arrive.",
"<em><strong>By the time</strong> you arrive, I <strong>will have finished</strong> everything.</em>"],
form:["will have + V3","will have been + V-ing (Future Perfect Continuous)"]},
{h:"Present Continuous vs going to",p:[
"<strong>Present Continuous</strong>: düzenleme yapılmış, randevu alınmış, bilet alınmış. <em>I<strong>'m flying</strong> to Berlin on Monday.</em>",
"<strong>going to</strong>: niyet var, düzenleme şart değil. <em>I<strong>'m going to</strong> learn Italian.</em>",
"Pratikte çoğu durumda ikisi de kabul edilir."]},
{h:"Zaman cümleciklerinde will yok",p:[
"<strong>when, as soon as, before, after, until, by the time, once, if</strong> sonrası Present Simple ya da Present Perfect gelir.",
"<em>I'll call you <strong>when I get</strong> there.</em> / <em>We'll leave <strong>once he has arrived</strong>.</em>"]},
{h:"be about to / be due to",p:[
"<strong>be about to + V1</strong> = tam yapmak üzere: <em>The film <strong>is about to</strong> start.</em>",
"<strong>be due to + V1</strong> = planlanan zamanda olması bekleniyor: <em>The train <strong>is due to</strong> arrive at six.</em>"]}],

{id:"b1-06",lvl:"B1",t:"Third & Mixed Conditionals",sum:"Geçmişte olmamış durumlar ve pişmanlıklar; karma koşul cümleleri.",
sec:[
{h:"Third Conditional",p:[
"<strong>Geçmişte olmamış</strong> bir durumu ve onun olmamış sonucunu anlatır. Genelde <strong>pişmanlık</strong> ya da <strong>eleştiri</strong> bildirir.",
"Türkçesi: '<strong>-seydi ... -irdi / -mış olurdu</strong>'. 'Çalışsaydım geçerdim (ama çalışmadım, geçmedim).'"],
form:["If + Past Perfect, would have + V3"],
tab:{head:["","Örnek","Gerçek"],rows:[

["<em>If she <strong>hadn't missed</strong> the train, she <strong>wouldn't have been</strong> late.</em>","Treni kaçırmasaydı geç kalmazdı.","Kaçırdı, geç kaldı."],
["<em>What <strong>would</strong> you <strong>have done</strong>?</em>","Sen ne yapardın?","—"]]}},
{h:"Üç koşul cümlesinin karşılaştırması",tab:{head:["Tür","Yapı","Zaman","Örnek"],rows:[
["First","if + Present, will + V1","gelecek, gerçekçi","<em>If it rains, I'll stay in.</em>"],
["Second","if + Past, would + V1","şimdi/gelecek, hayalî","<em>If it rained, I'd stay in.</em>"],
["Third","if + Past Perfect, would have + V3","geçmiş, olmamış","<em>If it had rained, I'd have stayed in.</em>"]]}},
{h:"would have yerine kullanılabilenler",p:[
"<strong>could have + V3</strong> = yapabilirdi: <em>If you had told me, I <strong>could have helped</strong>.</em>",
"<strong>might have + V3</strong> = belki olurdu: <em>If we had left earlier, we <strong>might have caught</strong> it.</em>",
"DİKKAT: 'if' kısmında <strong>would have KULLANILMAZ</strong>: <em>If I would have known</em> ✗ → <em>If I <strong>had</strong> known</em> ✓"]},
{h:"Mixed Conditional (karma koşul)",p:[
"İki kısım farklı zamanlara ait olduğunda kullanılır. İki yaygın tipi vardır:",
"<strong>Tip 1 — Geçmiş koşul → şimdiki sonuç:</strong> if + Past Perfect, <strong>would + V1</strong>",
"<em>If I <strong>had studied</strong> medicine, I <strong>would be</strong> a doctor now.</em> (Geçmişte okumadım, bugün doktor değilim.)",
"<strong>Tip 2 — Şimdiki koşul → geçmiş sonuç:</strong> if + Past Simple, <strong>would have + V3</strong>",
"<em>If I <strong>were</strong> more careful, I <strong>wouldn't have broken</strong> it.</em> (Dikkatli biri değilim, o yüzden kırdım.)"],
tab:{head:["Tip","Koşul","Sonuç","Örnek"],rows:[

"<strong>If I'd known</strong> = If I had known. <strong>I'd have told you</strong> = I would have told you."]}],

{id:"b1-07",lvl:"B1",t:"wish, If only & would rather",sum:"Keşke yapıları: şimdiki pişmanlık, geçmiş pişmanlık ve şikâyet.",
sec:[
{h:"Üç temel kullanım",tab:{head:["Yapı","Zaman","Anlam","Örnek"],rows:[
["wish + <strong>Past Simple</strong>","şimdi","Şimdiki duruma pişmanlık","<em>I wish I <strong>had</strong> more time.</em> (yok)"],
["wish + <strong>Past Perfect</strong>","geçmiş","Geçmişe pişmanlık","<em>I wish I <strong>had studied</strong>.</em> (çalışmadım)"],
["wish + <strong>would</strong>","gelecek/şikâyet","Başkasının davranışından şikâyet","<em>I wish he <strong>would stop</strong> shouting.</em>"]]},
p:["Türkçede hepsi '<strong>keşke</strong>' ile çevrilir, bu yüzden hangisinin kullanılacağı dikkat ister."]},
{h:"wish + Past Simple (şimdiki durum)",p:[
"Şu anki gerçeği beğenmiyorsan kullanılır. Cümle geçmiş zamanda ama <strong>anlam şimdi</strong>dir.",
"<em>I <strong>wish</strong> I <strong>knew</strong> the answer.</em> = Keşke cevabı bilsem. (bilmiyorum)",
"<em>She <strong>wishes</strong> she <strong>lived</strong> nearer.</em> = Keşke daha yakın otursa.",
"<strong>be</strong> fiilinde genelde <strong>were</strong> kullanılır: <em>I wish I <strong>were</strong> taller.</em>"]},
{h:"wish + Past Perfect (geçmiş pişmanlık)",p:[
"Geçmişte yaptığın ya da yapmadığın bir şeye pişmansan kullanılır.",
"<em>I <strong>wish</strong> I <strong>hadn't said</strong> that.</em> = Keşke onu söylemeseydim.",
"<em>He <strong>wishes</strong> he <strong>had taken</strong> the job.</em> = Keşke o işi kabul etseymiş."]},
{h:"wish + would (şikâyet)",p:[
"Başka birinin <strong>can sıkıcı davranışının değişmesini</strong> istediğinde kullanılır.",
"<em>I wish you <strong>would listen</strong> to me.</em> = Keşke beni dinlesen.",
"<em>I wish it <strong>would stop</strong> raining.</em>",
"<strong>ÖNEMLİ KURAL:</strong> Kendin için <em>wish I would</em> KULLANILMAZ. <em>I wish I would be rich</em> ✗ → <em>I wish I <strong>were</strong> rich</em> ✓"]},
{h:"If only",p:[
"<strong>If only</strong> ile <strong>wish</strong> aynı yapıları alır; If only daha güçlü ve duygusaldır.",
"<em><strong>If only</strong> I had more money!</em> / <em><strong>If only</strong> I hadn't lost it!</em>"]},
{h:"would rather & had better",p:[
"<strong>would rather + V1</strong> = tercih ederim: <em>I'<strong>d rather</strong> stay at home.</em>",
"<strong>would rather + özne + Past Simple</strong> = birinin bir şey yapmasını tercih etmek: <em>I'<strong>d rather</strong> you <strong>didn't</strong> smoke here.</em>",
"<strong>had better + V1</strong> = -sen iyi olur (uyarı): <em>You'<strong>d better</strong> leave now.</em> Olumsuzu: <strong>had better not</strong>."]},
{h:"hope ve wish farkı",p:[
"<strong>hope</strong> = gerçekleşmesi mümkün olan dilek, normal zaman alır: <em>I <strong>hope</strong> you <strong>pass</strong> the exam.</em>",
"<strong>wish</strong> = gerçek dışı ya da olmamış durum: <em>I <strong>wish</strong> I <strong>had passed</strong> the exam.</em>"]}],

{id:"b1-08",lvl:"B1",t:"Edilgen Yapı (Passive Voice)",sum:"be + V3: bütün zamanlarda edilgen çatı, by ile fail, get-passive.",
sec:[
{h:"Ne zaman kullanılır?",p:[
"<strong>1. Eylemi kimin yaptığı bilinmiyor:</strong> <em>My bike <strong>was stolen</strong>.</em>",
"<strong>2. Kimin yaptığı önemsiz:</strong> <em>The bridge <strong>was built</strong> in 1890.</em>",
"<strong>3. Eylem failden daha önemli:</strong> <em>The meeting <strong>has been cancelled</strong>.</em>",
"<strong>4. Resmî dil ve bilimsel yazım:</strong> haber dili, rapor, talimatlar.",
"Türkçedeki '<strong>-il / -in</strong>' ekine denk gelir: yapıldı, gönderildi, söylendi."]},

{h:"Etkenden edilgene çevirme",p:[

"<strong>2.</strong> Fiil <strong>be + V3</strong> biçimine girer; be, orijinal zamanı taşır.",
"<strong>3.</strong> Eski özne gerekiyorsa sona <strong>by</strong> ile eklenir.",
"<em><u>Shakespeare</u> wrote <u>Hamlet</u>.</em> → <em><u>Hamlet</u> <strong>was written</strong> <u>by Shakespeare</u>.</em>"]},
{h:"by ne zaman kullanılır?",p:[
"Fail <strong>önemli ya da şaşırtıcı</strong> ise 'by' ile belirtilir: <em>The painting was stolen <strong>by</strong> a former employee.</em>",
"Fail <strong>belirsiz</strong> (someone, people, they) ise 'by' <strong>kullanılmaz</strong>: <em>My wallet was stolen.</em> (by someone gereksiz)",
"Araç/malzeme için <strong>with</strong> kullanılır: <em>It was cut <strong>with</strong> a knife.</em>"]},
{h:"İki nesneli fiiller",p:[
"give, send, tell, offer, show, teach, pay gibi fiillerde iki edilgen biçim kurulabilir:",
"<em>They gave <u>me</u> <u>a prize</u>.</em> → <em><strong>I was given</strong> a prize.</em> (daha yaygın)",
"→ <em><strong>A prize was given</strong> to me.</em>"]},
{h:"get-passive ve kişisel olmayan yapı",p:[

"Haber dilinde: <strong>It is said that ...</strong> / <strong>He is said to be ...</strong>",

"'say to someone' de mümkündür ama daha az kullanılır: <em>He said to me that...</em>"]},
{h:"Soruların aktarımı",p:[
"<strong>1. Soru kelimesi varsa</strong> o kelime korunur ve <strong>düz cümle sırası</strong> kullanılır:",

"<strong>2. Evet/hayır sorusu ise</strong> araya <strong>if / whether</strong> girer:",
"<em>'Are you coming?'</em> → <em>She asked <strong>if I was coming</strong>.</em>",
"Her iki durumda da <strong>do/does/did kullanılmaz</strong> ve soru işareti konmaz."],

{id:"b1-11",lvl:"B1",t:"Çıkarım Modalları (Deduction)",sum:"must / might / could / may / can't be: kanıta dayalı tahmin.",
sec:[
{h:"Mantık",p:[
"Bir şeyden emin olmadığımızda, elimizdeki kanıta göre <strong>ne kadar emin olduğumuzu</strong> modal fiille belirtiriz.",
"Bu, zorunluluk anlamındaki must'tan <strong>tamamen farklı</strong> bir kullanımdır."],
tab:{head:["Modal","Emin olma düzeyi","Anlam","Örnek"],rows:[
["<strong>must be</strong>","%95 eminim (olumlu)","kesin öyledir","<em>He <strong>must be</strong> tired.</em>"],
["<strong>may / might / could be</strong>","%30-50 ihtimal","olabilir","<em>She <strong>might be</strong> at home.</em>"],
["<strong>may not / might not</strong>","olmayabilir","olmayabilir","<em>He <strong>might not</strong> know.</em>"],
["<strong>can't be</strong>","%95 eminim (olumsuz)","imkânsız, olamaz","<em>That <strong>can't be</strong> right.</em>"]]}},
{h:"EN KRİTİK NOKTA: must not ≠ can't",p:[
"Çıkarımda <strong>must</strong>'ın olumsuzu <strong>mustn't</strong> DEĞİL, <strong>can't</strong>'tir.",
"<em>He must be at home.</em> (Evde olmalı) → olumsuzu → <em>He <strong>can't</strong> be at home.</em> (Evde olamaz)",
"<em>He mustn't be at home</em> ✗ (bu 'evde olmamalı' yani yasak anlamına gelir)"]},
{h:"Devam eden eylem için",p:[
"<strong>must / might / can't + be + V-ing</strong> yapısı kullanılır.",
"<em>The lights are on. They <strong>must be watching</strong> TV.</em>",
"<em>She isn't answering. She <strong>might be sleeping</strong>.</em>"]},
{h:"Geçmiş için çıkarım",p:[
"<strong>must have + V3</strong> = kesin olmuştur: <em>The ground is wet. It <strong>must have rained</strong>.</em>",
"<strong>might / may / could have + V3</strong> = olmuş olabilir: <em>He <strong>might have forgotten</strong>.</em>",
"<strong>can't / couldn't have + V3</strong> = olmuş olamaz: <em>She <strong>can't have seen</strong> me; I was at home.</em>"],
form:["must / might / can't + have + V3"]},
{h:"Sık kullanılan kanıt ifadeleri",p:[
"<em>Judging by..., Looking at..., Given that..., The lights are on, so..., She isn't answering, so...</em>",
"Konuşmada 'must be' çok yaygındır: <em>You <strong>must be</strong> joking!</em> (Şaka yapıyorsun herhâlde!) / <em>You <strong>must be</strong> Ahmet.</em>"]}],

{id:"b1-12",lvl:"B1",t:"Geçmiş Modallar: should have, could have",sum:"Geçmişe yönelik eleştiri, pişmanlık ve kaçırılmış imkânlar.",
sec:[
{h:"Genel yapı",form:["modal + have + V3"],
p:["Bütün geçmiş modallar aynı kalıbı kullanır. Konuşmada <strong>should've, could've, would've, must've</strong> olarak kısalır."]},
{h:"should have + V3",p:[
"<strong>Yapılması gerekirdi ama yapılmadı</strong>: pişmanlık ya da eleştiri bildirir.",
"<em>I <strong>should have studied</strong> harder.</em> (çalışmadım, pişmanım)",
"<em>You <strong>should have told</strong> me!</em> (söylemedin, eleştiriyorum)",
"Olumsuz: <strong>shouldn't have + V3</strong> = yapmamalıydı ama yaptı.",
"<em>I <strong>shouldn't have said</strong> that.</em> (söyledim, pişmanım)"]},
{h:"could have + V3",p:[
"<strong>Yapma imkânı vardı ama yapılmadı</strong>: <em>You <strong>could have called</strong> me.</em> (arayabilirdin, aramadın)",
"Ayrıca <strong>geçmiş olasılık</strong> bildirir: <em>He <strong>could have missed</strong> the train.</em> (kaçırmış olabilir)",
"<strong>couldn't have + V3</strong> = yapması imkânsızdı / olmuş olamaz."]},
{h:"would have + V3",p:[
"Koşul gerçekleşseydi olacak olan şey (third conditional):",
"<em>I <strong>would have come</strong>, but I was ill.</em> (gelirdim ama hastaydım)"]},
{h:"must have / can't have",p:[
"<strong>must have + V3</strong> = kesin olmuştur (çıkarım): <em>She <strong>must have forgotten</strong>.</em>",
"<strong>can't have + V3</strong> = olmuş olamaz: <em>He <strong>can't have finished</strong> already.</em>"]},
{h:"needn't have vs didn't need to",p:[
"<strong>needn't have + V3</strong> = yaptı ama gerek yokmuş: <em>You <strong>needn't have bought</strong> bread; we had some.</em> (aldı)",
"<strong>didn't need to + V1</strong> = gerek yoktu (genelde yapmadı): <em>I <strong>didn't need to go</strong>, so I stayed home.</em>",
"Bu ikisi arasındaki fark sınavlarda sık sorulur."]},

"<em>There <strong>used to be</strong> a cinema here.</em> = Burada eskiden sinema vardı.",

form:["used to + V1","didn't use to + V1","Did + özne + use to + V1?"]},
{h:"be used to + V-ing (alışkın olmak)",p:[
"Bir şeye <strong>alışkın olmak</strong>, artık yabancı gelmemek. Buradaki 'to' bir <strong>edattır</strong>, bu yüzden sonrasına <strong>-ing</strong> ya da isim gelir.",
"<em>I <strong>am used to getting</strong> up early.</em> = Erken kalkmaya alışkınım.",
"<em>She <strong>isn't used to</strong> the cold weather.</em> = Soğuk havaya alışkın değil.",

"<strong>so much / so many</strong> + isim: <em><strong>so much</strong> work, <strong>so many</strong> people</em>",

/* ===================== YARDIMCILAR ===================== */
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function $(id){return document.getElementById(id);}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function pad(n){return n<10?"0"+n:""+n;}
function todayKey(){var d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function norm(s){
  return String(s).toLowerCase().trim()
   .replace(/[‘’ʼ]/g,"'").replace(/[“”]/g,'"')
   .replace(/\s+/g," ").replace(/[.!?]+$/,"").trim();
}

var BYID={}, QCOUNT={};
TOPICS.forEach(function(t){
  BYID[t.id]=t;
  t.mc=t.mc||[]; t.fill=t.fill||[]; t.voc=t.voc||[];
  QCOUNT[t.id]=t.mc.length+t.fill.length+t.voc.length;
});
var TOT_Q=TOPICS.reduce(function(a,t){return a+QCOUNT[t.id];},0);
var TOT_VOC=TOPICS.reduce(function(a,t){return a+t.voc.length;},0);

/* ===================== DURUM ===================== */
var LS="glab.v1";
var st={read:{},a:{},fav:{},log:{},updatedAt:0};
try{var raw=localStorage.getItem(LS); if(raw){var o=JSON.parse(raw);
  st.read=o.read||{}; st.a=o.a||{}; st.fav=o.fav||{}; st.log=o.log||{}; st.updatedAt=o.updatedAt||0;}}catch(e){}

function qkey(tid,type,i){return tid+"|"+type+"|"+i;}
function topicRight(tid){
  var n=0,t=BYID[tid];
  ["mc","fill","voc"].forEach(function(ty){
    for(var i=0;i<t[ty].length;i++) if(st.a[qkey(tid,ty,i)]===1) n++;
  });
  return n;
}
function topicPct(tid){var q=QCOUNT[tid]; return q?Math.round(topicRight(tid)/q*100):0;}
function totalRight(){var n=0; TOPICS.forEach(function(t){n+=topicRight(t.id);}); return n;}
function answeredCount(){return Object.keys(st.a).length;}
function bump(f,n){var d=todayKey(),l=st.log[d]||{q:0,r:0};l[f]=(l[f]||0)+(n||1);st.log[d]=l;}
function streak(){
  var n=0,d=new Date();
  var k=todayKey(); var l=st.log[k];
  if(!l||!(l.q>0)) d.setDate(d.getDate()-1);
  for(var i=0;i<400;i++){
    var key=d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
    var e=st.log[key];
    if(e&&e.q>0){n++; d.setDate(d.getDate()-1);} else break;
  }
  return n;
}
function save(){
  st.updatedAt=Date.now();
  try{localStorage.setItem(LS,JSON.stringify(st));}catch(e){}
  pushRemote();
}
function record(tid,type,i,ok){
  var k=qkey(tid,type,i);
  if(ok) st.a[k]=1; else if(st.a[k]!==1) st.a[k]=0;
  bump("q"); if(ok) bump("r");
  save();
}

/* ===================== SENKRON ===================== */
var db=null, uid=null, pushT=null, writing=false, dirty=false;
function setSync(m){
  var c=$("syncB");
  if(m==="sync"){c.textContent="senkron"; c.className="badge a2";}
  else if(m==="wait"){c.textContent="bağlanıyor"; c.className="badge b1";}
  else {c.textContent="bu cihaz"; c.className="badge b1";}
}
function mergeRemote(r){
  if(!r) return;
  var ra=r.a||{}; for(var k in ra){ if(ra[k]===1||st.a[k]===undefined) st.a[k]=ra[k]; }
  var rr=r.read||{}; for(var k2 in rr) st.read[k2]=rr[k2];
  var rf=r.fav||{}; for(var k3 in rf) st.fav[k3]=rf[k3];
  var rl=r.log||{};
  for(var d in rl){var x=rl[d]||{},y=st.log[d];
    st.log[d]= y?{q:Math.max(x.q|0,y.q|0),r:Math.max(x.r|0,y.r|0)}:x;}
  try{localStorage.setItem(LS,JSON.stringify(st));}catch(e){}
}
function doWrite(){
  if(!db||!uid||writing) return;
  writing=true; dirty=false;
  db.doc("data/users/"+uid+"/progress")
    .set({read:st.read,a:st.a,fav:st.fav,log:st.log,updatedAt:Date.now()})
    .then(function(){writing=false; if(dirty) doWrite();})
    .catch(function(){writing=false;});
}
function pushRemote(){ if(!db||!uid) return; dirty=true; clearTimeout(pushT); pushT=setTimeout(doWrite,1800); }
(function(){
  if(!window.claude||!window.claude.use){ setSync("local"); return; }
  setSync("wait");
  var done=false, guard=setTimeout(function(){ if(!done) setSync("local"); },11000);
  Promise.all([claude.use("db"),claude.use("user")]).then(function(r){
    var d=r[0],u=r[1];
    if(!d||!u){done=true;clearTimeout(guard);setSync("local");return;}
    return u.id().then(function(id){
      if(!id){done=true;clearTimeout(guard);setSync("local");return;}
      db=d; uid=id;
      return db.doc("data/users/"+id+"/progress").get().then(function(sn){
        done=true; clearTimeout(guard);
        if(sn.exists) mergeRemote(sn.data());
        setSync("sync"); renderAll(); doWrite();
      });
    });
  }).catch(function(){done=true;clearTimeout(guard);setSync("local");});
})();
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="hidden"&&dirty)doWrite();});

var VIEWS=["topics","lesson","drill","vocab","prog"];
var view="topics", openId=null;
function show(v){
  VIEWS.forEach(function(x){ $("v-"+x).hidden = (x!==v); });
  var tabFor = (v==="lesson")?"topics":v;
  document.querySelectorAll(".tab").forEach(function(t){ t.setAttribute("aria-selected",String(t.dataset.v===tabFor)); });
  view=v; $("main").scrollTop=0;
}
function go(v){
  if(v==="topics") openId=null;
  show(v);
  if(v==="topics") renderTopics();
  if(v==="lesson") renderLesson();
  if(v==="drill") renderDrill();
  if(v==="vocab") renderVocab();
  if(v==="prog") renderProg();
}
document.querySelectorAll(".tab").forEach(function(t){ t.addEventListener("click",function(){ go(t.dataset.v); }); });

var lvlFilter="all", tSearch="";
function ring(p){
  var col = p>=80?"var(--a2)":(p>=40?"var(--b1)":"var(--line2)");
  var bg  = p>=80?"var(--a2s)":(p>=40?"var(--b1s)":"var(--surface2)");
  var fg  = p>=40?col:"var(--ink3)";
  return '<span class="ring" style="background:'+bg+';color:'+fg+'">'+p+'</span>';
}
function renderTopics(){
  var list=TOPICS.filter(function(t){
    if(lvlFilter!=="all" && t.lvl!==lvlFilter) return false;
    if(tSearch){ return (t.t+" "+t.sum).toLowerCase().indexOf(tSearch)>=0; }
    return true;
  });
  var a2=TOPICS.filter(function(t){return t.lvl==="A2";}), b1=TOPICS.filter(function(t){return t.lvl==="B1";});
  var doneA2=a2.filter(function(t){return topicPct(t.id)>=80;}).length;
  var doneB1=b1.filter(function(t){return topicPct(t.id)>=80;}).length;

  var html=
   '<div class="card"><div class="lbl">Müfredat</div>'+
   '<h1 class="mt">A2 → B1 Dilbilgisi</h1>'+
   '<div class="sub mt">'+TOPICS.length+' konu · '+TOT_Q+' soru · '+TOT_VOC+' kelime. Her konuda konu anlatımı, örnekler, sık hatalar, çoktan seçmeli test, klasik boşluk doldurma ve kelime çalışması var.</div>'+
   '<div class="stats" style="margin-top:13px">'+
     '<div class="stat"><b class="num">'+doneA2+"/"+a2.length+'</b><span>A2 bitti</span></div>'+
     '<div class="stat"><b class="num">'+doneB1+"/"+b1.length+'</b><span>B1 bitti</span></div>'+
     '<div class="stat"><b class="num">'+totalRight()+'</b><span>doğru soru</span></div>'+
   '</div></div>'+
   '<input class="search" id="tSearch" type="search" placeholder="Konu ara: present perfect, passive, modal..." value="'+esc(tSearch)+'" autocomplete="off">'+
   '<div class="chips">'+
     '<button class="pick" data-l="all" aria-pressed="'+(lvlFilter==="all")+'">Tümü</button>'+
     '<button class="pick" data-l="A2" aria-pressed="'+(lvlFilter==="A2")+'">A2 ('+a2.length+')</button>'+
     '<button class="pick" data-l="B1" aria-pressed="'+(lvlFilter==="B1")+'">B1 ('+b1.length+')</button>'+
   '</div>';

  if(!list.length){
    html+='<div class="card"><div class="empty"><b>Sonuç yok</b>Başka bir kelime dene: perfect, modal, passive, conditional, article...</div></div>';
  } else {
    var lastLvl="";
    html+='<div class="tlist">';
    list.forEach(function(t,i){
      if(t.lvl!==lastLvl){ lastLvl=t.lvl;
        html+='<div class="lbl" style="padding:10px 2px 2px">'+(t.lvl==="A2"?"A2 — Temel seviye":"B1 — Orta seviye")+'</div>'; }
      var p=topicPct(t.id);
      html+='<button class="titem" data-id="'+t.id+'">'+
        '<span class="n">'+(t.id.split("-")[1])+'</span>'+
        '<span class="tt"><b>'+esc(t.t)+'</b><em>'+esc(t.sum)+'</em></span>'+
        ring(p)+'</button>';
    });
    html+='</div>';
  }
  $("v-topics").innerHTML=html;
  $("v-topics").querySelectorAll(".titem").forEach(function(b){
    b.addEventListener("click",function(){ openId=b.dataset.id; go("lesson"); });
  });
  $("v-topics").querySelectorAll(".pick").forEach(function(b){
    b.addEventListener("click",function(){ lvlFilter=b.dataset.l; renderTopics(); });
  });
  var s=$("tSearch");
  s.addEventListener("input",function(){ tSearch=this.value.toLowerCase().trim(); var pos=this.selectionStart; renderTopics();
    var ns=$("tSearch"); if(ns){ns.focus(); try{ns.setSelectionRange(pos,pos);}catch(e){}} });
}

     '<span class="badge '+(t.lvl==="A2"?"a2":"b1")+'">'+t.lvl+'</span>'+
     '<h1 style="margin-top:8px">'+esc(t.t)+'</h1>'+
     '<div class="sub mt">'+esc(t.sum)+'</div>'+
     '<div class="bar" style="margin-top:12px"><i style="width:'+p+'%"></i></div>'+
     '<div class="qmeta mt"><span>'+topicRight(t.id)+" / "+QCOUNT[t.id]+' soru doğru</span><span>%'+p+'</span></div>'+
   '</div>'+
   '<div class="card">'+secs+'</div>'+
   '<div class="card"><div class="lbl">Örnek cümleler</div><div class="extab">'+
     t.ex.map(function(e){var q=e.split("|");return "<div><b>"+esc(q[0])+"</b><span>"+esc(q[1]||"")+"</span></div>";}).join("")+
   '</div></div>'+
   (t.err&&t.err.length?'<div class="card"><div class="lbl">Sık yapılan hatalar</div><div class="err">'+
     t.err.map(function(e){var q=e.split("|");
       return '<div><div class="x">✗ <s>'+esc(q[0])+'</s></div><div class="v">✓ '+q[1]+'</div>'+
       (q[2]?'<div class="w">'+q[2]+'</div>':'')+'</div>';}).join("")+'</div></div>':'')+
   '<div class="card"><div class="lbl">Alıştırma</div>'+
     '<div class="btnrow" style="margin-top:10px">'+
       '<button class="btn" data-run="mc">Test ('+t.mc.length+')</button>'+
       '<button class="btn ghost" data-run="fill">Klasik ('+t.fill.length+')</button>'+
       '<button class="btn ghost" data-run="voc">Kelime ('+t.voc.length+')</button>'+
     '</div>'+
     '<div class="sub" style="margin-top:9px;font-size:13px">Toplam '+QCOUNT[t.id]+' soru. Yanlışların bir sonraki turda tekrar karşına çıkar.</div>'+
   '</div>';
  $("back").addEventListener("click",function(){ go("topics"); });
  $("v-lesson").querySelectorAll("[data-run]").forEach(function(b){
    b.addEventListener("click",function(){ startDrill(t.id,b.dataset.run); });
  });
}

/* ===================== ÇALIŞ (TEST) ===================== */
var dScope="all", dLvl="all", dType="mc", queue=null, qi=0, ans=null, sessRight=0, sessTotal=0;

function buildQueue(scope,type){
  var pool=[];
  var ts = scope==="all" ? TOPICS.filter(function(t){return dLvl==="all"||t.lvl===dLvl;}) : [BYID[scope]];
  ts.forEach(function(t){
    if(!t) return;
    t[type].forEach(function(q,i){ pool.push({t:t,type:type,i:i,q:q}); });
  });
  var fresh=pool.filter(function(x){ return st.a[qkey(x.t.id,type,x.i)]!==1; });
  var use = fresh.length? fresh : pool;
  shuffle(use);
  return use.slice(0, scope==="all"?20:use.length);
}
function startDrill(scope,type){
  dScope=scope; dType=type;
  queue=buildQueue(scope,type); qi=0; ans=null; sessRight=0; sessTotal=0;
  show("drill"); renderDrill();
}
function vocParts(v){var p=v.split("|");return {w:p[0],m:p[1]||"",ex:p[2]||"",tr:p[3]||""};}

function renderDrill(){
  var el=$("v-drill");
  if(!queue){
    var ts=TOPICS.filter(function(t){return dLvl==="all"||t.lvl===dLvl;});
    el.innerHTML=
      '<div class="card"><div class="lbl">Karışık çalışma</div>'+
      '<h2 class="mt">Soru çek</h2>'+
      '<div class="sub mt">Seviyeyi ve soru türünü seç, 20 soruluk bir tur başlasın. Daha önce doğru yaptığın sorular en sona bırakılır.</div>'+
      '<div class="chips" style="margin-top:12px">'+
        '<button class="pick" data-dl="all" aria-pressed="'+(dLvl==="all")+'">Tümü</button>'+
        '<button class="pick" data-dl="A2" aria-pressed="'+(dLvl==="A2")+'">A2</button>'+
        '<button class="pick" data-dl="B1" aria-pressed="'+(dLvl==="B1")+'">B1</button>'+
      '</div>'+
      '<div class="btnrow" style="margin-top:13px">'+
        '<button class="btn" data-go="mc">Test</button>'+
        '<button class="btn ghost" data-go="fill">Klasik</button>'+
        '<button class="btn ghost" data-go="voc">Kelime</button>'+
      '</div>'+
      '<div class="sub" style="margin-top:10px;font-size:13px">Havuzda '+ts.reduce(function(a,t){return a+QCOUNT[t.id];},0)+' soru var.</div>'+
      '</div>';
    el.querySelectorAll("[data-dl]").forEach(function(b){b.addEventListener("click",function(){dLvl=b.dataset.dl;renderDrill();});});
    el.querySelectorAll("[data-go]").forEach(function(b){b.addEventListener("click",function(){startDrill("all",b.dataset.go);});});
    return;
  }
  if(!queue.length){
    el.innerHTML='<div class="card"><div class="empty"><b>Bu türde soru yok</b>Başka bir tür ya da seviye seç.</div>'+
      '<button class="btn full soft" id="rst">Geri dön</button></div>';
    $("rst").addEventListener("click",function(){queue=null;renderDrill();});
    return;
  }
  if(qi>=queue.length){
    var pc=sessTotal?Math.round(sessRight/sessTotal*100):0;
    el.innerHTML='<div class="card"><div class="lbl">Tur bitti</div>'+
      '<h1 class="mt num">'+sessRight+" / "+sessTotal+'</h1>'+
      '<div class="sub mt">Başarı: %'+pc+". "+(pc>=80?"Çok iyi, bu konu oturmuş.":(pc>=50?"Fena değil, bir tur daha at.":"Konu anlatımını tekrar oku, sonra yeniden dene."))+'</div>'+
      '<div class="btnrow" style="margin-top:13px">'+
        '<button class="btn" id="again">Yeni tur</button>'+
        '<button class="btn ghost" id="toTopics">Konulara dön</button></div></div>';
    $("again").addEventListener("click",function(){ startDrill(dScope,dType); });
    $("toTopics").addEventListener("click",function(){ queue=null; go("topics"); });
    return;
  }

  var it=queue[qi], t=it.t, prog=Math.round(qi/queue.length*100);
  var head='<div class="bar"><i style="width:'+prog+'%"></i></div>'+
    '<div class="qmeta mt"><span>'+esc(t.t)+'</span><span>'+(qi+1)+" / "+queue.length+'</span></div>';

  if(it.type==="mc"){
    var q=it.q;
    if(!it.opts){ it.opts=q.o.map(function(o,k){return {o:o,c:k===q.a};}); shuffle(it.opts); }
    el.innerHTML=head+'<div class="card">'+
      '<div class="lbl">Çoktan seçmeli</div>'+
      '<div class="qtext mt">'+esc(q.q).replace(/___/g,"<u>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</u>")+'</div>'+
      '<div style="margin-top:13px">'+it.opts.map(function(p,k){
        var cls="opt";
        if(ans!==null){ if(p.c) cls+=" right"; else if(k===ans) cls+=" wrong"; }
        return '<button class="'+cls+'" data-k="'+k+'"'+(ans!==null?" disabled":"")+'>'+esc(p.o===""?"(boş bırak)":p.o)+'</button>';
      }).join("")+'</div>'+
      (ans!==null?'<div class="fb '+(it.opts[ans].c?"good":"bad")+'">'+(it.opts[ans].c?"<b>Doğru. </b>":"<b>Yanlış. </b>")+esc(q.e||"")+'</div>'+
        '<button class="btn full" id="nx" style="margin-top:10px">Sıradaki</button>':'')+
      '</div>';
    el.querySelectorAll(".opt").forEach(function(b){
      b.addEventListener("click",function(){
        if(ans!==null) return;
        ans=+b.dataset.k; var ok=it.opts[ans].c;
        sessTotal++; if(ok) sessRight++;
        record(t.id,"mc",it.i,ok); renderDrill();
      });
    });
  }
  else if(it.type==="fill"){
    var q2=it.q;
    el.innerHTML=head+'<div class="card">'+
      '<div class="lbl">Klasik — boşluğu doldur</div>'+
      '<div class="qtext mt">'+esc(q2.q).replace(/___/g,"<u>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</u>")+'</div>'+
      '<div class="inpw" style="margin-top:13px">'+
        '<input class="search" id="fin" type="text" placeholder="Cevabını yaz" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"'+(ans!==null?" disabled":"")+' value="'+esc(it.typed||"")+'">'+
        (ans===null?'<button class="btn sm" id="chk" style="flex:0 0 auto;padding:0 16px">Kontrol</button>':'')+
      '</div>'+
      (ans!==null?'<div class="fb '+(ans?"good":"bad")+'" style="margin-top:10px">'+
        (ans?"<b>Doğru. </b>":"<b>Yanlış. </b>Doğru cevap: <b>"+esc(q2.a[0])+"</b>. ")+esc(q2.e||"")+
        (q2.a.length>1?' <span style="opacity:.75">Kabul edilen diğer biçimler: '+esc(q2.a.slice(1).join(" / "))+'</span>':'')+
        '</div><button class="btn full" id="nx" style="margin-top:10px">Sıradaki</button>'
        :'<div class="sub" style="margin-top:9px;font-size:13px">Büyük/küçük harf ve nokta önemli değil. Kısaltma da yazabilirsin.</div>')+
      '</div>';
    function check(){
      if(ans!==null) return;
      var v=$("fin").value; it.typed=v;
      var ok=q2.a.some(function(x){ return norm(x)===norm(v); });
      ans=ok?1:0; sessTotal++; if(ok) sessRight++;
      record(t.id,"fill",it.i,ok); renderDrill();
    }
    var ch=$("chk"); if(ch) ch.addEventListener("click",check);
    var fi=$("fin");
    if(fi&&ans===null){ fi.addEventListener("keydown",function(e){ if(e.key==="Enter"){e.preventDefault();check();} }); fi.focus(); }
  }
  else {
    var v=vocParts(it.q), tp=BYID[t.id];
    if(!it.opts){
      var others=shuffle(tp.voc.filter(function(x,k){return k!==it.i;}).slice()).slice(0,3).map(function(x){return vocParts(x).m;});
      while(others.length<3){ var r=vocParts(pick(pick(TOPICS).voc)); if(r.m!==v.m&&others.indexOf(r.m)<0) others.push(r.m); }
      it.opts=shuffle([{o:v.m,c:true}].concat(others.map(function(m){return {o:m,c:false};})));
    }
    el.innerHTML=head+'<div class="card">'+
      '<div class="lbl">Kelime</div>'+
      '<div class="qtext mt" style="font-family:var(--f-disp);font-size:28px">'+esc(v.w)+'</div>'+
      '<div style="margin-top:14px">'+it.opts.map(function(p,k){
        var cls="opt";
        if(ans!==null){ if(p.c) cls+=" right"; else if(k===ans) cls+=" wrong"; }
        return '<button class="'+cls+'" data-k="'+k+'"'+(ans!==null?" disabled":"")+'>'+esc(p.o)+'</button>';
      }).join("")+'</div>'+
      (ans!==null?'<div class="fb '+(it.opts[ans].c?"good":"bad")+'"><b>'+esc(v.w)+'</b> = '+esc(v.m)+'<br>'+
        '<span style="opacity:.85">'+esc(v.ex)+' — '+esc(v.tr)+'</span></div>'+
        '<button class="btn full" id="nx" style="margin-top:10px">Sıradaki</button>':'')+
      '</div>';
    el.querySelectorAll(".opt").forEach(function(b){
      b.addEventListener("click",function(){
        if(ans!==null) return;
        ans=+b.dataset.k; var ok=it.opts[ans].c;
        sessTotal++; if(ok) sessRight++;
        record(t.id,"voc",it.i,ok); renderDrill();
      });
    });
  }
  var nx=$("nx");
  if(nx) nx.addEventListener("click",function(){ qi++; ans=null; renderDrill(); });
}

/* ===================== KELİME ===================== */
var vTopic="all", vMode="list", vI=0, vFlip=false, vQ=null;
function vocPool(){
  var ts = vTopic==="all"?TOPICS:[BYID[vTopic]];
  var out=[];
  ts.forEach(function(t){ if(t) t.voc.forEach(function(v,i){ out.push({t:t,i:i,v:vocParts(v)}); }); });
  return out;
}
function renderVocab(){
  var el=$("v-vocab"), pool=vocPool();
  var head='<div class="card"><div class="lbl">Kelime çalışması</div>'+
    '<div class="sub mt">'+TOT_VOC+' kelime, her biri konusuyla ve örnek cümlesiyle. Kart modunda çevirip kendini dene.</div>'+
    '<div class="chips" style="margin-top:11px">'+
      '<button class="pick" data-vm="list" aria-pressed="'+(vMode==="list")+'">Liste</button>'+
      '<button class="pick" data-vm="card" aria-pressed="'+(vMode==="card")+'">Kart</button>'+
      '<button class="pick" data-vm="fav" aria-pressed="'+(vMode==="fav")+'">★ Favoriler</button>'+
    '</div>'+
    '<select class="search" id="vsel" style="margin-top:9px">'+
      '<option value="all"'+(vTopic==="all"?" selected":"")+'>Bütün konular ('+TOT_VOC+')</option>'+
      TOPICS.map(function(t){return '<option value="'+t.id+'"'+(vTopic===t.id?" selected":"")+'>'+esc(t.lvl+" · "+t.t)+' ('+t.voc.length+')</option>';}).join("")+
    '</select></div>';

  if(vMode==="card"){
    if(!vQ||vQ.len!==pool.length){ vQ={len:pool.length,arr:shuffle(pool.slice())}; vI=0; vFlip=false; }
    var arr=vQ.arr;
    if(!arr.length){ el.innerHTML=head+'<div class="card"><div class="empty"><b>Kelime yok</b></div></div>'; bindVoc(); return; }
    if(vI>=arr.length) vI=0;
    var c=arr[vI], key=c.t.id+"|v|"+c.i;
    el.innerHTML=head+
      '<div class="bar"><i style="width:'+Math.round(vI/arr.length*100)+'%"></i></div>'+
      '<div class="qmeta mt"><span>'+esc(c.t.t)+'</span><span>'+(vI+1)+" / "+arr.length+'</span></div>'+
      '<button class="fcard" id="vc" style="width:100%">'+
        '<span class="w">'+esc(c.v.w)+'</span>'+
        (vFlip?'<span class="m">'+esc(c.v.m)+'</span><span class="s">'+esc(c.v.ex)+'<em>'+esc(c.v.tr)+'</em></span>'
              :'<span class="h">anlamı için dokun</span>')+
      '</button>'+
      '<div class="btnrow">'+
        '<button class="btn ghost" id="vfav">'+(st.fav[key]?"★ Favoride":"☆ Favori")+'</button>'+
        '<button class="btn" id="vnext">Sıradaki</button>'+
      '</div>';
    $("vc").addEventListener("click",function(){ vFlip=!vFlip; renderVocab(); });
    $("vnext").addEventListener("click",function(){ vI++; vFlip=false; renderVocab(); });
    $("vfav").addEventListener("click",function(){ if(st.fav[key]) delete st.fav[key]; else st.fav[key]=1; save(); renderVocab(); });
    bindVoc(); return;
  }

  var list = pool;
  if(vMode==="fav"){
    list=[]; TOPICS.forEach(function(t){ t.voc.forEach(function(v,i){ if(st.fav[t.id+"|v|"+i]) list.push({t:t,i:i,v:vocParts(v)}); }); });
  }
  if(!list.length){
    el.innerHTML=head+'<div class="card"><div class="empty"><b>'+(vMode==="fav"?"Henüz favori yok":"Kelime yok")+'</b>'+
      (vMode==="fav"?"Kart modunda ★ Favori düğmesine basarak kelime ekleyebilirsin.":"")+'</div></div>';
    bindVoc(); return;
  }
  var html=head+'<div class="card">', last="";
  list.forEach(function(x){
    if(x.t.t!==last){ last=x.t.t; html+='<div class="lbl" style="padding:12px 0 4px;color:var(--accent)">'+esc(x.t.lvl+" · "+last)+'</div>'; }
    var k=x.t.id+"|v|"+x.i;
    html+='<div class="vrow"><div class="a">'+esc(x.v.w)+'</div><div class="b">'+esc(x.v.m)+
      '<em>'+esc(x.v.ex)+' — '+esc(x.v.tr)+'</em></div>'+
      '<button class="star" data-k="'+k+'" aria-pressed="'+(!!st.fav[k])+'" style="flex:0 0 30px;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:'+(st.fav[k]?"var(--b1)":"var(--ink3)")+'">'+(st.fav[k]?"★":"☆")+'</button></div>';
  });
  el.innerHTML=html+'</div>';
  el.querySelectorAll(".star").forEach(function(b){
    b.addEventListener("click",function(){ var k=b.dataset.k; if(st.fav[k]) delete st.fav[k]; else st.fav[k]=1; save(); renderVocab(); });
  });
  bindVoc();

  function bindVoc(){
    $("v-vocab").querySelectorAll("[data-vm]").forEach(function(b){
      b.addEventListener("click",function(){ vMode=b.dataset.vm; vQ=null; renderVocab(); });
    });
    var s=$("vsel"); if(s) s.addEventListener("change",function(){ vTopic=this.value; vQ=null; renderVocab(); });
  }
}

/* ===================== İLERLEME ===================== */
function renderProg(){
  var done=TOPICS.filter(function(t){return topicPct(t.id)>=80;}).length;
  var weak=TOPICS.filter(function(t){return st.read[t.id]&&topicPct(t.id)<50;})
    .sort(function(a,b){return topicPct(a.id)-topicPct(b.id);}).slice(0,6);
  var overall=Math.round(totalRight()/TOT_Q*100);
  var l=st.log[todayKey()]||{q:0,r:0};

  $("v-prog").innerHTML=
   '<div class="card"><div class="lbl">Genel durum</div>'+
   '<h1 class="mt num">%'+overall+'</h1>'+
   '<div class="sub">'+totalRight()+' / '+TOT_Q+' soru doğru cevaplandı</div>'+
   '<div class="bar" style="margin-top:11px"><i style="width:'+Math.max(overall,1)+'%"></i></div></div>'+
   '<div class="stats">'+
     '<div class="stat"><b class="num">'+done+'</b><span>bitmiş konu</span></div>'+
     '<div class="stat"><b class="num">'+Object.keys(st.read).length+'</b><span>okunan ders</span></div>'+
     '<div class="stat"><b class="num">'+streak()+'</b><span>gün serisi</span></div>'+
   '</div>'+
   '<div class="card"><div class="lbl">Bugün</div>'+
     '<div class="sub mt">'+(l.q|0)+' soru çözdün, '+(l.r|0)+' tanesi doğru.'+
     ((l.q|0)===0?" Hadi 20 soruluk bir tur at.":"")+'</div></div>'+
   (weak.length?'<div class="card"><div class="lbl">Zayıf konular</div>'+
     '<div class="sub mt" style="font-size:13px">Okudun ama soruların yarısından azını doğru yaptın. Önce buralara dön.</div>'+
     '<div class="tlist" style="margin-top:10px">'+weak.map(function(t){
       return '<button class="titem" data-id="'+t.id+'"><span class="n">'+t.lvl+'</span>'+
         '<span class="tt"><b>'+esc(t.t)+'</b></span>'+ring(topicPct(t.id))+'</button>';}).join("")+'</div></div>':'')+
   '<div class="card"><div class="lbl">Konu konu</div><div style="margin-top:8px">'+
     TOPICS.map(function(t){var p=topicPct(t.id);
       return '<div class="pline"><span class="t">'+esc(t.t)+'</span>'+
         '<span class="bar"><i style="width:'+p+'%"></i></span><span class="v">%'+p+'</span></div>';}).join("")+
   '</div></div>';
  $("v-prog").querySelectorAll(".titem").forEach(function(b){
    b.addEventListener("click",function(){ openId=b.dataset.id; go("lesson"); });
  });
}

/* ===================== BAŞLAT ===================== */
function renderAll(){
  if(view==="topics") renderTopics();
  else if(view==="lesson") renderLesson();
  else if(view==="drill") renderDrill();
  else if(view==="vocab") renderVocab();
  else if(view==="prog") renderProg();
}
renderTopics();
</script>
